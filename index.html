{en:'diet (food habits)',pt:'a alimentação',de:'die Ernährung',icon:'🥗',pos:'noun'},
{en:'to give up (a habit)',pt:'deixar de',de:'aufhören mit / aufgeben',icon:'🚭'},
{en:'to get better',pt:'melhorar',de:'sich erholen / besser werden',icon:'📈'},
{en:'to get worse',pt:'piorar',de:'sich verschlechtern / schlimmer werden',icon:'📉'},
{en:'stress',pt:'o stress',de:'der Stress',icon:'😵',pos:'noun'},
{en:'sleep',pt:'o sono',de:'der Schlaf',icon:'😴',pos:'noun'},
{en:'should',pt:'dever / devia',de:'sollen / sollte',icon:'👉'}
],
phrases:[
{en:'I’d like to make an appointment.',pt:'Queria marcar uma consulta.',de:'Ich möchte einen Termin vereinbaren.'},
{en:'What are your symptoms?',pt:'Quais são os sintomas?',de:'Was für Beschwerden haben Sie?'},
{en:'I’ve had a cough for a week.',pt:'Tenho tosse há uma semana.',de:'Ich habe seit einer Woche Husten.'},
{en:'I think I sprained my ankle.',pt:'Acho que torci o tornozelo.',de:'Ich glaube, ich habe mir den Knöchel verstaucht.'},
{en:'You should rest for a few days.',pt:'Devia descansar uns dias.',de:'Sie sollten sich ein paar Tage schonen.'},
{en:'Take one tablet twice a day.',pt:'Tome um comprimido duas vezes por dia.',de:'Nehmen Sie zweimal täglich eine Tablette.'},
{en:'Are you allergic to anything?',pt:'É alérgico a alguma coisa?',de:'Sind Sie gegen etwas allergisch?'},
{en:'You shouldn’t train with that injury.',pt:'Não devias treinar com essa lesão.',de:'Du solltest mit der Verletzung nicht trainieren.'},
{en:'I have terrible sore muscles after kickboxing.',pt:'Estou cheio de dores musculares depois do kickboxing.',de:'Ich habe fürchterlichen Muskelkater nach dem Kickboxen.'},
{en:'If I were you, I’d see a doctor.',pt:'Se fosse a ti, ia ao médico.',de:'An deiner Stelle würde ich zum Arzt gehen.'},
{en:'I feel much better, thanks.',pt:'Sinto-me muito melhor, obrigado.',de:'Ich fühle mich viel besser, danke.'}
],
grammar:[
{title:'Should: dever / sollen & sollte',en:'Advice and obligation. Portuguese dever in the present is strong (must/should); the imperfeito (devia) is the normal gentle “should”. German sollen is strong; sollte (Konjunktiv II) is the normal “should”.',
pt:'dever: devo, deves, deve, devemos, devem. Devias dormir mais (you should sleep more). Devia ter ligado (I should have called).',
de:'sollen: soll, sollst, soll, sollen, sollt, sollen. sollte, solltest, sollte, sollten, solltet, sollten. Du solltest mehr schlafen. Ich hätte anrufen sollen (I should have called, B2).',
examples:[
{en:'You should drink more water.',pt:'[Devias] beber mais água.',de:'Du [solltest] mehr Wasser trinken.'},
{en:'We should go to bed earlier.',pt:'[Devíamos] deitar-nos mais cedo.',de:'Wir [sollten] früher ins Bett gehen.'},
{en:'He shouldn’t smoke.',pt:'Ele não [devia] fumar.',de:'Er [sollte] nicht rauchen.'},
{en:'Should I call the doctor?',pt:'[Devo] ligar ao médico?',de:'[Soll] ich den Arzt anrufen?'},
{en:'You must take the medicine.',pt:'[Tens] de tomar o medicamento.',de:'Du [musst] das Medikament nehmen.'}
]},
{title:'Reflexive verbs with body parts and dative (DE)',en:'Hurting, washing or breaking a body part: German uses a dative reflexive (mir, dir, sich) plus the article; Portuguese uses the reflexive verb or the article without a possessive.',
pt:'Magoei-me no joelho. Parti a perna (no possessive: the article is enough). Lavo as mãos. Torci o tornozelo.',
de:'Ich habe mir das Knie verletzt. Ich habe mir das Bein gebrochen. Ich wasche mir die Hände. Dative reflexive: mir, dir, sich, uns, euch, sich. The body part takes the definite article, not a possessive.',
examples:[
{en:'I broke my arm.',pt:'Parti [o] braço.',de:'Ich habe [mir] den Arm gebrochen.'},
{en:'Wash your hands.',pt:'Lava [as] mãos.',de:'Wasch [dir] die Hände.'},
{en:'She hurt her knee.',pt:'Ela magoou-se [no] joelho.',de:'Sie hat [sich] das Knie verletzt.'},
{en:'Did you sprain your ankle?',pt:'Torceste [o] tornozelo?',de:'Hast du [dir] den Knöchel verstaucht?'},
{en:'I am brushing my teeth.',pt:'Estou a lavar [os] dentes.',de:'Ich putze [mir] die Zähne.'}
]},
{title:'Stopping and starting habits: deixar de, começar a / aufhören, anfangen + zu',en:'Verb + verb combinations with a preposition. Portuguese links with de / a + infinitive; German uses zu + infinitive at the end, often with a separable verb split around zu.',
pt:'deixar de fumar (stop smoking), começar a treinar (start training), continuar a comer (keep eating), acabar de chegar (have just arrived), voltar a tentar (try again).',
de:'aufhören zu rauchen / mit dem Rauchen aufhören, anfangen zu trainieren / mit dem Training anfangen, weiter essen (no zu), gerade angekommen sein (have just), es noch einmal versuchen. Separable verb + zu: anzufangen, aufzuhören.',
examples:[
{en:'I stopped smoking last year.',pt:'[Deixei] de fumar o ano passado.',de:'Ich habe letztes Jahr [aufgehört] zu rauchen.'},
{en:'She started training in January.',pt:'Ela [começou] a treinar em janeiro.',de:'Sie hat im Januar [angefangen] zu trainieren.'},
{en:'Keep taking the tablets.',pt:'[Continua] a tomar os comprimidos.',de:'Nimm die Tabletten [weiter].'},
{en:'I have just arrived.',pt:'[Acabei] de chegar.',de:'Ich bin [gerade] angekommen.'},
{en:'Try again tomorrow.',pt:'[Volta] a tentar amanhã.',de:'Versuch es morgen [noch] einmal.'}
]}
]},

],
phrases:[
{en:'Rents have increased a lot in Lisbon.',pt:'As rendas aumentaram muito em Lisboa.',de:'Die Mieten sind in Lissabon stark gestiegen.'},
{en:'There is too much traffic in the centre.',pt:'Há trânsito a mais no centro.',de:'In der Innenstadt gibt es zu viel Verkehr.'},
{en:'Glass is collected on Tuesdays.',pt:'O vidro é recolhido às terças.',de:'Glas wird dienstags abgeholt.'},
{en:'In Germany waste is separated very carefully.',pt:'Na Alemanha o lixo é separado com muito cuidado.',de:'In Deutschland wird der Müll sehr sorgfältig getrennt.'},
{en:'The bridge was built in 1966.',pt:'A ponte foi construída em 1966.',de:'Die Brücke wurde 1966 gebaut.'},
{en:'Smoking is not allowed here.',pt:'Não é permitido fumar aqui.',de:'Rauchen ist hier nicht erlaubt.'},
{en:'A new metro line is being built.',pt:'Está a ser construída uma nova linha de metro.',de:'Eine neue U-Bahn-Linie wird gebaut.'},
{en:'We should use public transport more.',pt:'Devíamos usar mais os transportes públicos.',de:'Wir sollten öfter die öffentlichen Verkehrsmittel nutzen.'},
{en:'Plastic bags have been banned.',pt:'Os sacos de plástico foram proibidos.',de:'Plastiktüten wurden verboten.'},
{en:'What can be done about it?',pt:'O que se pode fazer?',de:'Was kann man dagegen tun?'}
],
grammar:[
{title:'The passive: ser + particípio / werden + Partizip II',en:'Both languages form the passive with an auxiliary and the past participle. Portuguese uses ser (and the participle agrees); German uses werden (participle at the end, never agrees).',
pt:'Present: a ponte é construída. Past: a ponte foi construída. Future: será construída. The participle agrees: os sacos foram proibidos, as casas foram vendidas. Agent: por (pelo/pela).',
de:'Present: die Brücke wird gebaut. Past (Präteritum): die Brücke wurde gebaut. Perfekt: die Brücke ist gebaut worden. Agent: von + dative. Modal + passive: muss gebaut werden.',
table:{head:['English','Português','Deutsch'],rows:[['is built','é construída','wird gebaut'],['was built','foi construída','wurde gebaut'],['has been built','foi construída','ist gebaut worden'],['will be built','será / vai ser construída','wird gebaut werden'],['must be built','tem de ser construída','muss gebaut werden']]},
examples:[
{en:'The letters are sent on Monday.',pt:'As cartas [são] enviadas na segunda.',de:'Die Briefe [werden] am Montag verschickt.'},
{en:'The house was sold last year.',pt:'A casa [foi] vendida o ano passado.',de:'Das Haus [wurde] letztes Jahr verkauft.'},
{en:'The museum was opened by the president.',pt:'O museu foi inaugurado [pelo] presidente.',de:'Das Museum wurde [vom] Präsidenten eröffnet.'},
{en:'The waste must be separated.',pt:'O lixo tem de [ser] separado.',de:'Der Müll muss getrennt [werden].'},
{en:'German is spoken here.',pt:'Aqui [fala-se] alemão.',de:'Hier [wird] Deutsch gesprochen.'}
]},
{title:'Impersonal “one / people”: se / man',en:'For general statements without a subject, Portuguese uses the se-construction (fala-se, vende-se); German uses the pronoun man with the third person singular.',
pt:'Fala-se português. Vendem-se casas (plural agrees with the noun). Aqui come-se bem. Não se pode fumar. Como se diz…?',
de:'Man spricht Portugiesisch. Man verkauft Häuser. Hier isst man gut. Man darf nicht rauchen. Wie sagt man…? Accusative of man = einen, dative = einem.',
examples:[
{en:'Portuguese is spoken in Brazil.',pt:'No Brasil [fala-se] português.',de:'In Brasilien [spricht] man Portugiesisch.'},
{en:'You eat well here.',pt:'Aqui [come-se] bem.',de:'Hier isst [man] gut.'},
{en:'How do you say that in German?',pt:'Como [se] diz isso em alemão?',de:'Wie sagt [man] das auf Deutsch?'},
{en:'You can’t park here.',pt:'Não [se] pode estacionar aqui.',de:'Hier [darf] man nicht parken.'},
{en:'Flats for rent.',pt:'[Alugam-se] apartamentos.',de:'Wohnungen zu [vermieten].'}
]},
{title:'Talking about change: more and more, less and less, getting',en:'Trends and gradual change.',
pt:'cada vez mais (more and more), cada vez menos, está a ficar / tornar-se + adjective (is getting), aumentar / diminuir, há cada vez mais turistas.',
de:'immer mehr, immer weniger, immer + comparative (immer teurer = ever more expensive), werden + adjective (es wird kälter = it is getting colder), steigen / sinken.',
examples:[
{en:'Lisbon is getting more and more expensive.',pt:'Lisboa está a ficar [cada vez] mais cara.',de:'Lissabon wird [immer] teurer.'},
{en:'There are fewer and fewer shops.',pt:'Há cada vez [menos] lojas.',de:'Es gibt immer [weniger] Geschäfte.'},
{en:'The weather is getting colder.',pt:'O tempo está a [ficar] mais frio.',de:'Das Wetter [wird] kälter.'},
{en:'More and more people cycle.',pt:'Cada vez [mais] pessoas andam de bicicleta.',de:'Immer [mehr] Leute fahren Rad.'},
{en:'Prices went up ten percent.',pt:'Os preços [subiram] dez por cento.',de:'Die Preise sind um zehn Prozent [gestiegen].'}
]}
]},

phrases:[

{en:'According to the newspaper, there is a strike tomorrow.',pt:'Segundo o jornal, há greve amanhã.',de:'Laut Zeitung gibt es morgen einen Streik.'},
{en:'She said she was tired.',pt:'Ela disse que estava cansada.',de:'Sie sagte, dass sie müde sei.'},
{en:'He asked me if I was coming.',pt:'Ele perguntou-me se eu vinha.',de:'Er fragte mich, ob ich komme.'},
{en:'They promised to call back.',pt:'Prometeram ligar de volta.',de:'Sie haben versprochen zurückzurufen.'},
{en:'It’s important to check the source.',pt:'É importante verificar a fonte.',de:'Es ist wichtig, die Quelle zu prüfen.'},

],
grammar:[
{title:'Reported speech: shifting tenses',en:'Passing on what someone said. Portuguese shifts the tense back like English (present → imperfeito). Standard written German uses Konjunktiv I (sei, habe, komme); in speech most people use dass + indicative or simply the Konjunktiv II.',
pt:'“Estou cansada” → Ela disse que estava cansada. “Vou ligar” → Disse que ia ligar. “Fiz tudo” → Disse que tinha feito tudo. Questions: perguntou se…, perguntou onde…',
de:'Spoken: Sie sagte, dass sie müde ist / war. Written: Sie sagte, sie sei müde. “Ich komme” → Er sagte, er komme / dass er kommt. Questions: Er fragte, ob… (verb at end), Er fragte, wo…',
examples:[
{en:'She said she was hungry.',pt:'Ela disse que [tinha] fome.',de:'Sie sagte, dass sie Hunger [hatte].'},
{en:'He said he would come later.',pt:'Ele disse que [vinha] mais tarde.',de:'Er sagte, er [komme] später.'},
{en:'They asked where we lived.',pt:'Perguntaram [onde] morávamos.',de:'Sie fragten, [wo] wir wohnen.'},
{en:'She asked if I liked Berlin.',pt:'Perguntou [se] eu gostava de Berlim.',de:'Sie fragte, [ob] ich Berlin mag.'},
{en:'He said he had already eaten.',pt:'Disse que já [tinha] comido.',de:'Er sagte, er [habe] schon gegessen.'}
]},
{title:'Infinitive clauses: zu + infinitive (DE) and the personal infinitive (PT)',en:'“It is important to…”, “in order to…”. German attaches zu to the infinitive at the end; um … zu expresses purpose. Portuguese uses the infinitive directly, and can mark the subject on it (personal infinitive: para fazeres, antes de sairmos).',
pt:'É importante verificar a fonte. Para praticar alemão, oiço podcasts. Personal infinitive adds endings: (eu) falar, (tu) falares, (ele) falar, (nós) falarmos, (eles) falarem. É melhor saíres agora. Antes de irmos, come alguma coisa.',
de:'Es ist wichtig, die Quelle zu prüfen. Um Deutsch zu üben, höre ich Podcasts. Ich habe keine Zeit zu kochen. Ich habe vor, nach Berlin zu fahren. With separable verbs: anzurufen, aufzuhören. No zu after modals.',
examples:[
{en:'It is difficult to understand the news.',pt:'É difícil [perceber] as notícias.',de:'Es ist schwer, die Nachrichten [zu] verstehen.'},
{en:'I read the paper in order to learn words.',pt:'Leio o jornal [para] aprender palavras.',de:'Ich lese die Zeitung, [um] Wörter zu lernen.'},
{en:'I forgot to call you.',pt:'Esqueci-me de te [ligar].',de:'Ich habe vergessen, dich [anzurufen].'},
{en:'It is better for you to leave now.',pt:'É melhor [saíres] agora.',de:'Es ist besser, wenn du jetzt [gehst].'},
{en:'Before we go, let’s eat.',pt:'Antes de [irmos], vamos comer.',de:'Bevor wir [gehen], essen wir.'}
]},
{title:'Everything that, something that: tudo o que / alles, was',en:'Relative clauses after indefinite words. Portuguese: tudo o que, algo que, nada que. German uses was (not das) after alles, etwas, nichts, das (the thing), and after superlatives.',
pt:'tudo o que leio, algo que não percebo, nada que me interesse (subjunctive after nada, B2), o que (what = that which).',
de:'alles, was ich lese; etwas, was ich nicht verstehe; nichts, was mich interessiert; das Beste, was… The verb goes to the end as in all German relative clauses.',
examples:[
{en:'I don’t believe everything that I read.',pt:'Não acredito em tudo [o que] leio.',de:'Ich glaube nicht alles, [was] ich lese.'},
{en:'There is something I don’t understand.',pt:'Há algo [que] não percebo.',de:'Es gibt etwas, [was] ich nicht verstehe.'},
{en:'That is the best thing that happened.',pt:'Isso foi o melhor [que] aconteceu.',de:'Das ist das Beste, [was] passiert ist.'},
{en:'What he said is true.',pt:'[O que] ele disse é verdade.',de:'[Was] er gesagt hat, ist wahr.'}
]}
]},

grammar:[
{title:'The simple future: falarei / ich werde sprechen',en:'Both languages have a one-word or two-word future that is more formal or more emphatic than the present-tense future you already know. Portuguese also has “haver de” for firm intentions.',
pt:'Future: infinitive + -ei, -ás, -á, -emos, -ão: falarei, comerás, abrirá, iremos, serão. Irregular: farei (fazer), direi (dizer), trarei (trazer). Haver de: hei de, hás de, há de, havemos de, hão de + infinitive: Hei de conseguir! In speech, vou + infinitive remains the default.',
de:'werden + infinitive at the end: ich werde, du wirst, er wird, wir werden, ihr werdet, sie werden. Ich werde dich anrufen. Es wird regnen. Often used for promises and predictions; the present + time word stays the default for plans.',
table:{head:['English','Português','Deutsch'],rows:[['I will speak','falarei','ich werde sprechen'],['you will see','verás','du wirst sehen'],['it will be','será','es wird sein'],['we will go','iremos','wir werden gehen'],['they will do','farão','sie werden machen']]},
examples:[
{en:'I will call you tomorrow.',pt:'[Ligar-te-ei] amanhã. / Vou ligar-te amanhã.',de:'Ich [werde] dich morgen anrufen.'},
{en:'It will be a long winter.',pt:'[Será] um inverno longo.',de:'Es [wird] ein langer Winter.'},
{en:'We will see.',pt:'[Veremos].',de:'Wir [werden] sehen.'},
{en:'One day you will understand.',pt:'Um dia [compreenderás].',de:'Eines Tages [wirst] du es verstehen.'},
{en:'I will manage it!',pt:'[Hei] de conseguir!',de:'Ich [werde] es schaffen!'}
]},
{title:'Future time clauses: quando + future subjunctive / wenn, sobald + present',en:'“When I retire”, “as soon as we arrive”. Portuguese uses the future subjunctive (which for regular verbs looks like the infinitive, but irregulars differ: quando for, tiver, puder, fizer, vier). German uses wenn or sobald with the present tense, verb at the end.',
pt:'quando te reformares, quando formos, assim que chegarmos, logo que puderes, enquanto estiveres aqui, se vieres. Irregular future subjunctive comes from the eles perfeito: foram → for, tiveram → tiver, fizeram → fizer, vieram → vier, puderam → puder.',
de:'wenn du in Rente gehst, wenn wir ankommen, sobald wir ankommen, solange du hier bist, falls du kommst. Present tense, verb last.',
examples:[
{en:'When we arrive, we will call you.',pt:'Quando [chegarmos], ligamos-te.',de:'Wenn wir [ankommen], rufen wir dich an.'},
{en:'As soon as I can, I will come.',pt:'Assim que [puder], venho.',de:'Sobald ich [kann], komme ich.'},
{en:'When you are in Berlin, visit my parents.',pt:'Quando [estiveres] em Berlim, visita os meus pais.',de:'Wenn du in Berlin [bist], besuch meine Eltern.'},

{en:'While you are here, speak Portuguese.',pt:'Enquanto [estiveres] cá, fala português.',de:'Solange du hier [bist], sprich Portugiesisch.'}
]},

reading:{title:'Two winters',intro:'A short parallel text. Read your target language first; use the other two columns only when stuck.',
en:'In Oeiras, December is mild. People walk along the seafront in jackets, and the Christmas lights come on in the main square at the end of November. On the 24th the whole family meets for the Consoada: boiled cod with potatoes and cabbage, and afterwards too many desserts. The presents are opened at midnight, and the children stay up late.\nIn Zeca’s girlfriend’s home town in Germany, December is a different season. It gets dark at four, there is often snow, and the Christmas market opens on the first weekend of Advent. Her family goes there every year for Glühwein and roasted almonds. On Heiligabend they eat something simple, sing a few songs, and open the presents in the evening. On the 25th and 26th there are two long lunches with the grandparents.\nThis year they will spend Christmas in Portugal and New Year in Germany. Zeca has promised to try the goose, and she has promised to eat twelve raisins at midnight.',
pt:'Em Oeiras, dezembro é ameno. As pessoas passeiam à beira-mar de casaco, e as luzes de Natal acendem-se na praça principal no fim de novembro. No dia 24 a família toda junta-se para a Consoada: bacalhau cozido com batatas e couves e, a seguir, sobremesas a mais. As prendas abrem-se à meia-noite e as crianças ficam acordadas até tarde.\nNa cidade natal da namorada do Zeca, na Alemanha, dezembro é outra estação. Escurece às quatro, há muitas vezes neve, e o mercado de Natal abre no primeiro fim de semana do Advento. A família dela vai lá todos os anos beber Glühwein e comer amêndoas torradas. Na véspera de Natal comem algo simples, cantam algumas canções e abrem as prendas à noite. No dia 25 e no dia 26 há dois almoços longos com os avós.\nEste ano vão passar o Natal em Portugal e a passagem de ano na Alemanha. O Zeca prometeu provar o ganso, e ela prometeu comer doze passas à meia-noite.',
de:'In Oeiras ist der Dezember mild. Die Leute gehen in Jacken an der Uferpromenade spazieren, und Ende November geht die Weihnachtsbeleuchtung auf dem Hauptplatz an. Am 24. trifft sich die ganze Familie zur Consoada: gekochter Kabeljau mit Kartoffeln und Kohl und danach zu viele Nachspeisen. Die Geschenke werden um Mitternacht geöffnet, und die Kinder bleiben lange wach.\nIn der Heimatstadt von Zecas Freundin in Deutschland ist der Dezember eine andere Jahreszeit. Es wird um vier dunkel, oft liegt Schnee, und der Weihnachtsmarkt öffnet am ersten Adventswochenende. Ihre Familie geht jedes Jahr dorthin, um Glühwein zu trinken und gebrannte Mandeln zu essen. An Heiligabend essen sie etwas Einfaches, singen ein paar Lieder und packen abends die Geschenke aus. Am 25. und 26. gibt es zwei lange Mittagessen bei den Großeltern.\nDieses Jahr verbringen sie Weihnachten in Portugal und Silvester in Deutschland. Zeca hat versprochen, die Gans zu probieren, und sie hat versprochen, um Mitternacht zwölf Rosinen zu essen.',
questions:['What do Portuguese families traditionally eat on the 24th?','When does the German Christmas market open?','Where will they spend New Year, and what has each of them promised?']}}
]});

grammar:[
{title:'Past unreal: se tivesse feito, teria feito / hätte gemacht, wäre gegangen',en:'Regret and hindsight. Portuguese: past perfect subjunctive (tivesse + participle) in the if-clause and conditional perfect (teria + participle; spoken: tinha + participle) in the main clause. German: Konjunktiv II of haben/sein + participle in both clauses.',
pt:'Se tivesse estudado, teria passado (spoken: tinha passado). Se não tivesses vindo, não nos teríamos conhecido. Modal: devia ter ligado, podia ter sido pior.',
de:'Wenn ich gelernt hätte, hätte ich bestanden. Wenn du nicht gekommen wärst, hätten wir uns nicht kennengelernt. Modal with double infinitive: ich hätte anrufen sollen, es hätte schlimmer sein können.',
examples:[

{en:'If you hadn’t come, we wouldn’t have met.',pt:'Se não [tivesses] vindo, não nos teríamos conhecido.',de:'Wenn du nicht gekommen [wärst], hätten wir uns nicht kennengelernt.'},
{en:'I should have called.',pt:'[Devia] ter ligado.',de:'Ich hätte anrufen [sollen].'},
{en:'It could have been worse.',pt:'[Podia] ter sido pior.',de:'Es hätte schlimmer sein [können].'},
{en:'We would have stayed longer.',pt:'[Teríamos] ficado mais tempo.',de:'Wir [wären] länger geblieben.'}
]},
{title:'Cause and consequence connectors',en:'Beyond porque/weil: the connectors that organise a written argument, and the word order each one demands in German.',
pt:'como (since, at the start), visto que, uma vez que, dado que (given that), por isso, portanto, consequentemente, daí que (+ subjunctive), de modo que.',
de:'da (since, clause-initial, verb last), denn (for, verb second), deshalb / deswegen / daher (verb right after), folglich, somit, sodass (so that, verb last), infolgedessen.',
examples:[
{en:'Since it was late, we went home.',pt:'[Como] era tarde, fomos para casa.',de:'[Da] es spät war, gingen wir nach Hause.'},

reading:{title:'The flat we didn’t buy',intro:'Hindsight, conditionals and connectors in a short personal text.',
en:'Two years ago we almost bought a flat in Alcântara. It was on the fourth floor without a lift, but the light was extraordinary, and from the kitchen you could see a slice of the river. We hesitated for a week because the price was at the top of our budget, and by the time we decided, someone else had signed.\nFor months I regretted it. If we had been faster, we would have had a home near the water; if the bank had answered sooner, we would not have lost those three days. In hindsight, though, the delay saved us. A year later the building needed a new roof, and the owners had to pay a sum that would have wiped out our savings.\nIn short: the flat was beautiful, the timing was wrong, and luck did the rest. We still walk past it sometimes and look up at the windows.',
pt:'Há dois anos quase comprámos um apartamento em Alcântara. Era no quarto andar sem elevador, mas a luz era extraordinária e da cozinha via-se uma fatia do rio. Hesitámos uma semana porque o preço estava no limite do nosso orçamento e, quando nos decidimos, já outra pessoa tinha assinado.\nDurante meses arrependi-me. Se tivéssemos sido mais rápidos, teríamos uma casa perto da água; se o banco tivesse respondido mais cedo, não teríamos perdido aqueles três dias. Em retrospetiva, porém, o atraso salvou-nos. Um ano depois o prédio precisou de um telhado novo, e os proprietários tiveram de pagar uma quantia que teria liquidado as nossas poupanças.\nEm suma: o apartamento era lindo, o momento era errado, e a sorte fez o resto. Ainda passamos por lá às vezes e olhamos para as janelas.',
de:'Vor zwei Jahren hätten wir beinahe eine Wohnung in Alcântara gekauft. Sie lag im vierten Stock ohne Aufzug, aber das Licht war außergewöhnlich, und von der Küche aus sah man ein Stück Fluss. Wir zögerten eine Woche, weil der Preis am oberen Rand unseres Budgets lag, und als wir uns entschieden, hatte schon jemand anderes unterschrieben.\nMonatelang bereute ich es. Wären wir schneller gewesen, hätten wir ein Zuhause am Wasser gehabt; hätte die Bank früher geantwortet, hätten wir diese drei Tage nicht verloren. Im Nachhinein hat uns die Verzögerung jedoch gerettet. Ein Jahr später brauchte das Haus ein neues Dach, und die Eigentümer mussten eine Summe zahlen, die unsere Ersparnisse aufgezehrt hätte.\nKurz gesagt: Die Wohnung war schön, der Zeitpunkt war falsch, und das Glück erledigte den Rest. Wir gehen manchmal noch daran vorbei und schauen zu den Fenstern hinauf.',
questions:['Why did they hesitate?','What would have happened if they had bought it?','Find the three past-conditional constructions in your target language.']}},

grammar:[
{title:'Genitive prepositions and nominal style (DE) / formal prepositions (PT)',en:'Formal German prefers nouns to verbs (“after receipt of” instead of “after we received”) and uses genitive prepositions: wegen, trotz, während, aufgrund, bezüglich, anlässlich, innerhalb, außerhalb. Portuguese formal style uses equivalent phrases with de.',
pt:'devido a, apesar de, durante, no âmbito de, relativamente a, por ocasião de, no prazo de, fora de. Nominal style: após a receção do pagamento (= depois de recebermos o pagamento).',

{en:'Within a week of receipt of the invoice.',pt:'No [prazo] de uma semana após a receção da fatura.',de:'[Innerhalb] einer Woche nach Erhalt der Rechnung.'},
{en:'Regarding your request, we confirm the date.',pt:'[Relativamente] ao seu pedido, confirmamos a data.',de:'[Bezüglich] Ihrer Anfrage bestätigen wir den Termin.'}

{title:'Very formal Portuguese: mesóclise, and German “Sie” consistency',en:'Two register markers. In formal written European Portuguese, object pronouns can be inserted inside future and conditional verbs (mesóclise): enviar-lhe-ei. In German, formal writing keeps Sie/Ihnen/Ihr capitalised throughout and avoids contractions.',
pt:'enviar-lhe-ei (I will send you), dir-lhe-ia (I would tell you), agradecer-lhe-íamos. In speech, use vou enviar-lhe / enviava-lhe instead. Formal address: V. Exa. (Vossa Excelência), o Senhor Doutor, a Senhora Engenheira (titles matter in Portugal).',
de:'Sie, Ihnen, Ihr/Ihre always capitalised. Avoid: ich würd’, gibt’s. Prefer: Ich würde, es gibt. Titles: Herr Dr. Müller, Frau Professorin Schmidt; the surname is always used, never the first name alone.',
examples:[
{en:'I will send you the documents tomorrow.',pt:'[Enviar-lhe-ei] os documentos amanhã.',de:'Ich werde [Ihnen] die Unterlagen morgen zusenden.'},
{en:'We would be grateful for a reply.',pt:'[Agradecer-lhe-íamos] uma resposta.',de:'Wir wären [Ihnen] für eine Antwort dankbar.'},
{en:'I will inform you as soon as possible.',pt:'[Informá-lo-ei] o mais brevemente possível.',de:'Ich werde [Sie] schnellstmöglich informieren.'},
{en:'Dear Dr. Silva,',pt:'Exmo. Senhor [Doutor] Silva,',de:'Sehr geehrter Herr [Dr.] Silva,'}
]}
],
reading:{title:'Notice to a landlord',intro:'A formal letter in all three languages. Compare the openings and closings.',
en:'Dear Mrs Weber,\nI am writing with reference to the tenancy agreement for the flat at Lindenstraße 14, which began on 1 September 2024. I hereby give notice on the agreement with effect from 31 March 2026, in accordance with the three-month notice period set out in clause 7.\nI would be grateful if you could confirm receipt of this letter and propose a date for the handover inspection during the last week of March. The deposit should be returned to the account from which the rent has been paid.\nThank you for the pleasant cooperation over the past years.\nKind regards,\nJosé Costa',
pt:'Exma. Senhora D. Weber,\nVenho por este meio contactá-la relativamente ao contrato de arrendamento do apartamento sito na Lindenstraße 14, iniciado a 1 de setembro de 2024. Comunico a rescisão do referido contrato com efeitos a 31 de março de 2026, em conformidade com o pré-aviso de três meses previsto na cláusula 7.\nAgradecia que confirmasse a receção desta carta e que propusesse uma data para a vistoria de entrega durante a última semana de março. A caução deverá ser devolvida para a conta a partir da qual a renda tem sido paga.\nAgradeço a agradável colaboração ao longo destes anos.\nCom os melhores cumprimentos,\nJosé Costa',
de:'Sehr geehrte Frau Weber,\nich schreibe Ihnen bezüglich des Mietvertrags für die Wohnung in der Lindenstraße 14, der am 1. September 2024 begonnen hat. Hiermit kündige ich den Mietvertrag fristgerecht zum 31. März 2026, entsprechend der in Paragraph 7 festgelegten Kündigungsfrist von drei Monaten.\nIch wäre Ihnen dankbar, wenn Sie den Erhalt dieses Schreibens bestätigen und einen Termin für die Wohnungsübergabe in der letzten Märzwoche vorschlagen könnten. Die Kaution bitte ich auf das Konto zurückzuüberweisen, von dem die Miete gezahlt wurde.\nVielen Dank für die angenehme Zusammenarbeit in den vergangenen Jahren.\nMit freundlichen Grüßen\nJosé Costa',
questions:['Which clause sets the notice period?','What two things does the writer ask the landlord to do?','Note how “hereby” is rendered in each language.']}},

grammar:[
{title:'German modal particles: doch, mal, ja, eben, halt, denn',en:'Unstressed words that colour the tone. They sit after the verb and pronouns, and are almost never translated word for word. Portuguese achieves the same with intonation and markers like lá, então, cá.',
pt:'Rough equivalents: doch (contradiction) → mas / pois; mal (softening a request) → lá (anda lá, vê lá); ja (shared knowledge) → já sabes / então; eben, halt (resignation) → pronto / enfim; denn (interest in a question) → então / afinal.',
de:'Komm doch mit! (go on, come). Schau mal. (just have a look). Das ist ja toll! (as we both can see). Es ist eben teuer. (that’s just how it is). Was machst du denn hier? (friendly interest). Das ist halt so.',
examples:[
{en:'Go on, come with us!',pt:'Anda [lá], vem connosco!',de:'Komm [doch] mit!'},
{en:'Just have a look.',pt:'Vê [lá].',de:'Schau [mal].'},
{en:'What are you doing here, then?',pt:'[Então] o que fazes aqui?',de:'Was machst du [denn] hier?'},
{en:'That’s just the way it is.',pt:'[Pronto], é assim.',de:'Das ist [eben] so.'},
{en:'But that’s great!',pt:'[Mas] isso é ótimo!',de:'Das ist [ja] toll!'}
]},
{title:'Portuguese discourse markers and clitic flavour: pois, pronto, lá, cá',en:'Portugal’s conversational glue. Pois agrees; pronto closes or resets; lá and cá soften commands or add distance/closeness; então opens or links.',
pt:'Pois é. (Yeah, right.) Pronto, já está. (Ok, done.) Diz lá. (Go on, tell me.) Anda cá. (Come here.) Então, como correu? (So, how did it go?) Ora bem… (Right then…) Se calhar. (Maybe.)',
de:'Rough equivalents: pois é → genau / tja; pronto → so, fertig / na gut; diz lá → sag schon; anda cá → komm her; então → also, na; ora bem → also gut.',
examples:[
{en:'Yeah, that’s right.',pt:'[Pois] é.',de:'[Genau].'},
{en:'Right, done.',pt:'[Pronto], já está.',de:'[So], fertig.'},
{en:'Go on, tell me.',pt:'Diz [lá].',de:'Sag [schon].'},
{en:'So, how did it go?',pt:'[Então], como correu?',de:'[Na], wie war’s?'},
{en:'Maybe it rains.',pt:'[Se calhar] chove.',de:'[Vielleicht] regnet es.'}
]}
],
reading:{title:'Sunday morning',intro:'A short dialogue, colloquial register. Notice the particles and fillers.',
en:'“So, what are we doing today?”\n“Well, I was thinking of the market, and then maybe the beach.”\n“Hm. The beach is not really my thing in November.”\n“Oh come on, just for a walk. It’s sunny!”\n“Fine. But first coffee. I’m not going anywhere without coffee.”\n“Obviously. By the way, your mother called. Something about Christmas.”\n“Again? She already asked three times. Whatever, I’ll call her later.”\n“Right, done. Coffee, market, beach. And tonight I cook.”\n“You cook? That’s great. What?”\n“You’ll see. It’s a piece of cake.”\n“That’s what you said last time.”',
pt:'«Então, o que fazemos hoje?»\n«Olha, estava a pensar no mercado e depois, se calhar, na praia.»\n«Hum. A praia em novembro não é bem a minha praia.»\n«Anda lá, só para dar um passeio. Está sol!»\n«Pronto. Mas primeiro café. Não vou a lado nenhum sem café.»\n«Claro. Já agora, a tua mãe ligou. Qualquer coisa sobre o Natal.»\n«Outra vez? Já perguntou três vezes. Enfim, ligo-lhe mais tarde.»\n«Pronto, está decidido. Café, mercado, praia. E hoje à noite cozinho eu.»\n«Tu cozinhas? Isso é ótimo. O quê?»\n«Vais ver. É canja.»\n«Foi o que disseste da última vez.»',
de:'„Also, was machen wir heute?“\n„Na ja, ich dachte an den Markt und dann vielleicht an den Strand.“\n„Hm. Der Strand im November ist nicht so mein Ding.“\n„Ach komm, nur für einen Spaziergang. Die Sonne scheint doch!“\n„Na gut. Aber erst mal Kaffee. Ohne Kaffee gehe ich nirgendwohin.“\n„Klar. Übrigens, deine Mutter hat angerufen. Irgendwas wegen Weihnachten.“\n„Schon wieder? Sie hat doch schon dreimal gefragt. Egal, ich ruf sie später an.“\n„So, fertig. Kaffee, Markt, Strand. Und heute Abend koche ich.“\n„Du kochst? Das ist ja toll. Was denn?“\n„Wirst du sehen. Ein Kinderspiel.“\n„Das hast du letztes Mal auch gesagt.“',
questions:['Which particle softens “come on” in German, and which word does the same in Portuguese?','How is “piece of cake” rendered in your target language?']}},

grammar:[
{title:'Participles as adjectives (DE) and the double participle (PT)',en:'German uses both participles before nouns: Partizip I (-end, “-ing”: die wachsende Zahl) and Partizip II (installiert: die installierte Version). Portuguese uses the past participle as an adjective; some verbs have two forms, regular for the tense and short for the adjective.',
pt:'a versão instalada, os dados recolhidos, a porta aberta. Double participles: aceitar → aceitado (tense: tinha aceitado) / aceite (adjective: está aceite); entregar → entregado / entregue; salvar → salvado / salvo; imprimir → imprimido / impresso; pagar → pagado / pago; ganhar → ganhado / ganho.',
de:'Partizip I: wachsend, steigend, laufend, folgend → die steigenden Preise, im folgenden Jahr. Partizip II: installiert, gespeichert, verbunden → die gespeicherten Daten, das verbundene Gerät. They take normal adjective endings.',
examples:[
{en:'the installed version',pt:'a versão [instalada]',de:'die [installierte] Version'},
{en:'the stored data',pt:'os dados [armazenados]',de:'die [gespeicherten] Daten'},
{en:'rising prices',pt:'os preços [crescentes]',de:'die [steigenden] Preise'},
{en:'The invoice is paid.',pt:'A fatura está [paga].',de:'Die Rechnung ist [bezahlt].'},
{en:'the following year',pt:'no ano [seguinte]',de:'im [folgenden] Jahr'}
]},
{title:'Ongoing actions: estar a + infinitive (PT) vs gerund; “gerade” (DE)',en:'European Portuguese marks ongoing action with estar a + infinitive where Brazil uses the -ndo gerund. The gerund survives in Portugal in written style and after certain verbs. German has no continuous form: it uses gerade or simply the present.',
pt:'Está a carregar (PT) = está carregando (BR). Written/literary: Saiu correndo. Also: continuar a fazer, andar a fazer (doing lately), ir fazendo (doing gradually).',
de:'Das Gerät wird gerade geladen. Ich arbeite gerade. Ich bin dabei, den Bericht zu schreiben (I am in the middle of). Colloquial: ich bin am Arbeiten.',
examples:[
{en:'The program is running.',pt:'O programa está [a] correr.',de:'Das Programm [läuft] gerade.'},
{en:'I am writing the report at the moment.',pt:'Estou [a] escrever o relatório.',de:'Ich bin [dabei], den Bericht zu schreiben.'},
{en:'He is still updating the system.',pt:'Ele ainda [está] a atualizar o sistema.',de:'Er aktualisiert das System [noch].'},
{en:'We have been testing it lately.',pt:'[Andamos] a testá-lo.',de:'Wir testen es [in letzter Zeit].'}
]}
],
reading:{title:'How a warehouse robot finds a box',intro:'A technical explanation in neutral register.',
en:'A modern warehouse robot does not know where anything is. It knows only where it is told to go. When an order arrives, the warehouse management system looks up the shelf location of each item and calculates the shortest route between them. That route is sent to the robot as a list of coordinates.\nThe robot moves along painted lines or QR codes on the floor and reads each code as it passes. Every few milliseconds it compares the code it has read with the position it expects; if the two differ, it slows down and corrects its path. Sensors at the front detect people or obstacles and stop the robot before contact.\nWhen it reaches the shelf, a lifting arm raises the box a few centimetres and carries it to a packing station. The system then marks the item as picked and the stock level is updated automatically. The whole cycle takes less than two minutes.',
pt:'Um robô de armazém moderno não sabe onde está nada. Sabe apenas para onde lhe mandam ir. Quando chega uma encomenda, o sistema de gestão de armazém procura a localização de cada artigo nas prateleiras e calcula o percurso mais curto entre eles. Esse percurso é enviado ao robô como uma lista de coordenadas.\nO robô desloca-se ao longo de linhas pintadas ou de códigos QR no chão e lê cada código à passagem. De poucos em poucos milissegundos compara o código lido com a posição esperada; se forem diferentes, abranda e corrige a trajetória. Sensores na frente detetam pessoas ou obstáculos e param o robô antes do contacto.\nAo chegar à prateleira, um braço elevatório levanta a caixa alguns centímetros e transporta-a até uma estação de embalagem. O sistema marca então o artigo como recolhido e o nível de stock é atualizado automaticamente. O ciclo completo demora menos de dois minutos.',
de:'Ein moderner Lagerroboter weiß nicht, wo sich irgendetwas befindet. Er weiß nur, wohin er geschickt wird. Wenn eine Bestellung eingeht, sucht das Lagerverwaltungssystem den Regalplatz jedes Artikels und berechnet die kürzeste Route zwischen ihnen. Diese Route wird dem Roboter als Liste von Koordinaten übermittelt.\nDer Roboter fährt entlang aufgemalter Linien oder QR-Codes auf dem Boden und liest jeden Code beim Passieren. Alle paar Millisekunden vergleicht er den gelesenen Code mit der erwarteten Position; weichen beide voneinander ab, bremst er ab und korrigiert seinen Weg. Sensoren an der Vorderseite erkennen Personen oder Hindernisse und stoppen den Roboter vor der Berührung.\nAm Regal angekommen, hebt ein Hubarm die Kiste einige Zentimeter an und bringt sie zu einer Packstation. Das System markiert den Artikel dann als entnommen, und der Lagerbestand wird automatisch aktualisiert. Der gesamte Zyklus dauert weniger als zwei Minuten.',
questions:['What does the robot compare every few milliseconds?','Find two passive constructions in your target language.','How is “at the shelf, having arrived” expressed in German and in Portuguese?']}},

{title:'Two-part connectors',en:'Paired connectors structure comparisons and alternatives. Watch German word order: after “je” the verb goes to the end, after “desto” it comes immediately.',
pt:'não só… mas também; quanto mais… mais (quanto menos… menos); ou… ou; nem… nem; tanto… como (both… and); por um lado… por outro.',
de:'nicht nur… sondern auch; je + comparative (verb last)… desto + comparative (verb second); entweder… oder; weder… noch; sowohl… als auch; einerseits… andererseits; zwar… aber.',

{title:'Purpose and condition: para que, caso, a não ser que (+ subjunctive) / damit, falls, es sei denn',en:'Clauses of purpose and condition. In Portuguese the conjunctions para que, caso, a não ser que, desde que, sem que all require the present subjunctive. German uses damit, falls, es sei denn, solange, ohne dass with the ordinary indicative, verb at the end.',
pt:'para que paguem (so that they pay), caso chova (in case it rains), a não ser que mude (unless it changes), desde que trabalhes (as long as you work), sem que ninguém saiba (without anyone knowing). Purpose with the same subject: para + infinitive.',
de:'damit sie zahlen, falls es regnet, es sei denn, es ändert sich (verb second after es sei denn), solange du arbeitest, ohne dass jemand es weiß. Same subject: um … zu + infinitive.',

{en:'In case it rains, take an umbrella.',pt:'Caso [chova], leva um guarda-chuva.',de:'[Falls] es regnet, nimm einen Schirm mit.'},

reading:{title:'Two housing debates',intro:'A short comparative text in the register of a newspaper feature.',
en:'Lisbon and Berlin have the same argument with different accents. In both cities rents rose faster than wages for a decade, and in both the political debate has split along a familiar line: one side demands more building and fewer rules, the other demands rent limits and stronger tenant protection.\nBerlin tried the second route first. A city-wide rent cap was introduced in 2020 and struck down by the constitutional court a year later, so the debate moved to the federal level and to the question of whether the city should buy back flats from large landlords. Lisbon, by contrast, leaned on tax incentives for construction and on programmes for young tenants, while short-term tourist rentals became the symbol of everything that had gone wrong.\nThe more the two cities try, the clearer it becomes that neither supply alone nor regulation alone solves the problem. Unless wages, construction and rules move together, the next decade will look much like the last.',
pt:'Lisboa e Berlim têm a mesma discussão com sotaques diferentes. Em ambas as cidades as rendas subiram mais depressa do que os salários durante uma década, e em ambas o debate político dividiu-se ao longo de uma linha conhecida: um lado exige mais construção e menos regras, o outro exige limites às rendas e maior proteção dos inquilinos.\nBerlim tentou primeiro o segundo caminho. Um teto às rendas em toda a cidade foi introduzido em 2020 e anulado pelo tribunal constitucional um ano depois, pelo que o debate passou para o nível federal e para a questão de saber se a cidade deveria recomprar apartamentos a grandes senhorios. Lisboa, pelo contrário, apoiou-se em incentivos fiscais à construção e em programas para jovens inquilinos, enquanto o alojamento local se tornava o símbolo de tudo o que tinha corrido mal.\nQuanto mais as duas cidades tentam, mais claro se torna que nem a oferta por si só nem a regulação por si só resolvem o problema. A não ser que salários, construção e regras avancem em conjunto, a próxima década será muito parecida com a última.',
de:'Lissabon und Berlin führen denselben Streit mit unterschiedlichem Akzent. In beiden Städten stiegen die Mieten ein Jahrzehnt lang schneller als die Löhne, und in beiden hat sich die politische Debatte entlang einer vertrauten Linie gespalten: Die eine Seite fordert mehr Bauen und weniger Regeln, die andere Mietobergrenzen und einen stärkeren Mieterschutz.\nBerlin versuchte zuerst den zweiten Weg. Ein stadtweiter Mietendeckel wurde 2020 eingeführt und ein Jahr später vom Verfassungsgericht gekippt, sodass sich die Debatte auf die Bundesebene verlagerte und auf die Frage, ob die Stadt Wohnungen von großen Vermietern zurückkaufen sollte. Lissabon setzte dagegen auf Steueranreize für den Bau und auf Programme für junge Mieter, während die Kurzzeitvermietung an Touristen zum Symbol für alles wurde, was schiefgelaufen war.\nJe mehr die beiden Städte versuchen, desto deutlicher wird, dass weder das Angebot allein noch die Regulierung allein das Problem löst. Wenn sich Löhne, Bautätigkeit und Regeln nicht gemeinsam bewegen, wird das nächste Jahrzehnt dem letzten sehr ähnlich sehen.',
questions:['What happened to Berlin’s rent cap?','Which two-part connectors appear in the last paragraph?','What does the text say is needed for the next decade to be different?']}}
]});

reading:{title:'The last ferry',intro:'A short piece of original narrative using the literary tenses.',
en:'By the time Inês reached the quay the last ferry had already pulled away, and the lights of Cacilhas trembled on the water like something remembered rather than seen. She had run the length of Rua do Arsenal for nothing. She stood there, breathing, and watched the gap widen.\nIt was not the ferry that mattered. She could take a taxi across the bridge; she had done it before. What mattered was that she had promised to be on this one, at this hour, and that he would be standing on the other side with the coat she had forgotten, counting the people coming down the ramp and not finding her.\nShe took out her phone, then put it back. He would call. He always called first. The river smelled of diesel and salt, and somewhere behind her a tram bell rang twice, as if to say: well, then. What now?',
pt:'Quando Inês chegou ao cais, o último cacilheiro já se afastara, e as luzes de Cacilhas tremiam na água como algo recordado e não visto. Correra a Rua do Arsenal inteira para nada. Ficou ali, a respirar, a ver a distância alargar-se.\nNão era o barco que importava. Podia apanhar um táxi pela ponte; já o fizera antes. O que importava era que prometera estar naquele, àquela hora, e que ele estaria do outro lado com o casaco que ela se esquecera, a contar as pessoas que desciam a rampa sem a encontrar.\nTirou o telemóvel e voltou a guardá-lo. Ele ligaria. Ligava sempre primeiro. O rio cheirava a gasóleo e a sal, e algures atrás dela a campainha de um elétrico tocou duas vezes, como quem diz: pronto. E agora?',
de:'Als Inês den Kai erreichte, hatte die letzte Fähre bereits abgelegt, und die Lichter von Cacilhas zitterten auf dem Wasser wie etwas Erinnertes, nicht etwas Gesehenes. Sie war die ganze Rua do Arsenal umsonst entlanggerannt. Sie stand da, atmete, und sah zu, wie der Abstand wuchs.\nEs war nicht die Fähre, die zählte. Sie konnte ein Taxi über die Brücke nehmen; das hatte sie schon einmal getan. Was zählte, war, dass sie versprochen hatte, auf dieser hier zu sein, zu dieser Stunde, und dass er auf der anderen Seite stehen würde, mit dem Mantel, den sie vergessen hatte, und die Leute zählen würde, die die Rampe herunterkamen, ohne sie zu finden.\nSie nahm ihr Handy heraus und steckte es wieder ein. Er würde anrufen. Er rief immer zuerst an. Der Fluss roch nach Diesel und Salz, und irgendwo hinter ihr läutete zweimal die Glocke einer Straßenbahn, als wollte sie sagen: Nun denn. Und jetzt?',
questions:['Find three pluperfect forms in your target language.','Which sentences are free indirect speech (Inês’s thoughts in the narrator’s tense)?','How is “as if to say” rendered in each language?']}},

{title:'Funktionsverbgefüge and their Portuguese cousins',en:'Formal German replaces simple verbs with verb + noun combinations: eine Entscheidung treffen (entscheiden), zur Anwendung kommen (angewendet werden), in Betracht ziehen (erwägen). Portuguese formal style does the same: tomar uma decisão, proceder à análise, dar início a.',
pt:'tomar uma decisão, proceder a (uma análise), dar início a, pôr em prática, levar a cabo, ter em consideração, fazer referência a, estar em vigor, entrar em vigor.',
de:'eine Entscheidung treffen, zur Anwendung kommen, in Betracht ziehen, in Kraft treten, zur Verfügung stehen, Bezug nehmen auf, in Frage stellen, zum Ausdruck bringen, eine Rolle spielen.',

{en:'The new rule comes into force in January.',pt:'A nova regra [entra] em vigor em janeiro.',de:'Die neue Regel [tritt] im Januar in Kraft.'},

{en:'The budget is available to the team.',pt:'O orçamento está à [disposição] da equipa.',de:'Das Budget steht dem Team zur [Verfügung].'},
{en:'The author questions this assumption.',pt:'O autor [põe] em causa este pressuposto.',de:'Der Autor [stellt] diese Annahme in Frage.'},

]},
{title:'Compressed clauses: Partizipialkonstruktionen (DE) and the compound personal infinitive (PT)',en:'Academic style compresses subordinate clauses. German puts a whole clause before a noun as an extended participle (die im Rahmen des Projekts erhobenen Daten). Portuguese uses the personal infinitive, including the compound form (por terem sido recolhidos, apesar de termos analisado).',
pt:'Compound personal infinitive: ter + participle with personal endings: por termos analisado (because we analysed), depois de terem sido recolhidos (after they were collected), apesar de ter sido aprovado (although it was approved). Also the gerund in writing: tendo em conta, considerando.',
de:'Extended attribute: die [im Rahmen des Projekts erhobenen] Daten = die Daten, die im Rahmen des Projekts erhoben wurden. der [von der Kommission vorgeschlagene] Ansatz. die [noch zu klärenden] Fragen (zu + Partizip I = that must be clarified).',
examples:[
{en:'the data collected within the project',pt:'os dados [recolhidos] no âmbito do projeto',de:'die im Rahmen des Projekts [erhobenen] Daten'},
{en:'the approach proposed by the commission',pt:'a abordagem [proposta] pela comissão',de:'der von der Kommission [vorgeschlagene] Ansatz'},
{en:'the questions still to be clarified',pt:'as questões ainda por [esclarecer]',de:'die noch zu [klärenden] Fragen'},
{en:'After the data had been analysed, the team met.',pt:'Depois de os dados [terem] sido analisados, a equipa reuniu-se.',de:'Nachdem die Daten analysiert worden [waren], traf sich das Team.'},
{en:'Although we had tested the system, errors occurred.',pt:'Apesar de [termos] testado o sistema, ocorreram erros.',de:'Obwohl wir das System getestet [hatten], traten Fehler auf.'}
]}
],
reading:{title:'Executive summary: pilot of a picking robot',intro:'A business report in the three languages. Compare how each compresses information.',
en:'Objective. The pilot assessed whether a single autonomous picking robot could reduce order-processing time in the Oeiras distribution centre without increasing error rates.\nMethod. Over a period of twelve weeks, 4,800 orders were processed by the robot and compared with 4,800 orders of similar size picked manually in the same zone. Processing time, picking errors and operator interventions were recorded for both groups.\nFindings. Average processing time fell from 7.4 to 4.9 minutes per order. Picking errors decreased from 1.8 % to 0.6 %. However, operator interventions were required in 11 % of robot orders, mostly owing to mislabelled shelf locations rather than to the robot itself.\nConclusion. The results support an extension of the pilot to a second zone, provided that shelf labelling is corrected beforehand. A decision on full deployment should be taken only after the extended pilot has been evaluated.',
pt:'Objetivo. O projeto-piloto avaliou se um único robô autónomo de picking poderia reduzir o tempo de processamento de encomendas no centro de distribuição de Oeiras sem aumentar a taxa de erros.\nMétodo. Ao longo de doze semanas, foram processadas 4.800 encomendas pelo robô e comparadas com 4.800 encomendas de dimensão semelhante recolhidas manualmente na mesma zona. Registaram-se, para ambos os grupos, o tempo de processamento, os erros de picking e as intervenções dos operadores.\nResultados. O tempo médio de processamento desceu de 7,4 para 4,9 minutos por encomenda. Os erros de picking diminuíram de 1,8 % para 0,6 %. Contudo, foram necessárias intervenções dos operadores em 11 % das encomendas do robô, sobretudo devido a localizações de prateleira mal etiquetadas e não ao robô em si.\nConclusão. Os resultados sustentam o alargamento do piloto a uma segunda zona, desde que a etiquetagem das prateleiras seja corrigida previamente. A decisão sobre a implementação total só deverá ser tomada depois de o piloto alargado ter sido avaliado.',
de:'Zielsetzung. Der Pilotversuch bewertete, ob ein einzelner autonomer Kommissionierroboter die Auftragsbearbeitungszeit im Distributionszentrum Oeiras verkürzen kann, ohne die Fehlerquote zu erhöhen.\nMethode. Über einen Zeitraum von zwölf Wochen wurden 4.800 Aufträge vom Roboter bearbeitet und mit 4.800 Aufträgen ähnlicher Größe verglichen, die in derselben Zone manuell kommissioniert wurden. Für beide Gruppen wurden Bearbeitungszeit, Kommissionierfehler und Eingriffe durch Mitarbeitende erfasst.\nErgebnisse. Die durchschnittliche Bearbeitungszeit sank von 7,4 auf 4,9 Minuten pro Auftrag. Die Kommissionierfehler gingen von 1,8 % auf 0,6 % zurück. Allerdings waren bei 11 % der Roboteraufträge Eingriffe durch Mitarbeitende erforderlich, überwiegend aufgrund falsch beschrifteter Regalplätze und nicht wegen des Roboters selbst.\nSchlussfolgerung. Die Ergebnisse sprechen für eine Ausweitung des Pilotversuchs auf eine zweite Zone, sofern die Regalbeschriftung zuvor korrigiert wird. Eine Entscheidung über den vollständigen Einsatz sollte erst nach Auswertung des erweiterten Pilotversuchs getroffen werden.',
questions:['What caused most operator interventions?','Find the condition (“provided that / sofern / desde que”) in your target language and note the verb mood.','How does each language say “a decision should be taken”?']}},

grammar:[
{title:'Portuguese diminutives and augmentatives: more than size',en:'Portuguese suffixes carry affection, irony, politeness and intensity. -inho/-inha softens requests and shows warmth; -ão/-ona enlarges, sometimes mockingly; -ito, -zinho, -zito are variants. German has -chen and -lein for small/cute but relies on adverbs (mal, kurz, ganz) for the rest.',
pt:'um cafezinho (a quick/nice coffee), uma esperinha (just a moment), devagarinho (nice and slowly), obrigadinho (thanks, slightly ironic), um beijinho (a kiss, as a sign-off), um carrão (a huge car), um filmaço (a great film), uma palavrão (a swear word).',
de:'ein Käffchen (colloquial, affectionate), ein Momentchen, ein Bisschen, Häuschen, Mäuschen. For intensity German uses prefixes: Riesen-, Mords-, mega-, super- (ein Riesenauto, ein Mordsfilm).',
examples:[
{en:'Just a little moment.',pt:'Só uma [esperinha].',de:'Nur ein [Momentchen].'},
{en:'A big kiss (text sign-off).',pt:'Um [beijinho] grande.',de:'Dicken [Kuss].'},
{en:'What a great film!',pt:'Que [filmaço]!',de:'Was für ein [Hammerfilm]!'},
{en:'He drives a huge car.',pt:'Ele anda num [carrão].',de:'Er fährt ein [Riesenauto].'},
{en:'Take it nice and slow.',pt:'Vai [devagarinho].',de:'Mach ganz [langsam].'}
]},
{title:'Register markers in German: Sie/du, dialect colour, and Jugendsprache',en:'German register is signalled by the pronoun (Sie vs du), by vocabulary (Sie-level: erhalten, beginnen; du-level: kriegen, anfangen) and by regional colour. Portuguese register is signalled by tu/você/o senhor and by the choice between learned and everyday words.',
pt:'tu (friends, family, same-age colleagues in many companies), você (neutral-formal, avoided as a word in Portugal: people say “o senhor quer…?” or just the verb), o senhor / a senhora (formal), o doutor / a engenheira (professional titles). Learned vs everyday: compreender / perceber, adquirir / comprar, efetuar / fazer.',
de:'du vs Sie: offer with “Wollen wir uns duzen?”. Register pairs: erhalten / kriegen, beginnen / anfangen, sich befinden / sein, speisen / essen, verstorben / tot. Regional: Grüß Gott (south), Moin (north), Servus (Bavaria/Austria). Youth: krass, Digga, safe (= definitely), cringe, lost.',
examples:[
{en:'Did you get my message? (informal)',pt:'[Recebeste] a minha mensagem?',de:'Hast du meine Nachricht [gekriegt]?'},
{en:'Have you received my message? (formal)',pt:'[Recebeu] a minha mensagem?',de:'Haben Sie meine Nachricht [erhalten]?'},
{en:'Shall we switch to first names?',pt:'Podemos [tratar-nos] por tu?',de:'Wollen wir uns [duzen]?'},
{en:'Would the gentleman like a coffee?',pt:'O [senhor] deseja um café?',de:'Möchten [Sie] einen Kaffee?'},
{en:'That was definitely cringe.',pt:'Isso foi mesmo [vergonhoso].',de:'Das war [safe] cringe.'}
]}
],
reading:{title:'Three ways to say the same thing',intro:'The same short message in three registers. Read all three in your target language and note what changes.',
en:'[To a friend] Hey, I’m running late, the metro’s a mess. Grab me a beer, I’ll be there in ten, promise. Don’t let Rui start the karaoke without me.\n[To a colleague] Hi Ana, I’m going to be about ten minutes late, there’s a problem on the metro. Could you start the meeting without me? I’ll join as soon as I arrive.\n[To a client] Dear Mr Schneider, I regret to inform you that I shall be approximately ten minutes late for our meeting owing to a disruption on the metro line. I apologise for any inconvenience and will join you as soon as I arrive.',
pt:'[A um amigo] Ó pá, estou atrasado, o metro está um caos. Pede-me uma imperial, chego daqui a dez minutos, prometo. Não deixes o Rui começar o karaoke sem mim.\n[A uma colega] Olá Ana, vou chegar uns dez minutos atrasado, há um problema no metro. Podes começar a reunião sem mim? Junto-me assim que chegar.\n[A um cliente] Exmo. Sr. Schneider, lamento informar que chegarei com cerca de dez minutos de atraso à nossa reunião, devido a uma perturbação na linha do metro. Peço desculpa pelo incómodo e juntar-me-ei a si assim que chegar.',
de:'[An einen Freund] Ey, ich komm später, die U-Bahn ist ein Chaos. Bestell mir schon mal ein Bier, bin in zehn Minuten da, versprochen. Lass Rui bloß nicht ohne mich mit dem Karaoke anfangen.\n[An eine Kollegin] Hallo Ana, ich komme etwa zehn Minuten zu spät, es gibt ein Problem bei der U-Bahn. Könntest du die Besprechung ohne mich anfangen? Ich stoße dazu, sobald ich da bin.\n[An einen Kunden] Sehr geehrter Herr Schneider, leider muss ich Ihnen mitteilen, dass ich mich aufgrund einer Störung auf der U-Bahn-Linie um etwa zehn Minuten zu unserem Termin verspäten werde. Ich bitte die Unannehmlichkeiten zu entschuldigen und werde unmittelbar nach meiner Ankunft zu Ihnen stoßen.',
questions:['Which words change between the friend and the colleague versions?','Find the mesóclise in the Portuguese client version and the nominal construction in the German one.']}},

phrases:[

{en:'An appeal may be lodged within thirty days.',pt:'Pode ser interposto recurso no prazo de trinta dias.',de:'Gegen diesen Bescheid kann innerhalb von dreißig Tagen Widerspruch eingelegt werden.'},

grammar:[
{title:'Passive substitutes: lässt sich, ist zu, -bar / pode-se, é de, -vel',en:'Official and technical text avoids the plain passive with alternatives. German: sich lassen + infinitive (can be), sein + zu + infinitive (must/can be), -bar adjectives. Portuguese: pode-se / é possível, ser de + infinitive, -vel adjectives.',
pt:'O formulário pode preencher-se online. O prazo é de respeitar / deve ser respeitado. A taxa é reembolsável. É de notar que… (it should be noted that). Trata-se de (it is a matter of).',
de:'Das Formular lässt sich online ausfüllen (= kann ausgefüllt werden). Die Frist ist einzuhalten (= muss eingehalten werden). Die Gebühr ist erstattbar. Es handelt sich um (it is a matter of).',
examples:[
{en:'The form can be filled in online.',pt:'O formulário [pode] preencher-se online.',de:'Das Formular [lässt] sich online ausfüllen.'},
{en:'The deadline must be observed.',pt:'O prazo [deve] ser respeitado.',de:'Die Frist [ist] einzuhalten.'},
{en:'The fee is refundable.',pt:'A taxa é [reembolsável].',de:'Die Gebühr ist [erstattbar].'},
{en:'It should be noted that the clause is binding.',pt:'[É] de notar que a cláusula é vinculativa.',de:'Es [ist] darauf hinzuweisen, dass die Klausel verbindlich ist.'},
{en:'This is a formal error.',pt:'[Trata-se] de um erro formal.',de:'Es [handelt] sich um einen Formfehler.'}
]},
{title:'Amtsdeutsch and burocratês: decoding long noun chains',en:'Official German stacks nouns and genitives (die Verlängerung der Frist zur Einreichung der Unterlagen). Official Portuguese stacks de-phrases and uses the compound future subjunctive and “caso” constructions. The reading strategy is the same: find the head noun, then unpack from right to left.',
pt:'o pedido de prorrogação do prazo de entrega dos documentos = the request for extension of the deadline for delivery of the documents. Compound future subjunctive: se o requerente não tiver entregado (if the applicant has not delivered), caso o pagamento não tenha sido efetuado.',
de:'der Antrag auf Verlängerung der Frist zur Einreichung der Unterlagen. Head noun first (Antrag), then each genitive/prepositional phrase. Also: Compound nouns: Aufenthaltserlaubnis (Aufenthalt + Erlaubnis), Einkommensteuererklärung, Meldebescheinigung.',
examples:[
{en:'residence permit',pt:'a autorização de [residência]',de:'die [Aufenthaltserlaubnis]'},
{en:'income tax return',pt:'a declaração de [IRS]',de:'die [Einkommensteuererklärung]'},
{en:'If the applicant has not submitted the documents…',pt:'Se o requerente não [tiver] entregado os documentos…',de:'Sofern der Antragsteller die Unterlagen nicht eingereicht [hat]…'},
{en:'the extension of the deadline for submission',pt:'a prorrogação do [prazo] de entrega',de:'die Verlängerung der [Frist] zur Einreichung'},
{en:'In case payment has not been made…',pt:'Caso o pagamento não [tenha] sido efetuado…',de:'Falls die Zahlung nicht erfolgt [ist]…'}
]}
],
reading:{title:'Letter from an authority',intro:'A fictional official letter, the kind that arrives in a brown envelope. Decode the structure in your target language.',
en:'Subject: Reminder, registration of residence\nDear Mr Costa,\nAccording to our records, you moved into the address stated above on 1 October 2026. Under Section 17 of the Federal Registration Act, every person who moves into a dwelling is required to register with the registration authority within two weeks of moving in. No registration has been received to date.\nYou are hereby requested to register in person at the Citizens’ Office by 30 November 2026 at the latest, bringing a valid identity document and the landlord’s confirmation of residence. Should you fail to register within this period, a fine of up to one thousand euros may be imposed in accordance with Section 54 of the Act.\nIf you have already registered in the meantime, please disregard this letter. An objection to this notice may be lodged in writing within one month of receipt.\nYours faithfully,\nCitizens’ Office, Registration Department',
pt:'Assunto: Aviso, registo de residência\nExmo. Senhor Costa,\nDe acordo com os nossos registos, V. Exa. passou a residir na morada acima indicada em 1 de outubro de 2026. Nos termos do artigo 17.º da Lei Federal do Registo de Residentes, qualquer pessoa que passe a habitar um alojamento é obrigada a registar-se junto da autoridade competente no prazo de duas semanas após a mudança. Até à data não foi recebido qualquer registo.\nFica V. Exa. pelo presente notificado para proceder ao registo presencial no Balcão do Cidadão até 30 de novembro de 2026, o mais tardar, fazendo-se acompanhar de documento de identificação válido e da declaração do senhorio comprovativa da residência. Caso o registo não seja efetuado dentro deste prazo, poderá ser aplicada uma coima até mil euros, em conformidade com o artigo 54.º da referida Lei.\nSe entretanto já tiver efetuado o registo, queira desconsiderar a presente carta. Da presente notificação cabe reclamação por escrito no prazo de um mês a contar da receção.\nCom os melhores cumprimentos,\nBalcão do Cidadão, Serviço de Registo',
de:'Betreff: Erinnerung, Anmeldung des Wohnsitzes\nSehr geehrter Herr Costa,\nnach unseren Unterlagen sind Sie am 1. Oktober 2026 in die oben genannte Anschrift eingezogen. Gemäß § 17 des Bundesmeldegesetzes ist jede Person, die eine Wohnung bezieht, verpflichtet, sich innerhalb von zwei Wochen nach dem Einzug bei der Meldebehörde anzumelden. Eine Anmeldung ist bisher nicht eingegangen.\nSie werden hiermit aufgefordert, sich bis spätestens 30. November 2026 persönlich im Bürgeramt anzumelden und dabei ein gültiges Ausweisdokument sowie die Wohnungsgeberbestätigung vorzulegen. Sollten Sie die Anmeldung nicht fristgerecht vornehmen, kann gemäß § 54 des Gesetzes ein Bußgeld von bis zu eintausend Euro verhängt werden.\nSofern Sie sich zwischenzeitlich bereits angemeldet haben, betrachten Sie dieses Schreiben bitte als gegenstandslos. Gegen diesen Bescheid kann innerhalb eines Monats nach Zugang schriftlich Widerspruch eingelegt werden.\nMit freundlichen Grüßen\nBürgeramt, Abteilung Meldewesen',
questions:['What two documents must be brought?','What is the maximum fine, and under which section?','Find “should you fail to…” in your target language and identify the verb form.']}},

{id:'c1-05',title:'Variation: Portugal vs Brazil, Germany vs Austria & Switzerland',icon:'🗺️',

grammar:[
{title:'Portugal vs Brazil: the grammatical differences that matter',en:'Beyond vocabulary, European and Brazilian Portuguese differ in pronoun placement, the progressive form, the second person, and some spelling. Knowing them lets you understand Brazilian media while speaking like Portugal.',
pt:'Progressive: estou a falar (PT) vs estou falando (BR). Pronouns: dá-me (PT) vs me dá (BR); vejo-te vs te vejo. Second person: tu + 2nd-person verb (PT) vs você + 3rd-person verb (most of BR); PT uses você sparingly and often avoids the word. Object “you”: PT te / o/a; BR te or você. Vocabulary and some spellings also differ (facto PT / fato BR). Pronunciation: PT reduces unstressed vowels heavily; BR keeps them open.',
de:'(For German the equivalent map is in the next point.)',
examples:[
{en:'I am eating.',pt:'Estou [a] comer. (BR: estou comendo)',de:'Ich esse [gerade].'},
{en:'I love you.',pt:'[Amo-te]. (BR: te amo / amo você)',de:'Ich liebe [dich].'},
{en:'Do you want coffee? (to a friend)',pt:'[Queres] café? (BR: você quer café?)',de:'[Willst] du Kaffee?'},
{en:'Call me tomorrow.',pt:'[Liga-me] amanhã. (BR: me liga amanhã)',de:'[Ruf] mich morgen an.'},
{en:'It is a fact.',pt:'É um [facto]. (BR: fato)',de:'Das ist eine [Tatsache].'}
]},
{title:'Germany vs Austria vs Switzerland: what changes',en:'Standard German has three national standards. Differences are mostly lexical (food, administration), partly grammatical (Perfekt vs Präteritum, gender of some nouns, sein with sitzen/stehen/liegen in the south), and strongly phonetic. Swiss German dialect is a different matter: Swiss people write standard German but speak dialect.',
pt:'(The Portuguese map is in the previous point.)',
de:'Perfekt dominates in the south and Austria even for sein/haben: ich bin gewesen rather than ich war. South/AT: ich bin gesessen / gestanden / gelegen (DE north: ich habe gesessen). Gender: das E-Mail (AT) vs die E-Mail (DE); der Butter (regional south) vs die Butter. Austria: Jänner, Paradeiser, Erdapfel, Sackerl (bag), Marille (apricot), Topfen (quark). Switzerland: no ß, Velo (bike), Natel, parkieren, grillieren, Billett, Trottoir, Grüezi; -li diminutive (Müesli).',
examples:[
{en:'I sat in the garden. (north / south)',pt:'Estive sentado no jardim.',de:'Ich habe im Garten gesessen. / Ich [bin] im Garten gesessen. (AT, south)'},
{en:'I ride my bike to work. (DE / CH)',pt:'Vou de bicicleta para o trabalho.',de:'Ich fahre mit dem Fahrrad / mit dem [Velo] (CH) zur Arbeit.'},
{en:'I got an email. (DE / AT)',pt:'Recebi um email.',de:'Ich habe eine E-Mail / [ein] E-Mail (AT) bekommen.'},
{en:'In January it snows. (DE / AT)',pt:'Em janeiro neva.',de:'Im Januar / im [Jänner] (AT) schneit es.'},
{en:'A bag of apricots, please. (AT)',pt:'Um saco de alperces, por favor.',de:'Ein [Sackerl] Marillen, bitte. (DE: eine Tüte Aprikosen)'}
]}
],
reading:{title:'One language, several countries',intro:'A short expository text on variation. Note how each language talks about itself.',
en:'Portuguese is the official language of nine countries, and the two largest varieties, European and Brazilian, have drifted apart in sound more than in writing. A Lisbon speaker swallows unstressed vowels, so that “telefone” comes out close to “tlfon”, while a speaker from São Paulo gives every syllable its weight. Grammar follows: Brazil has largely replaced “tu” with “você”, puts object pronouns before the verb, and says “estou falando” where Portugal says “estou a falar”. Television and music flow mainly from Brazil to Portugal, so the Portuguese understand Brazilian with ease, and the reverse is less often true.\nGerman is pluricentric too: Germany, Austria and Switzerland each have a recognised standard with its own dictionary entries. The written differences are small, a few hundred words and some endings, and an Austrian newspaper reads like a German one with “Jänner” and “Paradeiser” in it. The spoken difference is another story. Swiss German dialects are not mutually intelligible with northern German speech, and Swiss speakers switch to standard German for outsiders the way one switches to a second language. A learner who masters the standard will read everything and understand most of Germany; Austria and Switzerland take time and good will.',
pt:'O português é língua oficial de nove países, e as duas maiores variantes, a europeia e a brasileira, afastaram-se mais no som do que na escrita. Um falante de Lisboa engole as vogais átonas, de modo que «telefone» sai quase como «tlfon», enquanto um falante de São Paulo dá peso a cada sílaba. A gramática acompanha: o Brasil substituiu em grande parte o «tu» por «você», coloca os pronomes antes do verbo e diz «estou falando» onde Portugal diz «estou a falar». A televisão e a música fluem sobretudo do Brasil para Portugal, pelo que os portugueses percebem o brasileiro com facilidade, e o inverso nem sempre é verdade.\nO alemão também é pluricêntrico: a Alemanha, a Áustria e a Suíça têm cada uma um padrão reconhecido, com entradas próprias no dicionário. As diferenças escritas são pequenas, algumas centenas de palavras e algumas terminações, e um jornal austríaco lê-se como um alemão com «Jänner» e «Paradeiser» pelo meio. A diferença falada é outra história. Os dialetos suíço-alemães não são mutuamente inteligíveis com a fala do norte da Alemanha, e os suíços mudam para o alemão padrão com estrangeiros como quem muda para uma segunda língua. Quem domina o padrão lê tudo e percebe a maior parte da Alemanha; a Áustria e a Suíça pedem tempo e boa vontade.',
de:'Portugiesisch ist Amtssprache in neun Ländern, und die beiden größten Varietäten, die europäische und die brasilianische, haben sich im Klang stärker auseinanderentwickelt als in der Schrift. Ein Sprecher aus Lissabon verschluckt die unbetonten Vokale, sodass „telefone“ fast wie „tlfon“ klingt, während ein Sprecher aus São Paulo jeder Silbe ihr Gewicht gibt. Die Grammatik folgt: Brasilien hat „tu“ weitgehend durch „você“ ersetzt, stellt Objektpronomen vor das Verb und sagt „estou falando“, wo Portugal „estou a falar“ sagt. Fernsehen und Musik fließen vor allem von Brasilien nach Portugal, weshalb die Portugiesen Brasilianisch mühelos verstehen, während das Umgekehrte seltener zutrifft.\nDeutsch ist ebenfalls plurizentrisch: Deutschland, Österreich und die Schweiz haben jeweils einen anerkannten Standard mit eigenen Wörterbucheinträgen. Die schriftlichen Unterschiede sind klein, ein paar hundert Wörter und einige Endungen, und eine österreichische Zeitung liest sich wie eine deutsche mit „Jänner“ und „Paradeiser“ darin. Der gesprochene Unterschied ist eine andere Geschichte. Schweizerdeutsche Dialekte sind mit norddeutscher Sprache nicht gegenseitig verständlich, und Schweizer wechseln für Außenstehende ins Standarddeutsche wie in eine zweite Sprache. Wer den Standard beherrscht, liest alles und versteht den größten Teil Deutschlands; Österreich und die Schweiz brauchen Zeit und guten Willen.',
questions:['Why do the Portuguese understand Brazilian more easily than the reverse?','What is the difference between written and spoken variation in German?','Which three grammatical differences between PT and BR are listed?']}}
]});

pt:'Quem não arrisca, não petisca (relative quem with no antecedent). Mais vale X do que Y (vale = is worth, inverted). Água mole em pedra dura tanto bate até que fura (até que + indicative, archaic). Dir-te-ei (mesóclise).',

reading:{title:'Grandmothers’ wisdom',intro:'A short reflective text built around proverbs.',
en:'My grandmother in Sintra had a proverb for everything, and most of them were about patience. If I complained that something was taking too long, she said that one goes far by going slowly. If I boasted before the result was in, she warned me not to count the egg before the hen had laid it, in a version too rude to print. If a plan collapsed, she shrugged: some evils come for the good.\nMy girlfriend’s grandmother in Lower Saxony kept the same philosophy in a different accent. Her favourite was that one should not praise the day before the evening, which she applied equally to weather, football and my attempts to bake. When I finally produced an edible loaf, she said that practice makes the master, and when the next one failed she said that no master has ever fallen from the sky.\nThe two women never met and would not have understood a word of each other. They would have agreed about everything.',
pt:'A minha avó, em Sintra, tinha um provérbio para tudo, e a maioria era sobre paciência. Se eu me queixava de que uma coisa demorava demais, dizia que devagar se vai ao longe. Se eu cantava vitória antes do resultado, avisava-me para não contar com o ovo antes de a galinha o pôr, numa versão demasiado malcriada para se imprimir. Se um plano se desmoronava, encolhia os ombros: há males que vêm por bem.\nA avó da minha namorada, na Baixa Saxónia, guardava a mesma filosofia com outro sotaque. A preferida dela era que não se deve louvar o dia antes da noite, o que aplicava por igual ao tempo, ao futebol e às minhas tentativas de fazer pão. Quando finalmente produzi um pão comestível, disse que a prática faz o mestre, e quando o seguinte falhou disse que nenhum mestre caiu ainda do céu.\nAs duas mulheres nunca se conheceram e não teriam percebido uma palavra uma da outra. Teriam concordado em tudo.',
de:'Meine Großmutter in Sintra hatte für alles ein Sprichwort, und die meisten handelten von Geduld. Wenn ich mich beschwerte, dass etwas zu lange dauerte, sagte sie, langsam komme man weit. Wenn ich prahlte, bevor das Ergebnis feststand, warnte sie mich, das Ei nicht zu zählen, bevor die Henne es gelegt habe, in einer Fassung, die zu derb zum Abdrucken ist. Wenn ein Plan zusammenbrach, zuckte sie mit den Schultern: Manches Übel komme zum Guten.\nDie Großmutter meiner Freundin in Niedersachsen pflegte dieselbe Philosophie mit anderem Akzent. Ihr Lieblingsspruch war, man solle den Tag nicht vor dem Abend loben, was sie gleichermaßen auf das Wetter, den Fußball und meine Backversuche anwandte. Als ich endlich ein essbares Brot zustande brachte, sagte sie, Übung mache den Meister, und als das nächste misslang, sagte sie, es sei noch kein Meister vom Himmel gefallen.\nDie beiden Frauen sind sich nie begegnet und hätten kein Wort voneinander verstanden. Sie wären sich in allem einig gewesen.',
questions:['Which proverb does each grandmother use for patience?','Note the German Konjunktiv I in the reported proverbs (komme, habe, mache, sei). What does Portuguese use instead?']}},

{en:'The minister allegedly knew about it in March.',pt:'O ministro terá sabido disso em março.',de:'Der Minister soll bereits im März davon gewusst haben.',note:'PT: the future perfect (terá sabido) marks hearsay. DE: sollen marks hearsay.'},

grammar:[
{title:'Marking hearsay: sollen / Konjunktiv I (DE) and the future of supposition (PT)',en:'How to report a claim without endorsing it. German press uses Konjunktiv I (er sei, er habe, er komme) and the modal sollen (= is said to). Portuguese uses the future and future perfect for supposition (será, terá sido) and adverbs like alegadamente.',
pt:'Supposition: Ele terá sabido em março (he allegedly knew). Serão cerca de mil pessoas (there must be about a thousand). Conditional for the past: Teria sido um erro (it would reportedly have been a mistake). Segundo fontes, o governo pretende… Alegadamente, …',
de:'Konjunktiv I: Der Minister sagte, er habe nichts gewusst. Die Firma teilte mit, sie werde investieren. sollen: Der Minister soll davon gewusst haben. wollen (claims about oneself): Er will nichts gewusst haben (he claims not to have known). angeblich, mutmaßlich.',
examples:[
{en:'The minister is said to have known.',pt:'O ministro [terá] sabido.',de:'Der Minister [soll] gewusst haben.'},
{en:'He claims he knew nothing.',pt:'Ele [alega] não ter sabido nada.',de:'Er [will] nichts gewusst haben.'},
{en:'The company said it would invest.',pt:'A empresa disse que [iria] investir.',de:'Die Firma sagte, sie [werde] investieren.'},
{en:'There must be about a thousand people.',pt:'[Serão] umas mil pessoas.',de:'Es [dürften] etwa tausend Leute sein.'},
{en:'She said she was tired. (press)',pt:'Ela disse que [estava] cansada.',de:'Sie sagte, sie [sei] müde.'}
]},
{title:'Degree and stance adverbs: placement and weight',en:'Hedges and intensifiers change force by position. In German, sentence adverbs (wohl, zwar, eben, allerdings) sit in the middle field after the verb; in Portuguese, adverbs in -mente and set phrases typically open the sentence or follow the verb.',
pt:'Possivelmente, o acordo será assinado. O acordo será, possivelmente, assinado (parenthetical, more formal). Quando muito, dois dias. Até certo ponto, concordo. Grosso modo, é isso.',
de:'Das Abkommen wird wohl unterzeichnet (wohl = probably, after the verb). Es ist zwar teuer, aber gut. Das stimmt allerdings nur bedingt. Bestenfalls zwei Tage. Bis zu einem gewissen Grad stimme ich zu.',
examples:[
{en:'The deal will probably be signed.',pt:'O acordo [será] possivelmente assinado.',de:'Das Abkommen wird [wohl] unterzeichnet.'},
{en:'That is only partly true.',pt:'Isso só é verdade [até] certo ponto.',de:'Das stimmt [allerdings] nur bedingt.'},
{en:'At best, two days.',pt:'[Quando] muito, dois dias.',de:'[Bestenfalls] zwei Tage.'},
{en:'By and large, I agree.',pt:'[De] um modo geral, concordo.',de:'Im [Großen] und Ganzen stimme ich zu.'}
]}
