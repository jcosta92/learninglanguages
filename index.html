<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Obrigado · Danke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout: one column, phone-first; language colour encodes which language a word is in */
  --bg:#f6f7f9; --panel:#ffffff; --ink:#15202b; --muted:#5d6b7a; --line:#dde3ea;
  --accent:#1f4e79; --accent-ink:#ffffff;
  --pt:#1e7b4c; --pt-soft:#e3f3ea;
  --de:#a86a00; --de-soft:#fbefd6;
  --en:#3a4a5c; --en-soft:#e9edf2;
  --good:#1e7b4c; --bad:#b3261e; --warn:#a86a00;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --body:"Source Sans 3", "Segoe UI", Roboto, sans-serif;
  --radius:12px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121820; --panel:#1b232d; --ink:#eef2f6; --muted:#9aa8b6; --line:#2c3845;
    --accent:#7fb3e0; --accent-ink:#0f1b26;
    --pt:#6fcf97; --pt-soft:#1c3328;
    --de:#f0b84a; --de-soft:#3a2d12;
    --en:#c3cdd8; --en-soft:#232d38;
    --good:#6fcf97; --bad:#ff8a80; --warn:#f0b84a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121820; --panel:#1b232d; --ink:#eef2f6; --muted:#9aa8b6; --line:#2c3845;
  --accent:#7fb3e0; --accent-ink:#0f1b26;
  --pt:#6fcf97; --pt-soft:#1c3328;
  --de:#f0b84a; --de-soft:#3a2d12;
  --en:#c3cdd8; --en-soft:#232d38;
  --good:#6fcf97; --bad:#ff8a80; --warn:#f0b84a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.8rem;font-weight:800}
h2{font-size:1.35rem;font-weight:700}
h3{font-size:1.05rem;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:56px}
.brand{font-family:var(--display);font-weight:800;font-size:1.1rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.brand .pt{color:var(--pt)}.brand .de{color:var(--de)}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.9rem}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin:14px 0 6px}
.crumbs button{background:none;border:0;padding:0;color:var(--accent);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;letter-spacing:.02em}
.pill.pt{background:var(--pt-soft);color:var(--pt)}
.pill.de{background:var(--de-soft);color:var(--de)}
.pill.en{background:var(--en-soft);color:var(--en)}
.pill.lvl{background:var(--en-soft);color:var(--ink)}
.bar{height:8px;background:var(--en-soft);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
/* home */
.hero{padding:22px 0 10px}
.hero p{max-width:60ch}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.level{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.level:hover{border-color:var(--accent)}
.level .code{font-family:var(--display);font-size:2rem;font-weight:800;letter-spacing:-.02em}
.units{display:flex;flex-direction:column;gap:10px}
.unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left}
.unit:hover{border-color:var(--accent)}
.unit .ico{font-size:1.7rem;line-height:1;text-align:center}
.unit .meta{font-size:.85rem;color:var(--muted)}
.unit .done{color:var(--good);font-weight:700}
/* unit page */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:7px 14px;font-weight:600;white-space:nowrap}
.tab.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.viewmode{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-weight:600;font-size:.9rem}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:6px;position:relative}
.vcard .ico{font-size:2.2rem;line-height:1.1}
.vcard .en{font-weight:600;color:var(--en)}
.w{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.2}
.w.pt{color:var(--pt)}.w.de{color:var(--de)}
.langseg button[data-lang].on{color:var(--bg)}
.langseg button[data-lang="de"].on{background:var(--de)}
.langseg button[data-lang="pt"].on{background:var(--pt)}
.dual{display:flex;gap:10px;font-size:.85rem;font-weight:700;white-space:nowrap}
.dual .de{color:var(--de)}.dual .pt{color:var(--pt)}
.vcard .note{font-size:.85rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:6px;margin-top:2px}
.vcard.known{border-color:var(--good)}
.vcard .tools{position:absolute;top:8px;right:8px;display:flex;gap:4px}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:8px;width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;font-size:.95rem;padding:0}
.iconbtn.on{background:var(--good);color:#fff;border-color:var(--good)}
.iconbtn.flag.on{background:var(--warn);border-color:var(--warn)}
table.tri{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.tablewrap{overflow-x:auto;border-radius:var(--radius)}
table.tri th,table.tri td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tri th{font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);background:var(--en-soft)}
table.tri td.pt{color:var(--pt);font-weight:600}table.tri td.de{color:var(--de);font-weight:600}
table.tri td.ico{font-size:1.4rem;width:40px}
.phrase{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;display:grid;gap:4px;position:relative}
.phrase .en{color:var(--en);font-weight:600}
.gram{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px}
.gram .explain{max-width:68ch}
.gram .lang{border-left:4px solid var(--line);padding:6px 12px;border-radius:4px}
.gram .lang.pt{border-color:var(--pt);background:var(--pt-soft)}
.gram .lang.de{border-color:var(--de);background:var(--de-soft)}
.gram .lang b{display:block;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:2px}
.ex{display:grid;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.ex .en{color:var(--en)}
.ex .pt{color:var(--pt)}.ex .de{color:var(--de)}
.ex mark{background:transparent;color:inherit;font-weight:800;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.reading{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.reading .cols{display:grid;grid-template-columns:1fr;gap:14px}
@media (min-width:700px){.reading .cols{grid-template-columns:1fr 1fr 1fr}}
.reading .col{padding:10px;border-radius:8px;background:var(--bg)}
.reading .col p{margin:0 0 10px;max-width:65ch}
.reading .col.pt{border-top:3px solid var(--pt)}.reading .col.de{border-top:3px solid var(--de)}.reading .col.en{border-top:3px solid var(--en)}
.reading .col b{display:block;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
/* practice */
.exmenu{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.exbtn{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.exbtn:hover{border-color:var(--accent)}
.exbtn .t{font-family:var(--display);font-weight:700}
.exbtn .s{font-size:.85rem;color:var(--muted)}
.exbtn .best{font-size:.85rem;color:var(--good);font-weight:700}
.session{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:flex;flex-direction:column;gap:14px;min-height:300px}
.session .q{font-size:1.15rem}
.session .q .ico{font-size:2.6rem;display:block;margin-bottom:6px}
.session .prompt{font-family:var(--display);font-weight:700;font-size:1.4rem}
.choices{display:grid;gap:8px}
.choice{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;text-align:left;font-size:1.05rem;min-height:48px}
.choice.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 15%,var(--panel))}
.choice.ko{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,var(--panel))}
.typein{display:flex;gap:8px}
.typein input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);font-size:1.1rem;min-width:0}
.feedback{padding:10px 12px;border-radius:10px;font-weight:600}
.feedback.ok{background:color-mix(in srgb,var(--good) 15%,var(--panel));color:var(--good)}
.feedback.ko{background:color-mix(in srgb,var(--bad) 15%,var(--panel));color:var(--bad)}
.feedback .ans{display:block;color:var(--ink);font-weight:400;margin-top:4px}
.card3d{border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);padding:24px 16px;min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;cursor:pointer}
.card3d .ico{font-size:3rem}
.card3d .w{font-size:1.6rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;padding:8px;border:1px dashed var(--line);border-radius:10px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:1.05rem}
.chip.pt{color:var(--pt)}.chip.de{color:var(--de)}
.matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mcell{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:12px;min-height:52px;text-align:left}
.mcell.sel{border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--accent)}
.mcell.gone{opacity:.25;pointer-events:none}
.mcell.pt{color:var(--pt);font-weight:600}.mcell.de{color:var(--de);font-weight:600}
.summary{text-align:center;padding:20px 0}
.summary .score{font-family:var(--display);font-size:3rem;font-weight:800}
.progressline{display:flex;align-items:center;gap:10px;font-size:.9rem;color:var(--muted)}
.progressline .bar{flex:1}
.search{display:flex;gap:8px}
.search input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);min-width:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.modal .box{background:var(--panel);border-radius:16px 16px 0 0;padding:18px;width:100%;max-width:640px;max-height:85vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
@media (min-width:640px){.modal{align-items:center;padding:16px}.modal .box{border-radius:16px}}
textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.kbd{font-family:ui-monospace,monospace;font-size:.85em;background:var(--en-soft);padding:1px 6px;border-radius:4px}
.footnote{font-size:.85rem;color:var(--muted);margin-top:30px;border-top:1px solid var(--line);padding-top:12px;max-width:70ch}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <button class="brand" id="brandBtn" style="border:0;background:none;padding:0"><span>Obrigado</span><span class="muted">·</span><span class="de">Danke</span></button>
  <div class="spacer"></div>
  <span class="small muted" id="practiseLabel">Practise</span>
  <div class="seg langseg" id="langSeg" role="group" aria-label="Practise language"><button data-lang="de">DE</button><button data-lang="pt">PT</button></div>
  <button class="btn sm ghost" id="menuBtn" aria-label="Menu">☰</button>
</div></header>
<main class="wrap" id="app"></main>
<div class="toast" id="toast"></div>

<script>
window.COURSE_DATA=[];
window.COURSE_DATA.push({
id:'A1',name:'Beginner',
canDo:'Understand and use everyday expressions and very basic phrases. Introduce yourself, ask and answer simple personal questions, interact slowly with a patient speaker.',
units:[
/* ================= A1-01 ================= */
{id:'a1-01',title:'Greetings & introductions',icon:'👋',
intro:'The words you say every day. Portuguese has two words for thank you depending on who is speaking; German greetings change with the time of day.',
vocab:[
{en:'hello',pt:'olá',de:'hallo',icon:'👋'},
{en:'good morning',pt:'bom dia',de:'guten Morgen',icon:'🌅',note:'PT: bom dia until lunch. DE: guten Morgen until about 10–11, then guten Tag.'},
{en:'good afternoon',pt:'boa tarde',de:'guten Tag',icon:'☀️',note:'DE has no separate afternoon greeting; guten Tag covers it.'},
{en:'good evening',pt:'boa noite',de:'guten Abend',icon:'🌆',note:'PT uses boa noite from sunset onwards, both as greeting and farewell.'},
{en:'good night',pt:'boa noite',de:'gute Nacht',icon:'🌙',note:'DE: gute Nacht only when going to bed.'},
{en:'goodbye',pt:'adeus',de:'auf Wiedersehen',icon:'🚪',note:'PT: adeus is a bit final; most people say até logo or tchau.'},
{en:'bye (informal)',pt:'tchau',de:'tschüss',icon:'✌️'},
{en:'see you later',pt:'até logo',de:'bis später',icon:'🔜'},
{en:'see you tomorrow',pt:'até amanhã',de:'bis morgen',icon:'📅'},
{en:'please',pt:'por favor / se faz favor',de:'bitte',icon:'🙏',note:'PT: se faz favor (often written s.f.f.) is the common European form.'},
{en:'thank you',pt:'obrigado / obrigada',de:'danke',icon:'💐',note:'PT: obrigado if you are male, obrigada if you are female. It agrees with the speaker.'},
{en:'thank you very much',pt:'muito obrigado / muito obrigada',de:'vielen Dank',icon:'💝'},
{en:"you're welcome",pt:'de nada',de:'bitte / gern geschehen',icon:'😊',note:'DE: bitte means both please and you’re welcome.'},
{en:'yes',pt:'sim',de:'ja',icon:'✅'},
{en:'no',pt:'não',de:'nein',icon:'❌'},
{en:'excuse me / sorry',pt:'desculpe / desculpa',de:'Entschuldigung',icon:'🙇',note:'PT: desculpe (formal), desculpa (informal).'},
{en:'how are you?',pt:'como está? / como estás?',de:'wie geht es dir? / wie geht’s?',icon:'🤝',note:'PT: está = formal, estás = informal (tu).'},
{en:'fine, thanks',pt:'bem, obrigado / bem, obrigada',de:'gut, danke',icon:'👍'},
{en:'name',pt:'o nome',de:'der Name',icon:'🏷️',pos:'noun'},
{en:'my name is…',pt:'chamo-me…',de:'ich heiße…',icon:'🪪',note:'PT: literally “I call myself”. O meu nome é… also works.'},
{en:'nice to meet you',pt:'muito prazer',de:'freut mich',icon:'🤗'},
{en:'Mr',pt:'o senhor',de:'Herr',icon:'👨',pos:'noun'},
{en:'Mrs / Ms',pt:'a senhora',de:'Frau',icon:'👩',pos:'noun'},
{en:'friend',pt:'o amigo / a amiga',de:'der Freund / die Freundin',icon:'🧑‍🤝‍🧑',pos:'noun',note:'DE: Freund/Freundin can also mean boyfriend/girlfriend; context decides.'},
{en:'I don’t understand',pt:'não compreendo / não percebo',de:'ich verstehe nicht',icon:'🤷',note:'PT: perceber is the everyday verb for understand in Portugal.'},
{en:'Do you speak English?',pt:'Fala inglês?',de:'Sprechen Sie Englisch?',icon:'🗣️'}
],
phrases:[
{en:'Hello, my name is Zeca.',pt:'Olá, chamo-me Zeca.',de:'Hallo, ich heiße Zeca.'},
{en:'What is your name?',pt:'Como te chamas? / Como se chama?',de:'Wie heißt du? / Wie heißen Sie?',note:'First form informal, second formal in both languages.'},
{en:'I am from Portugal.',pt:'Sou de Portugal.',de:'Ich komme aus Portugal.'},
{en:'I am from Germany.',pt:'Sou da Alemanha.',de:'Ich komme aus Deutschland.',note:'PT: country names with an article take da/do: da Alemanha, do Brasil. Portugal has no article.'},
{en:'Where are you from?',pt:'De onde és? / De onde é?',de:'Woher kommst du? / Woher kommen Sie?'},
{en:'I live in Lisbon.',pt:'Moro em Lisboa.',de:'Ich wohne in Lissabon.'},

{en:'I speak a little Portuguese.',pt:'Falo um pouco de português.',de:'Ich spreche ein bisschen Portugiesisch.'},
{en:'Can you repeat that, please?',pt:'Pode repetir, por favor?',de:'Können Sie das bitte wiederholen?'},
{en:'Slowly, please.',pt:'Devagar, por favor.',de:'Langsam, bitte.'},
{en:'How do you say “book” in German?',pt:'Como se diz “book” em alemão?',de:'Wie sagt man „book“ auf Deutsch?'}
],
grammar:[
{title:'Subject pronouns',en:'Both languages have a formal and an informal “you”. Portuguese usually drops the pronoun because the verb ending shows the person; German always keeps it.',
pt:'eu, tu, ele/ela/você, nós, eles/elas/vocês. In Portugal, tu is used with friends and family; você or o senhor/a senhora with strangers and older people. Pronouns are usually left out: Falo português.',
de:'ich, du, er/sie/es, wir, ihr, sie/Sie. Sie (capital S) is the formal you, singular and plural. The pronoun is never dropped: Ich spreche Deutsch.',
table:{head:['English','Português','Deutsch'],rows:[['I','eu','ich'],['you (informal)','tu','du'],['he / she','ele / ela','er / sie'],['you (formal)','você / o senhor','Sie'],['we','nós','wir'],['you (plural)','vocês','ihr / Sie'],['they','eles / elas','sie']]},
examples:[
{en:'I am Portuguese.',pt:'[Eu] sou português.',de:'[Ich] bin Portugiese.'},
{en:'You are German. (informal)',pt:'[Tu] és alemã.',de:'[Du] bist Deutsche.'},
{en:'She is a friend.',pt:'[Ela] é uma amiga.',de:'[Sie] ist eine Freundin.'},
{en:'We live in Lisbon.',pt:'[Nós] moramos em Lisboa.',de:'[Wir] wohnen in Lissabon.'},
{en:'Are you from Berlin? (formal)',pt:'[Você] é de Berlim?',de:'Kommen [Sie] aus Berlin?'}
]},
{title:'The verb “to be”: ser / sein',en:'Portuguese has two verbs for “to be”. Ser is for permanent things: identity, origin, profession. German has one verb, sein, and it is irregular.',

de:'sein: bin, bist, ist, sind, seid, sind. The verb is always the second element of a statement.',
table:{head:['English','ser','sein'],rows:[['I am','sou','bin'],['you are (inf.)','és','bist'],['he/she is','é','ist'],['we are','somos','sind'],['you are (pl.)','são','seid'],['they are','são','sind']]},
examples:[

grammar:[
{title:'Gender and articles',en:'Every noun has a gender. Portuguese has two (masculine, feminine); German has three (masculine, feminine, neuter). Learn each noun with its article.',
pt:'o / a (the), um / uma (a). Most nouns ending in -o are masculine, in -a feminine: o filho, a filha. Plural: os / as, uns / umas.',
de:'der / die / das (the), ein / eine / ein (a). Gender is not predictable from the ending in most cases, so memorise it. All plurals take die.',
table:{head:['English','Português','Deutsch'],rows:[['the (m.)','o','der'],['the (f.)','a','die'],['the (n.)','—','das'],['the (pl.)','os / as','die'],['a (m.)','um','ein'],['a (f.)','uma','eine'],['a (n.)','—','ein']]},
examples:[

{en:'the mother',pt:'[a] mãe',de:'[die] Mutter'},
{en:'the child',pt:'[a] criança',de:'[das] Kind'},
{en:'a brother',pt:'[um] irmão',de:'[ein] Bruder'},
{en:'a sister',pt:'[uma] irmã',de:'[eine] Schwester'},
{en:'the children',pt:'[os] filhos',de:'[die] Kinder'}
]},
{title:'Possessives: my, your, his, her',en:'Possessives agree with the thing possessed, not the owner. In European Portuguese they usually come with the article: o meu pai, a minha mãe.',
pt:'o meu / a minha (my), o teu / a tua (your), o seu / a sua (his, her, your formal), o nosso / a nossa (our). For his/her, Portugal often prefers dele / dela after the noun to avoid ambiguity: o pai dela = her father.',
de:'mein (my), dein (your), sein (his), ihr (her), unser (our), euer (your pl.), Ihr (your formal). They take the endings of ein: mein Vater, meine Mutter, mein Kind.',
table:{head:['English','Português (m. / f.)','Deutsch (m. / f. / n.)'],rows:[['my','o meu / a minha','mein / meine / mein'],['your (inf.)','o teu / a tua','dein / deine / dein'],['his','o seu / a sua (dele)','sein / seine / sein'],['her','o seu / a sua (dela)','ihr / ihre / ihr'],['our','o nosso / a nossa','unser / unsere / unser'],['your (formal)','o seu / a sua','Ihr / Ihre / Ihr']]},
examples:[
{en:'my father',pt:'o [meu] pai',de:'[mein] Vater'},
{en:'my mother',pt:'a [minha] mãe',de:'[meine] Mutter'},
{en:'your sister',pt:'a [tua] irmã',de:'[deine] Schwester'},
{en:'her brother',pt:'o irmão [dela]',de:'[ihr] Bruder'},
{en:'his daughter',pt:'a filha [dele]',de:'[seine] Tochter'},
{en:'our family',pt:'a [nossa] família',de:'[unsere] Familie'}
]},
{title:'Adjectives agree (PT) or stay flat after the verb (DE)',en:'In Portuguese an adjective changes to match the noun’s gender and number and usually follows the noun. In German an adjective after sein never changes.',
pt:'alto → alta, altos, altas. O homem alto, a mulher alta. Adjectives ending in -e or a consonant have one form for both genders: jovem, grande, feliz.',
de:'After sein the adjective is bare: Er ist groß. Sie ist groß. Endings only appear before a noun (der große Mann), which comes at A2.',
examples:[
{en:'My brother is tall.',pt:'O meu irmão é [alto].',de:'Mein Bruder ist [groß].'},
{en:'My sister is tall.',pt:'A minha irmã é [alta].',de:'Meine Schwester ist [groß].'},
{en:'My grandparents are old.',pt:'Os meus avós são [velhos].',de:'Meine Großeltern sind [alt].'},
{en:'She is married.',pt:'Ela é [casada].',de:'Sie ist [verheiratet].'},
{en:'They are young.',pt:'Eles são [jovens].',de:'Sie sind [jung].'}
]}
]},

{title:'Saying what you like: gostar de / mögen & gern',en:'Portuguese uses gostar de + thing. German has two ways: mögen + noun (ich mag Kaffee) or a verb + gern (ich trinke gern Kaffee).',

{title:'Negation: não / nicht & kein',en:'Portuguese puts não before the verb. German uses nicht for verbs and adjectives, but kein (= not a / no) in front of nouns.',
pt:'não + verb: Não bebo café. Não gosto de peixe. The same não also means “no” as an answer.',
de:'nicht after the verb or before what it negates: Ich trinke nicht. Ich bin nicht müde. kein/keine before a noun with ein or no article: Ich trinke keinen Kaffee. Ich habe keine Zeit.',
examples:[
{en:'I don’t drink coffee.',pt:'[Não] bebo café.',de:'Ich trinke [keinen] Kaffee.'},
{en:'I don’t understand.',pt:'[Não] percebo.',de:'Ich verstehe [nicht].'},
{en:'He has no time.',pt:'Ele [não] tem tempo.',de:'Er hat [keine] Zeit.'},
{en:'We are not hungry.',pt:'[Não] temos fome.',de:'Wir haben [keinen] Hunger.'},

]}

grammar:[
{title:'Telling the time',en:'Both languages count hours 1–12 in speech and often 24 in writing. German “halb” refers to the coming hour, which is the opposite of English and Portuguese.',
pt:'É uma hora (singular for one), são duas/três… horas. Minutes past: e (duas e dez). Minutes to: menos or para as (três menos dez / dez para as três). Meia = 30, um quarto = 15.',
de:'Es ist ein Uhr, zwei Uhr… Minutes past: nach (zehn nach zwei). Minutes to: vor (zehn vor drei). halb drei = 2:30. Viertel nach / Viertel vor. Times use um: um acht Uhr.',
table:{head:['Clock','Português','Deutsch'],rows:[['1:00','é uma hora','es ist ein Uhr'],['2:10','são duas e dez','es ist zehn nach zwei'],['2:15','são duas e um quarto','es ist Viertel nach zwei'],['2:30','são duas e meia','es ist halb drei'],['2:45','são um quarto para as três','es ist Viertel vor drei'],['2:50','são três menos dez','es ist zehn vor drei']]},
examples:[
{en:'It is half past two.',pt:'São duas e [meia].',de:'Es ist [halb] drei.'},
{en:'It is ten past four.',pt:'São quatro [e] dez.',de:'Es ist zehn [nach] vier.'},
{en:'It is five to eight.',pt:'São oito [menos] cinco.',de:'Es ist fünf [vor] acht.'},
{en:'It is one o’clock.',pt:'[É] uma hora.',de:'Es ist [ein] Uhr.'},
{en:'At nine o’clock.',pt:'[Às] nove horas.',de:'[Um] neun Uhr.'}
]},
{title:'Reflexive verbs (PT) and separable verbs (DE)',en:'Routine verbs look different in each language. Portuguese adds a reflexive pronoun (levantar-se = to raise oneself). German splits the verb: the prefix goes to the end of the sentence.',
pt:'me, te, se, nos, se. In Portugal the pronoun usually follows the verb with a hyphen in statements: levanto-me, deitas-te. It moves in front after não and question words: não me levanto cedo.',
de:'aufstehen → ich stehe … auf. Prefixes like auf-, an-, ein-, zurück-, fern- separate in the present tense and go last: Ich sehe abends fern. Ich komme um sechs zurück.',
examples:[
{en:'I get up at seven.',pt:'[Levanto-me] às sete.',de:'Ich stehe um sieben [auf].'},
{en:'She goes to bed late.',pt:'Ela [deita-se] tarde.',de:'Sie geht spät ins Bett.'},
{en:'I don’t get up early.',pt:'Não [me] levanto cedo.',de:'Ich stehe nicht früh [auf].'},
{en:'We watch TV in the evening.',pt:'[Vemos] televisão à noite.',de:'Wir sehen abends [fern].'},
{en:'He comes back at six.',pt:'Ele [volta] às seis.',de:'Er kommt um sechs [zurück].'}
]},
{title:'Word order: the verb is second in German',en:'In a German statement the conjugated verb is always the second element. If you start with a time word, the subject moves after the verb. Portuguese keeps subject–verb order.',
pt:'Hoje trabalho em casa. À noite vejo televisão. The order is flexible and the subject is usually dropped anyway.',
de:'Heute arbeite ich zu Hause. (not: Heute ich arbeite.) Abends sehe ich fern. Whatever comes first, the verb is second.',
examples:[
{en:'Today I work at home.',pt:'Hoje [trabalho] em casa.',de:'Heute [arbeite] ich zu Hause.'},
{en:'In the morning I drink coffee.',pt:'De manhã [bebo] café.',de:'Morgens [trinke] ich Kaffee.'},
{en:'Tomorrow we go to Porto.',pt:'Amanhã [vamos] ao Porto.',de:'Morgen [fahren] wir nach Porto.'},
{en:'Sometimes she cooks.',pt:'Às vezes ela [cozinha].',de:'Manchmal [kocht] sie.'}
]}
]},

grammar:[
{title:'“There is / there are”: há / es gibt',en:'Portuguese uses the impersonal verb há (from haver), the same for singular and plural. German uses es gibt + accusative.',
pt:'Há uma mesa. Há duas cadeiras. Não há elevador. One form for everything.',
de:'Es gibt einen Tisch (m. → einen). Es gibt eine Küche. Es gibt ein Fenster. Es gibt keinen Aufzug.',
examples:[
{en:'There is a sofa in the living room.',pt:'[Há] um sofá na sala.',de:'Es [gibt] ein Sofa im Wohnzimmer.'},
{en:'There are three windows.',pt:'[Há] três janelas.',de:'Es gibt drei [Fenster].'},
{en:'Is there a lift?',pt:'[Há] elevador?',de:'Gibt es [einen] Aufzug?'},
{en:'There is no garden.',pt:'Não [há] jardim.',de:'Es gibt [keinen] Garten.'}
]},
{title:'Location: estar + em / sein + Dativ',en:'For where something is, Portuguese uses estar (the second “to be”) with em, which merges with the article: em + o = no, em + a = na. German uses in/auf/an + dative: im, in der, auf dem.',
pt:'estar: estou, estás, está, estamos, estão. no (em+o), na (em+a), nos, nas. num (em+um), numa (em+uma). Position words: em cima de (on), debaixo de (under), ao lado de (next to), atrás de (behind), em frente de (in front of).',
de:'Location = dative. in dem → im, in der, auf dem, auf der, an dem → am. Position words: auf (on), unter (under), neben (next to), hinter (behind), vor (in front of), zwischen (between).',
table:{head:['English','Português','Deutsch'],rows:[['in the kitchen','na cozinha','in der Küche'],['in the living room','na sala','im Wohnzimmer'],['on the table','em cima da mesa','auf dem Tisch'],['under the bed','debaixo da cama','unter dem Bett'],['next to the window','ao lado da janela','neben dem Fenster'],['behind the door','atrás da porta','hinter der Tür']]},
examples:[
{en:'The book is on the table.',pt:'O livro está [em cima] da mesa.',de:'Das Buch liegt [auf] dem Tisch.'},
{en:'The cat is under the bed.',pt:'O gato está [debaixo] da cama.',de:'Die Katze ist [unter] dem Bett.'},
{en:'I am in the kitchen.',pt:'[Estou] na cozinha.',de:'Ich bin [in] der Küche.'},
{en:'The lamp is next to the sofa.',pt:'O candeeiro está [ao lado] do sofá.',de:'Die Lampe steht [neben] dem Sofa.'},
{en:'They are at home.',pt:'Eles [estão] em casa.',de:'Sie sind [zu] Hause.'}
]},
{title:'ser vs estar in one glance',en:'Now you have both Portuguese “to be” verbs. Ser = what something is (identity, origin, characteristics). Estar = where it is or how it is right now. German uses sein for both.',
pt:'A casa é grande (characteristic). A casa está limpa (current state). Estou em Lisboa (location). Sou de Lisboa (origin).',
de:'Das Haus ist groß. Das Haus ist sauber. Ich bin in Lissabon. Ich bin aus Lissabon. Always sein.',
examples:[
{en:'The kitchen is big.',pt:'A cozinha [é] grande.',de:'Die Küche [ist] groß.'},
{en:'The kitchen is clean (today).',pt:'A cozinha [está] limpa.',de:'Die Küche [ist] sauber.'},
{en:'I am at home.',pt:'[Estou] em casa.',de:'Ich [bin] zu Hause.'},
{en:'I am Portuguese.',pt:'[Sou] português.',de:'Ich [bin] Portugiese.'},
{en:'The door is open.',pt:'A porta [está] aberta.',de:'Die Tür [ist] offen.'}
]}
]},

grammar:[
{title:'Going places: ir / gehen & fahren',en:'Portuguese ir is highly irregular. German distinguishes gehen (on foot) and fahren (by vehicle); both are the normal way to say “go”.',

de:'gehen: gehe, gehst, geht, gehen, geht, gehen. fahren: fahre, fährst, fährt, fahren, fahrt, fahren. nach + city/country (nach Berlin), zu + place (zum Bahnhof), in + building you enter (ins Kino).',
table:{head:['English','ir','fahren'],rows:[['I go','vou','fahre'],['you go (inf.)','vais','fährst'],['he/she goes','vai','fährt'],['we go','vamos','fahren'],['you go (pl.)','vão','fahrt'],['they go','vão','fahren']]},

]},
{title:'By bus, by train: de / mit + Dativ',en:'Means of transport: Portuguese uses de without an article; German uses mit + dative, with the article.',
pt:'de autocarro, de comboio, de carro, de metro, de bicicleta, a pé (on foot, exception).',

{en:'He goes on foot.',pt:'Ele vai [a] pé.',de:'Er geht zu [Fuß].'}
]},
{title:'Polite requests and the imperative',en:'Giving directions uses the formal imperative. Portuguese formal commands look like the present subjunctive; German puts the verb first and adds Sie.',
pt:'Formal: vire (virar), siga (seguir), vá (ir), tome (tomar). Informal (tu): vira, segue, vai, toma.',
de:'Formal: Biegen Sie ab. Gehen Sie geradeaus. Nehmen Sie den Bus. Informal (du): Bieg ab. Geh geradeaus. Nimm den Bus.',

{en:'Go straight on. (formal)',pt:'[Siga] em frente.',de:'[Gehen] Sie geradeaus.'},
{en:'Take the metro. (informal)',pt:'[Apanha] o metro.',de:'[Nimm] die U-Bahn.'},

grammar:[
{title:'this / that: este, esse, aquele & dieser, das',en:'Portuguese has three distances (near me, near you, far from both) and the forms agree in gender. German mostly uses dieser (this) and das (that) or der/die/das with stress.',
pt:'este/esta (this, near me), esse/essa (that, near you), aquele/aquela (that over there). Neutral forms for things not named: isto, isso, aquilo. Quanto custa isto?',
de:'dieser / diese / dieses (this). For “that”, Germans normally say das or der/die/das da. Was kostet das? Dieses Hemd ist schön.',
examples:[
{en:'This shirt is cheap.',pt:'[Esta] camisa é barata.',de:'[Dieses] Hemd ist billig.'},

]},
{title:'Colours as adjectives',en:'Colours behave like other adjectives. In Portuguese they follow the noun and agree; in German, before a noun they take an ending (A2), after sein they stay bare.',

de:'Das Auto ist rot. Die Schuhe sind schwarz. Before a noun: ein rotes Auto, schwarze Schuhe (endings come in A2).',

{en:'The dress is red.',pt:'O vestido é [vermelho].',de:'Das Kleid ist [rot].'},

{en:'I like the green jacket.',pt:'Gosto do casaco [verde].',de:'Ich mag die [grüne] Jacke.'}
]},
{title:'Modal verbs: can & want (poder, querer / können, wollen, möchten)',en:'Modal verbs go with a second verb in the infinitive. In German that infinitive jumps to the end of the sentence.',
pt:'poder: posso, podes, pode, podemos, podem. querer: quero, queres, quer, queremos, querem. Posso experimentar? Quero comprar isto.',
de:'können: kann, kannst, kann, können, könnt, können. wollen: will, willst, will, wollen, wollt, wollen. möchten (would like, politer): möchte, möchtest, möchte… Kann ich das anprobieren? Ich möchte das kaufen.',

{en:'Do you want these shoes?',pt:'[Queres] estes sapatos?',de:'[Willst] du diese Schuhe?'}
]}

grammar:[
{title:'On Monday, in March, in summer',en:'Time prepositions differ. Portuguese uses em (merged: no/na) for days, months and seasons, and à/às for clock times. German uses am for days, im for months and seasons, um for clock times.',
pt:'na segunda-feira (on Monday), em março (in March), no verão (in summer), às oito (at eight). Days of the week often appear with no preposition at all: segunda vou ao Porto.',
de:'am Montag, im März, im Sommer, um acht Uhr. am = an dem, im = in dem.',
table:{head:['English','Português','Deutsch'],rows:[['on Monday','na segunda-feira','am Montag'],['at the weekend','no fim de semana','am Wochenende'],['in March','em março','im März'],['in summer','no verão','im Sommer'],['at eight o’clock','às oito horas','um acht Uhr'],['in the morning','de manhã','am Morgen / morgens']]},
examples:[

{en:'In winter it snows in Germany.',pt:'[No] inverno neva na Alemanha.',de:'[Im] Winter schneit es in Deutschland.'},
{en:'The party is at nine.',pt:'A festa é [às] nove.',de:'Die Party ist [um] neun.'},
{en:'On Friday I work from home.',pt:'[Na] sexta trabalho em casa.',de:'[Am] Freitag arbeite ich von zu Hause.'}
]},
{title:'Weather: estar + noun (PT) vs es ist + adjective (DE)',en:'Portuguese describes weather with estar plus a noun (está sol, está frio) or fazer. German uses es + verb (es regnet) or es ist + adjective.',
pt:'Está sol / está frio / está calor / está vento. Está a chover, está a nevar (ongoing). Faz frio, faz calor also work.',
de:'Es ist sonnig / kalt / heiß / windig. Es regnet, es schneit. Weather sentences always need the dummy subject es.',
examples:[
{en:'It is windy.',pt:'Está [vento].',de:'Es ist [windig].'},
{en:'It is snowing.',pt:'Está a [nevar].',de:'Es [schneit].'},
{en:'It is cold.',pt:'Está [frio].',de:'Es ist [kalt].'},
{en:'The weather is good today.',pt:'Hoje o tempo está [bom].',de:'Heute ist das Wetter [gut].'},
{en:'It is raining a lot.',pt:'Está a [chover] muito.',de:'Es [regnet] viel.'}
]},
{title:'Ordinal numbers and dates',en:'Portuguese dates use cardinal numbers (dia oito de novembro), except the first. German uses ordinals with -te / -ste and a full stop after the digit (8. November).',
pt:'dia um / primeiro de maio, dia dois de maio, dia vinte e cinco de dezembro. Written: 8 de novembro de 2026.',
de:'der erste Mai, der zweite Mai, der dritte, der siebte, der zwanzigste, der fünfundzwanzigste Dezember. Written: 8.11.2026 or 8. November 2026. “On the…” = am + -ten: am achten November.',

]}

grammar:[
{title:'Feelings and states: estar (PT) / sein (DE)',en:'Temporary states (tired, ill, happy today) take estar in Portuguese. German uses sein as always. Hunger and thirst are “had” in Portuguese and German both.',
pt:'Estou cansado, estás doente, ela está feliz. Permanent character traits take ser: ele é nervoso (he is a nervous person) vs ele está nervoso (he is nervous right now). Tenho fome / sede / frio / calor / medo.',
de:'Ich bin müde, du bist krank, sie ist glücklich. Ich habe Hunger / Durst / Angst. But: mir ist kalt / warm (to me it is cold), not ich bin kalt.',
examples:[
{en:'I am tired.',pt:'[Estou] cansado.',de:'Ich [bin] müde.'},
{en:'Are you ill?',pt:'[Estás] doente?',de:'[Bist] du krank?'},
{en:'I am hungry.',pt:'[Tenho] fome.',de:'Ich [habe] Hunger.'},
{en:'I am cold.',pt:'[Tenho] frio.',de:'[Mir] ist kalt.'},
{en:'She is a calm person.',pt:'Ela [é] calma.',de:'Sie [ist] ein ruhiger Mensch.'},
{en:'She is calm now.',pt:'Agora ela [está] calma.',de:'Jetzt [ist] sie ruhig.'}
]},
{title:'Saying what hurts: doer / wehtun',en:'Both languages make the body part the subject and the person an indirect object: “the head hurts to me”.',
pt:'dói-me (singular) / doem-me (plural) + body part. Dói-me a cabeça. Doem-me os pés. For you: dói-te; for him/her: dói-lhe. Or simply: tenho dor de + body part.',
de:'mir tut … weh (singular) / mir tun … weh (plural). Mir tut der Kopf weh. Mir tun die Füße weh. For you: dir; for him: ihm; for her: ihr. Or: ich habe Kopfschmerzen / Bauchschmerzen / Zahnschmerzen.',
examples:[

grammar:[
{title:'PT irregular pasts: ser/ir, estar, ter, fazer',en:'Ser and ir share exactly the same past forms (fui = I was / I went); context decides. Learn these four as blocks.',
pt:'ser/ir: fui, foste, foi, fomos, foram. estar: estive, estiveste, esteve, estivemos, estiveram. ter: tive, tiveste, teve, tivemos, tiveram. fazer: fiz, fizeste, fez, fizemos, fizeram. Also: vir → vim, vieste, veio, viemos, vieram. dizer → disse, disseste, disse, dissemos, disseram. poder → pude, pudeste, pôde, pudemos, puderam.',
de:'German uses war/hatte (Präteritum) for “was” and “had” even in speech: ich war, du warst, er war, wir waren, ihr wart, sie waren. ich hatte, du hattest, er hatte, wir hatten, ihr hattet, sie hatten.',
table:{head:['English','ser / ir','estar','ter','fazer'],rows:[['I','fui','estive','tive','fiz'],['you (inf.)','foste','estiveste','tiveste','fizeste'],['he/she','foi','esteve','teve','fez'],['we','fomos','estivemos','tivemos','fizemos'],['they','foram','estiveram','tiveram','fizeram']]},
examples:[
{en:'I went to Germany last year.',pt:'[Fui] à Alemanha o ano passado.',de:'Ich bin letztes Jahr nach Deutschland [gefahren].'},
{en:'It was very good.',pt:'[Foi] muito bom.',de:'Es [war] sehr gut.'},
{en:'Were you at the party?',pt:'[Estiveste] na festa?',de:'[Warst] du auf der Party?'},
{en:'We had a problem.',pt:'[Tivemos] um problema.',de:'Wir [hatten] ein Problem.'},
{en:'What did you do?',pt:'O que [fizeste]?',de:'Was hast du [gemacht]?'},
{en:'They came late.',pt:'Eles [vieram] tarde.',de:'Sie sind spät [gekommen].'}
]},
{title:'DE Perfekt with sein',en:'Verbs of movement from A to B (gehen, fahren, kommen, fliegen), of change of state (aufwachen, einschlafen, werden, sterben) and bleiben/sein/passieren form the Perfekt with sein.',
pt:'(No equivalent split: Portuguese uses the simple past for all of these.)',
de:'Ich bin gegangen / gefahren / gekommen / geflogen / aufgestanden / angekommen / geblieben / gewesen. Es ist passiert. Many are strong verbs with irregular participles: gehen → gegangen, fahren → gefahren, kommen → gekommen, bleiben → geblieben, sein → gewesen, werden → geworden.',
table:{head:['Infinitive','Participle (sein)','Example'],rows:[['gehen','gegangen','Ich bin nach Hause gegangen.'],['fahren','gefahren','Wir sind nach Porto gefahren.'],['kommen','gekommen','Sie ist spät gekommen.'],['fliegen','geflogen','Er ist nach Lissabon geflogen.'],['aufstehen','aufgestanden','Ich bin um sieben aufgestanden.'],['bleiben','geblieben','Wir sind zu Hause geblieben.']]},
examples:[
{en:'I went home.',pt:'[Fui] para casa.',de:'Ich [bin] nach Hause gegangen.'},
{en:'She flew to Lisbon.',pt:'Ela [voou] para Lisboa.',de:'Sie ist nach Lissabon [geflogen].'},
{en:'We got up early.',pt:'[Levantámo-nos] cedo.',de:'Wir sind früh [aufgestanden].'},
{en:'He stayed at home.',pt:'Ele [ficou] em casa.',de:'Er ist zu Hause [geblieben].'},
{en:'They arrived at nine.',pt:'Eles [chegaram] às nove.',de:'Sie [sind] um neun angekommen.'}
]},
{title:'Strong participles with haben',en:'Common irregular participles that still take haben. They usually end in -en and often change the vowel.',
pt:'(Compare the Portuguese irregular pasts in the first point: ver → vi, viste, viu; dar → dei, deste, deu; pôr → pus, puseste, pôs; trazer → trouxe, trouxeste, trouxe; saber → soube.)',
de:'essen → gegessen, trinken → getrunken, sehen → gesehen, lesen → gelesen, schreiben → geschrieben, sprechen → gesprochen, nehmen → genommen, geben → gegeben, finden → gefunden, schlafen → geschlafen, bringen → gebracht, denken → gedacht, wissen → gewusst.',
examples:[
{en:'I read the book.',pt:'[Li] o livro.',de:'Ich habe das Buch [gelesen].'},
{en:'Did you drink the coffee?',pt:'[Bebeste] o café?',de:'Hast du den Kaffee [getrunken]?'},
{en:'She gave me a present.',pt:'Ela [deu-me] uma prenda.',de:'Sie hat mir ein Geschenk [gegeben].'},
{en:'We found a good restaurant.',pt:'[Encontrámos] um bom restaurante.',de:'Wir haben ein gutes Restaurant [gefunden].'},
{en:'He slept ten hours.',pt:'Ele [dormiu] dez horas.',de:'Er hat zehn Stunden [geschlafen].'},
{en:'I brought wine.',pt:'[Trouxe] vinho.',de:'Ich habe Wein [mitgebracht].'}
]}
]},

grammar:[
{title:'Near future: ir + infinitive / present + time word',en:'Portuguese says “I am going to do” like English: ir + infinitive. German simply uses the present tense with a time word; werden + infinitive exists but is less common in speech.',
pt:'vou trabalhar, vais ver, vai chover, vamos jantar, vão viajar. Amanhã vou ao ginásio (ir alone also works for “going to a place”).',
de:'Morgen gehe ich ins Kino. Nächste Woche fahren wir nach Porto. Am Samstag spielt er Fußball. Formal future: Ich werde morgen arbeiten.',
examples:[
{en:'Tomorrow I am going to work from home.',pt:'Amanhã [vou] trabalhar em casa.',de:'Morgen [arbeite] ich von zu Hause.'},
{en:'We are going to have dinner out.',pt:'[Vamos] jantar fora.',de:'Wir [gehen] essen.'},
{en:'It is going to rain.',pt:'[Vai] chover.',de:'Es [wird] regnen.'},
{en:'Are you going to come?',pt:'[Vais] vir?',de:'[Kommst] du?'},
{en:'They are going to travel in August.',pt:'Eles [vão] viajar em agosto.',de:'Sie [reisen] im August.'}
]},
{title:'How often: frequency words and their position',en:'Frequency adverbs sit near the verb. In German they come right after the verb (or after a pronoun object); in Portuguese they are flexible, often at the end.',
pt:'sempre, muitas vezes, às vezes, raramente, nunca. Nunca needs no extra não when it comes before the verb: nunca vou; but não vou nunca is also heard. Uma vez / duas vezes por semana, todos os dias, ao fim de semana.',
de:'immer, oft, manchmal, selten, nie. Ich gehe oft ins Kino. Ich sehe sie selten. einmal / zweimal pro Woche, jeden Tag, am Wochenende, jeden Samstag.',
examples:[
{en:'I never watch TV.',pt:'[Nunca] vejo televisão.',de:'Ich sehe [nie] fern.'},
{en:'She often goes running.',pt:'Ela corre [muitas vezes].',de:'Sie geht [oft] laufen.'},
{en:'We train three times a week.',pt:'Treinamos três [vezes] por semana.',de:'Wir trainieren [dreimal] pro Woche.'},
{en:'Sometimes I paint.',pt:'[Às vezes] pinto.',de:'[Manchmal] male ich.'},
{en:'He plays football every Saturday.',pt:'Ele joga futebol [todos] os sábados.',de:'Er spielt [jeden] Samstag Fußball.'}
]},
{title:'Suggestions: vamos…? / Gehen wir…? and “let’s”',en:'Suggesting an activity: Portuguese uses the nós form as a question or “que tal…?”. German uses the verb-first wir form, or “Lass uns…” / “Wollen wir…?”.',
pt:'Vamos ao cinema? Que tal um café? E se fôssemos à praia? (more advanced). Answer: Boa ideia! / Pode ser. / Hoje não posso.',
de:'Gehen wir ins Kino? Wollen wir einen Kaffee trinken? Lass uns an den Strand fahren! Wie wäre es mit einem Kaffee? Answer: Gute Idee! / Gern! / Heute kann ich nicht.',
examples:[

{en:'How about a walk?',pt:'[Que tal] um passeio?',de:'[Wie wäre es] mit einem Spaziergang?'},

{en:'I can’t today, maybe tomorrow.',pt:'Hoje não [posso], talvez amanhã.',de:'Heute [kann] ich nicht, vielleicht morgen.'}
]}
]},

grammar:[
{title:'Where to vs where: accusative and dative (DE); a/para vs em (PT)',en:'German two-way prepositions (in, an, auf, über, unter, vor, hinter, neben, zwischen) take accusative for movement towards (wohin?) and dative for position (wo?). Portuguese uses a/para for direction and em for position.',
pt:'Direction: vou a Lisboa (short), vou para Lisboa (longer/permanent), vou ao hotel, vou à praia. Position: estou em Lisboa, estou no hotel, estou na praia.',
de:'Wohin? Ich gehe in das (ins) Hotel, an den Strand, auf den Markt. Wo? Ich bin in dem (im) Hotel, an dem (am) Strand, auf dem Markt. Cities and countries: nach Lissabon (to), in Lissabon (in).',
table:{head:['English','Português','Deutsch'],rows:[['to the hotel','para o hotel','ins Hotel (acc.)'],['in the hotel','no hotel','im Hotel (dat.)'],['to the beach','à praia','an den Strand (acc.)'],['at the beach','na praia','am Strand (dat.)'],['to Berlin','a / para Berlim','nach Berlin'],['in Berlin','em Berlim','in Berlin']]},
examples:[
{en:'We are going to the beach.',pt:'Vamos [à] praia.',de:'Wir fahren [an] den Strand.'},
{en:'We are at the beach.',pt:'Estamos [na] praia.',de:'Wir sind [am] Strand.'},
{en:'I am flying to Berlin.',pt:'Vou [para] Berlim.',de:'Ich fliege [nach] Berlin.'},
{en:'She lives in Berlin.',pt:'Ela mora [em] Berlim.',de:'Sie wohnt [in] Berlin.'},
{en:'Put the suitcase in the car.',pt:'Põe a mala [no] carro.',de:'Stell den Koffer [ins] Auto.'},
{en:'The suitcase is in the car.',pt:'A mala está [no] carro.',de:'Der Koffer ist [im] Auto.'}
]},
{title:'Polite requests: queria / ich möchte, ich hätte gern, könnten Sie',en:'Asking for things politely uses softened verb forms in both languages.',
pt:'queria (imperfect of querer) is the standard polite “I would like”. Podia…? (could you…?) also uses the imperfect: Podia ajudar-me? Era possível…?',
de:'ich möchte / ich hätte gern (I would like). Könnten Sie…? (could you…?) uses Konjunktiv II: Könnten Sie mir helfen? Könnte ich bitte…?',
examples:[
{en:'I would like a room with a sea view.',pt:'[Queria] um quarto com vista para o mar.',de:'Ich [hätte] gern ein Zimmer mit Meerblick.'},
{en:'Could you help me with the suitcase?',pt:'[Podia] ajudar-me com a mala?',de:'[Könnten] Sie mir mit dem Koffer helfen?'},
{en:'Could I have the key, please?',pt:'[Podia] dar-me a chave, por favor?',de:'[Könnte] ich bitte den Schlüssel haben?'},
{en:'We would like to check in.',pt:'[Queríamos] fazer o check-in.',de:'Wir [möchten] einchecken.'}
]},
{title:'From … to: de … a / von … bis, até',en:'Ranges of time and place. Portuguese de … a/até; German von … bis. Note “until” = até / bis.',

de:'von Montag bis Freitag, von neun bis fünf, von Lissabon nach Porto (place uses nach), bis morgen, bis zehn Uhr.',

grammar:[
{title:'Quantities and “some / any”',en:'Measures come with “de” in Portuguese and nothing in German. Indefinite amounts: algum/alguma, um pouco de / etwas, ein bisschen, einige.',
pt:'um quilo de maçãs, uma garrafa de vinho, um pouco de sal, alguns tomates, algumas cebolas. Partitive “some” is usually just left out: quero pão.',
de:'ein Kilo Äpfel, eine Flasche Wein, etwas Salz, ein bisschen Pfeffer, einige Tomaten. Measures stay singular: zwei Kilo, drei Glas Wein (spoken), zwei Flaschen Wasser (Flaschen is pluralised).',
examples:[
{en:'A kilo of potatoes, please.',pt:'Um quilo [de] batatas, se faz favor.',de:'Ein [Kilo] Kartoffeln, bitte.'},
{en:'Two bottles of water.',pt:'Duas [garrafas] de água.',de:'Zwei [Flaschen] Wasser.'},
{en:'I need a little salt.',pt:'Preciso de um [pouco] de sal.',de:'Ich brauche [etwas] Salz.'},
{en:'Do you have any tomatoes?',pt:'Tens [alguns] tomates?',de:'Hast du [Tomaten]?'},
{en:'A piece of cake.',pt:'Uma [fatia] de bolo.',de:'Ein [Stück] Kuchen.'}
]},
{title:'Recipes: the informal imperative (PT) and the infinitive (DE)',en:'Portuguese recipes talk to “tu” or “você”; German recipes typically use bare infinitives at the end of the instruction, or the formal Sie.',
pt:'tu form = present tu without -s: corta, mistura, junta, frita, coze. Negative uses the subjunctive: não cortes, não juntes. você form: corte, misture, junte.',
de:'Recipe style: Die Zwiebel schneiden. Das Wasser kochen. Salz dazugeben. Formal: Schneiden Sie die Zwiebel. Informal du: Schneid die Zwiebel. Gib Salz dazu.',
examples:[
{en:'Cut the tomatoes.',pt:'[Corta] os tomates.',de:'Die Tomaten [schneiden].'},
{en:'Mix the flour and the eggs.',pt:'[Mistura] a farinha e os ovos.',de:'Mehl und Eier [verrühren].'},
{en:'Boil the rice for ten minutes.',pt:'[Coze] o arroz durante dez minutos.',de:'Den Reis zehn Minuten [kochen].'},
{en:'Don’t add sugar.',pt:'Não [juntes] açúcar.',de:'[Keinen] Zucker dazugeben.'},
{en:'Bake for thirty minutes.',pt:'[Assa] durante trinta minutos.',de:'Dreißig Minuten [backen].'}
]},
{title:'Direct object pronouns with o/a and the dative in German',en:'“Cut it”, “add them”: the pronoun agrees with the noun. In European Portuguese it attaches after the verb and changes after -r, -s, -z: cortá-lo, pô-lo. German accusative pronouns: ihn, sie, es.',
pt:'frita-a (fry it, f.), corta-o (cut it, m.), junta-os (add them). After an infinitive: vou cortá-lo (cortar + o → cortá-lo), vou comê-la.',
de:'Schneide ihn (der Apfel), brate sie (die Zwiebel), koche es (das Wasser). Plural: schneide sie. The verb bestellen takes accusative: Ich bestelle ihn (den Fisch).',
examples:[
{en:'Cut the onion and fry it.',pt:'Corta a cebola e [frita-a].',de:'Schneide die Zwiebel und brate [sie] an.'},
{en:'I am going to order it (the fish).',pt:'Vou [pedi-lo].',de:'Ich bestelle [ihn].'},
{en:'Add them (the tomatoes) at the end.',pt:'[Junta-os] no fim.',de:'Gib [sie] am Ende dazu.'},
{en:'Do you want to try it (the cake)?',pt:'Queres [prová-lo]?',de:'Willst du [ihn] probieren?'}
]}
]},

grammar:[
{title:'Indirect object: to me, to you / mir, dir',en:'Sending and giving things to someone. Portuguese indirect pronouns (me, te, lhe) attach to the verb; German dative pronouns stand alone and come before the accusative noun.',
pt:'envio-te o link, dá-me o carregador, mando-lhe a foto, mostro-vos o site. With a noun: envio o link ao Pedro (a + o = ao), dou a chave à Ana.',
de:'Ich schicke dir den Link. Gib mir das Ladegerät. Ich schicke ihm das Foto. Order: dative pronoun before accusative noun. With a noun: Ich schicke dem Pedro den Link / Ich gebe der Ana den Schlüssel.',
examples:[

{en:'I gave the password to my sister.',pt:'Dei a palavra-passe [à] minha irmã.',de:'Ich habe [meiner] Schwester das Passwort gegeben.'}
]},
{title:'When + future: quando chegares / wenn du ankommst',en:'“When you arrive” about the future. Portuguese uses the future subjunctive (chegares); German uses the present after wenn with the verb at the end.',
pt:'quando + futuro do conjuntivo: quando chegares, quando tiveres tempo, quando puderes, quando fores. For regular verbs it looks like the infinitive: quando falares, quando comeres.',
de:'wenn + present, verb last: wenn du ankommst, wenn du Zeit hast, wenn du kannst, wenn du gehst. The main clause can follow with verb first: Wenn du ankommst, schreib mir.',
examples:[
{en:'Call me when you arrive.',pt:'Liga-me quando [chegares].',de:'Ruf mich an, wenn du [ankommst].'},

{en:'I’ll pay when I can.',pt:'Pago quando [puder].',de:'Ich zahle, wenn ich [kann].'},
{en:'When we get home, we’ll eat.',pt:'Quando [chegarmos] a casa, comemos.',de:'Wenn wir nach Hause [kommen], essen wir.'}
]},

{en:'Don’t forget to water the plants.',pt:'Não te esqueças de regar as plantas.',de:'Vergiss nicht, die Pflanzen zu gießen.'},

grammar:[
{title:'Informal commands and requests between partners',en:'The tu imperative in Portuguese and the du imperative in German, plus how to soften them.',
pt:'tu imperative = present tu minus -s: lava, arruma, deita, rega. Irregular: faz (fazer), põe (pôr), vem (vir), vai (ir), sê (ser), diz (dizer). Negative: present subjunctive: não laves, não faças, não ponhas. Soften with podes…? or se faz favor.',
de:'du imperative = verb stem, no pronoun: mach, räum auf, bring raus, gieß. Vowel-changing verbs keep the change: nimm (nehmen), gib (geben), lies (lesen), iss (essen). sein → sei. Separable prefixes go last: Räum die Küche auf. Soften with mal or bitte: Mach mal das Fenster zu.',
examples:[
{en:'Make the bed, please.',pt:'[Faz] a cama, por favor.',de:'[Mach] bitte das Bett.'},
{en:'Tidy up your things.',pt:'[Arruma] as tuas coisas.',de:'[Räum] deine Sachen auf.'},
{en:'Don’t leave the towel on the floor.',pt:'Não [deixes] a toalha no chão.',de:'[Lass] das Handtuch nicht auf dem Boden.'},
{en:'Put the plates in the dishwasher.',pt:'[Põe] os pratos na máquina.',de:'[Stell] die Teller in die Spülmaschine.'},
{en:'Come here and help me.',pt:'[Vem] cá ajudar-me.',de:'[Komm] her und hilf mir.'}
]},
{title:'Placement of reflexive and object pronouns (PT) in commands',en:'In Portuguese, pronouns attach after affirmative commands but move before the verb in negative commands. German pronouns keep their normal place.',
pt:'Levanta-te! → Não te levantes! Dá-me isso! → Não me dês isso! Esquece-te disso! → Não te esqueças disso! The accent/hyphen patterns are the same as in statements.',
de:'Steh auf! → Steh nicht auf! Gib mir das! → Gib mir das nicht! Vergiss das! → Vergiss das nicht! Pronoun position does not change.',
examples:[
{en:'Sit down.',pt:'[Senta-te].',de:'Setz [dich].'},
{en:'Don’t worry.',pt:'Não [te] preocupes.',de:'Mach [dir] keine Sorgen.'},
{en:'Give it to me.',pt:'[Dá-mo].',de:'Gib es [mir].'},
{en:'Don’t forget it.',pt:'Não [te] esqueças disso.',de:'Vergiss [das] nicht.'}
]},
{title:'Thanking for an action: obrigado por + infinitive / danke, dass',en:'Thanking someone for something they did. Portuguese uses por + (personal) infinitive; German uses danke, dass + clause with the verb at the end, or danke für + noun.',
pt:'Obrigado por cozinhares (personal infinitive: cozinhar + -es for tu). Obrigada pela ajuda (por + a = pela). Obrigado por tudo.',
de:'Danke, dass du gekocht hast (verb last). Danke für die Hilfe. Danke für alles. Vielen Dank fürs Aufräumen (für das → fürs + nominalised verb).',
examples:[
{en:'Thanks for helping me.',pt:'Obrigado por me [ajudares].',de:'Danke, dass du mir geholfen [hast].'},
{en:'Thank you for the dinner.',pt:'Obrigada [pelo] jantar.',de:'Danke [für] das Abendessen.'},
{en:'Thanks for coming.',pt:'Obrigado por [vires].',de:'Danke, dass du gekommen [bist].'},
{en:'Thanks for everything.',pt:'Obrigado por [tudo].',de:'Danke für [alles].'}
]}
]},

grammar:[
{title:'Comparatives: mais … do que / -er als',en:'Portuguese puts “mais” (more) or “menos” (less) in front of the adjective; German adds -er to the adjective and often an umlaut. “Than” = do que / als. “As … as” = tão … como / so … wie.',
pt:'mais alto do que, menos caro do que, tão bonito como. Irregular: bom → melhor, mau → pior, grande → maior, pequeno → mais pequeno (menor).',
de:'größer als, billiger als, so schön wie. Umlaut in many short adjectives: alt → älter, groß → größer, jung → jünger, kurz → kürzer. Irregular: gut → besser, viel → mehr, gern → lieber, hoch → höher.',
table:{head:['English','Português','Deutsch'],rows:[['taller than','mais alto do que','größer als'],['cheaper than','mais barato do que','billiger als'],['better than','melhor do que','besser als'],['worse than','pior do que','schlechter als'],['older than','mais velho do que','älter als'],['as nice as','tão simpático como','so nett wie']]},
examples:[

{en:'My sister is younger than me.',pt:'A minha irmã é mais nova [do que] eu.',de:'Meine Schwester ist jünger [als] ich.'},
{en:'This wine is better than that one.',pt:'Este vinho é [melhor] do que aquele.',de:'Dieser Wein ist [besser] als der da.'},

{en:'I like tea more than coffee.',pt:'Gosto [mais] de chá do que de café.',de:'Ich trinke [lieber] Tee als Kaffee.'}

{title:'Superlatives: o mais … / der -ste, am -sten',en:'Portuguese: article + mais + adjective (+ de). German: der/die/das + -ste before a noun, or am -sten after sein.',
pt:'o mais alto, a mais bonita, os mais caros; o melhor, o pior, o maior. “Of” = de/da/do: o melhor restaurante da cidade.',
de:'der größte, die schönste, das teuerste; der beste, der schlechteste, der größte. After sein: am größten, am besten. Adjectives ending in -t, -d, -s, -z add -est: der älteste, der kürzeste.',

{en:'August is the hottest month.',pt:'Agosto é o mês mais [quente].',de:'Der August ist der [heißeste] Monat.'},
{en:'I like this one the most.',pt:'Gosto [mais] deste.',de:'Dieses mag ich am [liebsten].'}

{title:'DE adjective endings before a noun (the basics)',en:'In German, an adjective in front of a noun needs an ending. The most useful rule: after der/die/das use -e (nominative) or -en; after ein/eine use -er / -e / -es to show the gender. Portuguese adjectives simply agree in gender and number.',
pt:'o homem alto, a mulher alta, os homens altos, as mulheres altas. Position: usually after the noun; a few common ones go before (bom, grande, novo) with a slight meaning change: um grande homem (great) vs um homem grande (big).',
de:'Nominative after der/die/das: der große Mann, die große Frau, das große Kind, die großen Kinder. After ein/eine: ein großer Mann, eine große Frau, ein großes Kind. Accusative masculine adds -en: ich sehe den großen Mann / einen großen Mann. Everything else at A2 level can be -e or -en by these patterns.',
table:{head:['Case','after der/die/das','after ein/eine'],rows:[['nom. m.','der nette Mann','ein netter Mann'],['nom. f.','die nette Frau','eine nette Frau'],['nom. n.','das nette Kind','ein nettes Kind'],['nom. pl.','die netten Leute','nette Leute'],['acc. m.','den netten Mann','einen netten Mann']]},
examples:[

{en:'the pretty girl',pt:'a rapariga [bonita]',de:'das [hübsche] Mädchen'},

{en:'I have a new car.',pt:'Tenho um carro [novo].',de:'Ich habe ein [neues] Auto.'},
{en:'I know the tall man.',pt:'Conheço o homem [alto].',de:'Ich kenne den [großen] Mann.'}
]}
]},

grammar:[
{title:'Because: porque / weil (verb to the end)',en:'Giving a reason. The Portuguese clause keeps normal word order. The German weil-clause sends the conjugated verb to the very end; a modal verb goes after the infinitive.',
pt:'Não posso porque tenho de trabalhar. Fico em casa porque estou cansado. Spoken alternative: é que (Não vou, é que estou cansado).',
de:'Ich kann nicht, weil ich arbeiten muss. Ich bleibe zu Hause, weil ich müde bin. Perfekt: …, weil ich zu viel gegessen habe. Comma before weil is compulsory.',
examples:[
{en:'I am staying home because I am tired.',pt:'Fico em casa porque [estou] cansado.',de:'Ich bleibe zu Hause, weil ich müde [bin].'},
{en:'She can’t come because she has to work.',pt:'Ela não pode vir porque [tem] de trabalhar.',de:'Sie kann nicht kommen, weil sie arbeiten [muss].'},
{en:'We are late because we missed the bus.',pt:'Estamos atrasados porque [perdemos] o autocarro.',de:'Wir sind spät dran, weil wir den Bus verpasst [haben].'},
{en:'I am learning German because my girlfriend is German.',pt:'Aprendo alemão porque a minha namorada [é] alemã.',de:'Ich lerne Deutsch, weil meine Freundin Deutsche [ist].'}
]},
{title:'“I think that…”: achar que / finden, dass',en:'Reporting thoughts and opinions. Again the German dass-clause puts the verb last. Portuguese que-clauses keep the normal order; que can never be dropped.',
pt:'Acho que… (I think that), penso que…, sei que…, espero que (+ subjunctive, B1). Acho que ela vem. Sei que estás cansado.',
de:'Ich finde, dass… / ich glaube, dass… / ich weiß, dass… / ich hoffe, dass… Ich glaube, dass sie kommt. Ich weiß, dass du müde bist. Without dass the verb stays second: Ich glaube, sie kommt.',
examples:[
{en:'I think that he is right.',pt:'Acho que ele [tem] razão.',de:'Ich finde, dass er recht [hat].'},
{en:'I know that you are busy.',pt:'Sei que [estás] ocupado.',de:'Ich weiß, dass du beschäftigt [bist].'},
{en:'She says that she is coming.',pt:'Ela diz que [vem].',de:'Sie sagt, dass sie [kommt].'},
{en:'I believe the party is on Friday.',pt:'Acho que a festa [é] na sexta.',de:'Ich glaube, dass die Party am Freitag [ist].'}
]},
{title:'If: se / wenn, and “so”: por isso / deshalb',en:'Conditions and consequences. Wenn also sends the verb to the end. Deshalb is a normal adverb, so the verb comes right after it (verb-second rule).',
pt:'Se chover, ficamos em casa (future subjunctive with se, same as quando). Se tiveres tempo, liga-me. Estou cansado, por isso vou dormir.',
de:'Wenn es regnet, bleiben wir zu Hause. Wenn du Zeit hast, ruf mich an. Ich bin müde, deshalb gehe ich schlafen (verb right after deshalb).',
examples:[
{en:'If it rains, we stay at home.',pt:'Se [chover], ficamos em casa.',de:'Wenn es [regnet], bleiben wir zu Hause.'},
{en:'If you have time, come by.',pt:'Se [tiveres] tempo, passa por cá.',de:'Wenn du Zeit [hast], komm vorbei.'},
{en:'I am tired, so I am going to bed.',pt:'Estou cansado, [por isso] vou deitar-me.',de:'Ich bin müde, [deshalb] gehe ich ins Bett.'},
{en:'If you want, I’ll cook.',pt:'Se [quiseres], eu cozinho.',de:'Wenn du [willst], koche ich.'}
]}
]}

grammar:[
{title:'PT present subjunctive after doubt and feeling',en:'The subjunctive (conjuntivo) appears after expressions of doubt, wish, feeling and evaluation, and after “não acho que”. German has no equivalent here: it uses the ordinary indicative.',
pt:'Forms: take the eu present, drop -o, swap the vowel. falar → fale, fales, fale, falemos, falem. comer → coma, comas, coma, comamos, comam. abrir → abra… Irregular: ser → seja, estar → esteja, ter → tenha, ir → vá, fazer → faça, saber → saiba, poder → possa, haver → haja, querer → queira, dar → dê. Triggers: não acho que, duvido que, é importante que, é possível que, espero que, quero que, embora.',
de:'Ich glaube nicht, dass das stimmt. Es ist wichtig, dass du kommst. Ich bezweifle, dass er recht hat. Obwohl es teuer ist… Plain indicative every time.',
table:{head:['Infinitive','Subjunctive (eu/tu/ele)','Trigger example'],rows:[['ser','seja / sejas / seja','não acho que seja verdade'],['estar','esteja / estejas / esteja','duvido que esteja certo'],['ter','tenha / tenhas / tenha','é importante que tenhas razão'],['fazer','faça / faças / faça','é possível que faça frio'],['poder','possa / possas / possa','espero que possas vir'],['ir','vá / vás / vá','embora vá tarde']]},
examples:[
{en:'I don’t think it is true.',pt:'Não acho que [seja] verdade.',de:'Ich glaube nicht, dass es [stimmt].'},
{en:'I doubt that he is right.',pt:'Duvido que ele [tenha] razão.',de:'Ich bezweifle, dass er recht [hat].'},
{en:'It is important that you come.',pt:'É importante que [venhas].',de:'Es ist wichtig, dass du [kommst].'},
{en:'Although it is expensive, I like it.',pt:'Embora [seja] caro, gosto.',de:'Obwohl es teuer [ist], gefällt es mir.'},
{en:'It is possible that it will rain.',pt:'É possível que [chova].',de:'Es ist möglich, dass es [regnet].'},
{en:'I hope you can come.',pt:'Espero que [possas] vir.',de:'Ich hoffe, dass du kommen [kannst].'}
]},
{title:'Concession: obwohl / trotzdem and embora / mesmo assim',en:'Two ways to concede a point. A conjunction (although) joins two clauses; an adverb (nevertheless) starts a new sentence. In German the conjunction obwohl sends the verb to the end, while trotzdem keeps verb-second.',
pt:'embora + subjunctive: embora seja caro. apesar de + infinitive: apesar de ser caro. mesmo assim / no entanto + normal clause: É caro. Mesmo assim, compro.',
de:'obwohl + verb at end: Obwohl es teuer ist, kaufe ich es. trotzdem + verb second: Es ist teuer. Trotzdem kaufe ich es. Also: zwar … aber: Es ist zwar teuer, aber gut.',
examples:[
{en:'Although I am tired, I will go.',pt:'Embora [esteja] cansado, vou.',de:'[Obwohl] ich müde bin, gehe ich.'},
{en:'It is far; nevertheless we go on foot.',pt:'É longe; [mesmo assim] vamos a pé.',de:'Es ist weit; [trotzdem] gehen wir zu Fuß.'},
{en:'Despite being ill, he worked.',pt:'[Apesar de] estar doente, trabalhou.',de:'Obwohl er krank [war], hat er gearbeitet.'},
{en:'It is cheap, but not good.',pt:'É barato, [mas] não é bom.',de:'Es ist [zwar] billig, aber nicht gut.'}
]},
{title:'Softening disagreement',en:'Direct contradiction sounds harsher in German than Germans intend, and softer in Portuguese than the Portuguese intend. These hedges keep a discussion friendly in both.',
pt:'Acho que não é bem assim. Não sei se concordo. Se calhar tens razão, mas… Percebo o que queres dizer, mas… Lá isso é verdade (that much is true).',
de:'Ich bin mir nicht sicher, ob… Da bin ich anderer Meinung. Das sehe ich anders. Ich verstehe, was du meinst, aber… Da hast du nicht ganz unrecht (you are not entirely wrong).',
examples:[
{en:'I see it differently.',pt:'Eu vejo isso de outra [maneira].',de:'Das sehe ich [anders].'},
{en:'I am not sure I agree.',pt:'Não sei [se] concordo.',de:'Ich bin mir nicht sicher, [ob] ich zustimme.'},
{en:'I understand what you mean, but…',pt:'[Percebo] o que queres dizer, mas…',de:'Ich [verstehe], was du meinst, aber…'},
{en:'You may be right.',pt:'Se calhar [tens] razão.',de:'Du [könntest] recht haben.'}
]}
]},

{en:'to complain',pt:'queixar-se',de:'sich beschweren / sich beklagen',icon:'😩'},

{en:'embarrassed',pt:'envergonhado / envergonhada',de:'verlegen / peinlich berührt',icon:'😳',note:'PT: embaraçado exists but envergonhado is the natural word. DE: Das ist mir peinlich = I am embarrassed.'},

],
phrases:[
{en:'I want you to come with me.',pt:'Quero que venhas comigo.',de:'Ich will, dass du mitkommst.'},
{en:'I hope everything goes well.',pt:'Espero que corra tudo bem.',de:'Ich hoffe, dass alles gut geht.'},
{en:'I miss you.',pt:'Tenho saudades tuas.',de:'Ich vermisse dich.'},
{en:'If I had more time, I would travel more.',pt:'Se tivesse mais tempo, viajava mais.',de:'Wenn ich mehr Zeit hätte, würde ich mehr reisen.'},
{en:'What would you do in my place?',pt:'O que farias no meu lugar?',de:'Was würdest du an meiner Stelle tun?'},
{en:'I would love to live by the sea.',pt:'Adorava viver à beira-mar.',de:'Ich würde liebend gern am Meer wohnen.'},
{en:'If only it were summer!',pt:'Quem me dera que fosse verão!',de:'Wenn doch nur Sommer wäre!'},
{en:'I’m sorry, I didn’t mean it.',pt:'Desculpa, não foi por mal.',de:'Es tut mir leid, das war nicht so gemeint.'},
{en:'I’m proud of you.',pt:'Tenho orgulho em ti.',de:'Ich bin stolz auf dich.'},
{en:'Don’t be afraid.',pt:'Não tenhas medo.',de:'Hab keine Angst.'},
{en:'It would be better to wait.',pt:'Seria melhor esperar.',de:'Es wäre besser zu warten.'}
],
grammar:[
{title:'Wanting someone else to do something: querer que + subjunctive / wollen, dass',en:'“I want you to…” has no infinitive in either language. Portuguese: querer que + subjunctive. German: wollen, dass + clause with the verb at the end (indicative).',
pt:'Quero que venhas. Ela quer que eu ligue. Prefiro que fiques. Peço-te que esperes. Same pattern with esperar que, desejar que, gostar que (gostava que viesses, B2).',
de:'Ich will, dass du kommst. Sie will, dass ich anrufe. Ich möchte, dass du bleibst. Ich bitte dich, dass du wartest (or: ich bitte dich zu warten).',
examples:[
{en:'I want you to stay.',pt:'Quero que [fiques].',de:'Ich will, dass du [bleibst].'},
{en:'She wants me to call her mother.',pt:'Ela quer que eu [ligue] à mãe dela.',de:'Sie will, dass ich ihre Mutter [anrufe].'},
{en:'I hope you like it.',pt:'Espero que [gostes].',de:'Ich hoffe, dass es dir [gefällt].'},
{en:'We prefer that you come tomorrow.',pt:'Preferimos que [venhas] amanhã.',de:'Wir möchten lieber, dass du morgen [kommst].'},
{en:'I need you to help me.',pt:'Preciso que me [ajudes].',de:'Ich brauche dich, damit du mir [hilfst].'}
]},
{title:'Would: the conditional (PT) and würde / wäre / hätte (DE)',en:'“I would…”. Portuguese has a conditional tense (faria), but in speech the imperfeito often replaces it (fazia). German uses würde + infinitive, except for sein, haben and modals, which have their own Konjunktiv II forms.',
pt:'Conditional: infinitive + -ia: falaria, comeria, abriria; irregular stems: faria (fazer), diria (dizer), traria (trazer). Spoken: Eu comprava esse carro = I would buy that car. Gostava de… = I would like to… (the normal polite form in Portugal).',
de:'würde + infinitive at the end: Ich würde das Auto kaufen. sein → wäre, haben → hätte, können → könnte, müssen → müsste, sollen → sollte, dürfen → dürfte, wollen → wollte, wissen → wüsste, geben → es gäbe.',
table:{head:['English','Português (spoken / formal)','Deutsch'],rows:[['I would go','ia / iria','ich würde gehen'],['I would be','era / seria','ich wäre'],['I would have','tinha / teria','ich hätte'],['I could','podia / poderia','ich könnte'],['I would like','gostava de / gostaria de','ich würde gern / ich möchte'],['there would be','havia / haveria','es gäbe']]},
examples:[
{en:'I would buy a house by the sea.',pt:'[Comprava] uma casa à beira-mar.',de:'Ich [würde] ein Haus am Meer kaufen.'},
{en:'That would be great.',pt:'Isso [seria] ótimo.',de:'Das [wäre] toll.'},
{en:'I would like to learn Italian.',pt:'[Gostava] de aprender italiano.',de:'Ich [würde] gern Italienisch lernen.'},
{en:'Could you help me?',pt:'[Podias] ajudar-me?',de:'[Könntest] du mir helfen?'},
{en:'We would have more time.',pt:'[Teríamos] mais tempo.',de:'Wir [hätten] mehr Zeit.'}
]},
{title:'Unreal conditions: se + imperfeito do conjuntivo / wenn + Konjunktiv II',en:'“If I had… I would…”. Portuguese uses the past subjunctive in the if-clause (tivesse, fosse, pudesse). German uses Konjunktiv II in both halves.',
pt:'Past subjunctive: from the eles perfeito minus -ram, plus -sse: falaram → falasse, falasses, falasse, falássemos, falassem. ser/ir → fosse, ter → tivesse, estar → estivesse, fazer → fizesse, poder → pudesse, haver → houvesse. Se tivesse dinheiro, comprava / compraria.',
de:'Wenn ich Geld hätte, würde ich es kaufen. Wenn ich du wäre, … (if I were you). Wenn es möglich wäre, … Wenn ich könnte, würde ich kommen. Verb goes to the end of the wenn-clause; the main clause starts with the verb.',
examples:[
{en:'If I had money, I would buy it.',pt:'Se [tivesse] dinheiro, comprava.',de:'Wenn ich Geld [hätte], würde ich es kaufen.'},
{en:'If I were you, I would wait.',pt:'Se [fosse] a ti, esperava.',de:'Wenn ich du [wäre], würde ich warten.'},
{en:'If it were possible, we would move to Lisbon.',pt:'Se [fosse] possível, mudávamos para Lisboa.',de:'Wenn es möglich [wäre], würden wir nach Lissabon ziehen.'},
{en:'If you could, would you come?',pt:'Se [pudesses], vinhas?',de:'Wenn du [könntest], würdest du kommen?'},
{en:'If we lived in Germany, you would speak German every day.',pt:'Se [vivêssemos] na Alemanha, falavas alemão todos os dias.',de:'Wenn wir in Deutschland [wohnten], würdest du jeden Tag Deutsch sprechen.'}
]}
]},

grammar:[
{title:'Relative clauses: que / der, die, das',en:'Linking a noun to a clause that describes it. Portuguese uses que for people and things (quem after prepositions, onde for places). German uses der/die/das in the case the pronoun has inside the clause, and sends the verb to the end.',
pt:'o colega que trabalha comigo (subject), o livro que li (object), a empresa onde trabalho, a pessoa com quem falei, o dia em que cheguei.',
de:'Nominative: der Kollege, der neben mir sitzt. Accusative: das Buch, das ich gelesen habe. Dative: die Frau, der ich geholfen habe. With preposition: die Firma, bei der ich arbeite; der Tag, an dem ich ankam. Plural: die Leute, die hier arbeiten.',
table:{head:['Case','masculine','feminine','neuter','plural'],rows:[['nominative','der','die','das','die'],['accusative','den','die','das','die'],['dative','dem','der','dem','denen']]},
examples:[
{en:'The man who lives here is a doctor.',pt:'O homem [que] mora aqui é médico.',de:'Der Mann, [der] hier wohnt, ist Arzt.'},
{en:'The film that we saw was boring.',pt:'O filme [que] vimos era aborrecido.',de:'Der Film, [den] wir gesehen haben, war langweilig.'},
{en:'The company where I work is small.',pt:'A empresa [onde] trabalho é pequena.',de:'Die Firma, [in] der ich arbeite, ist klein.'},
{en:'The woman I helped is my neighbour.',pt:'A mulher [que] ajudei é minha vizinha.',de:'Die Frau, [der] ich geholfen habe, ist meine Nachbarin.'},
{en:'The colleagues who came are nice.',pt:'Os colegas [que] vieram são simpáticos.',de:'Die Kollegen, [die] gekommen sind, sind nett.'},
{en:'The person I spoke with was the boss.',pt:'A pessoa com [quem] falei era o chefe.',de:'Die Person, mit [der] ich gesprochen habe, war der Chef.'}
]},
{title:'“Have been doing”: tenho trabalhado / ich arbeite seit',en:'An action that started in the past and continues. Portuguese has a compound tense for repeated recent action (tenho + participle); German simply uses the present with seit. For “for X years” both languages also use present-tense constructions.',
pt:'Trabalho aqui há sete anos (present + há). Tenho trabalhado muito ultimamente (repeated action up to now). Estou a aprender alemão desde janeiro.',
de:'Ich arbeite seit sieben Jahren hier (present + seit + dative). Ich arbeite in letzter Zeit viel. Ich lerne seit Januar Deutsch. Never the Perfekt for something still going on.',
examples:[
{en:'I have worked here for seven years.',pt:'Trabalho aqui [há] sete anos.',de:'Ich arbeite [seit] sieben Jahren hier.'},
{en:'I have been learning German since January.',pt:'Aprendo alemão [desde] janeiro.',de:'Ich lerne [seit] Januar Deutsch.'},
{en:'Lately I have been working a lot.',pt:'Ultimamente [tenho] trabalhado muito.',de:'In letzter Zeit [arbeite] ich viel.'},
{en:'We have known each other for two years.',pt:'Conhecemo-nos [há] dois anos.',de:'Wir kennen uns [seit] zwei Jahren.'},
{en:'How long have you lived in Oeiras?',pt:'[Há] quanto tempo moras em Oeiras?',de:'[Seit] wann wohnst du in Oeiras?'}
]},
{title:'The genitive and “of”: de / des, der, -s',en:'Possession between nouns. Portuguese always uses de (do, da). German uses the genitive case in writing (des Mannes, der Firma) and von + dative in speech.',
pt:'o carro do Pedro, a casa da minha mãe, o nome da empresa, o fim do mês.',
de:'Written: das Auto des Mannes (m./n. add -(e)s to the noun), der Name der Firma, das Ende des Monats. Spoken: das Auto von Pedro, das Haus von meiner Mutter. Names: Pedros Auto, Annas Haus.',
examples:[
{en:'The name of the company.',pt:'O nome [da] empresa.',de:'Der Name [der] Firma.'},
{en:'The end of the month.',pt:'O fim [do] mês.',de:'Das Ende [des] Monats.'},
{en:'My mother’s house.',pt:'A casa [da] minha mãe.',de:'Das Haus [meiner] Mutter.'},
{en:'Pedro’s car.',pt:'O carro [do] Pedro.',de:'[Pedros] Auto.'},
{en:'The boss’s office.',pt:'O escritório [do] chefe.',de:'Das Büro [des] Chefs.'}
]}
]},

{en:'to hurt oneself',pt:'magoar-se / aleijar-se',de:'sich verletzen / sich wehtun',icon:'🤕'},

{en:'to rest',pt:'descansar',de:'sich ausruhen / sich schonen',icon:'🛋️'},
{en:'to lose weight',pt:'emagrecer / perder peso',de:'abnehmen',icon:'⚖️'},

{en:'to stretch',pt:'alongar / fazer alongamentos',de:'sich dehnen',icon:'🧘'},
{en:'to warm up',pt:'aquecer',de:'sich aufwärmen',icon:'🔥'},
{en:'workout',pt:'o treino',de:'das Training / das Workout',icon:'🏋️',pos:'noun'},
