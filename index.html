reading:{title:'Editorial: on a leaked memo',intro:'A newspaper-style opinion piece. Watch the hedging and attribution.',
en:'The memo that reached this newspaper on Tuesday is, strictly speaking, not evidence of anything. It is three pages of internal reasoning, undated, unsigned, and written in the hedged dialect of people who expect to be quoted later. Its author, who is said to be a senior adviser, appears to recommend delaying the announcement until after the regional elections. The ministry has not denied that the document is genuine; it has merely insisted that no decision was taken on that basis.\nThat may well be true. By and large, governments postpone unwelcome news whenever they can, and a memo suggesting they do so is hardly a scandal. What is harder to downplay is the timing. If, as the adviser allegedly wrote, the figures were available in March, then the public was told in June something the ministry had known for three months.\nAdmittedly, a draft is not a policy. Nonetheless, the ministry would do well to publish the full document rather than let it leak in pieces. If anything, the silence is doing more damage than the memo.',
pt:'O memorando que chegou a este jornal na terça-feira não é, em rigor, prova de coisa alguma. São três páginas de raciocínio interno, sem data, sem assinatura, escritas no dialeto cauteloso de quem conta vir a ser citado. O autor, que será um assessor sénior, parece recomendar que o anúncio seja adiado para depois das eleições regionais. O ministério não negou que o documento seja autêntico; limitou-se a insistir que nenhuma decisão foi tomada com base nele.\nPode bem ser verdade. De um modo geral, os governos adiam as más notícias sempre que podem, e um memorando a sugerir que o façam dificilmente é um escândalo. Mais difícil de desvalorizar é o momento. Se, como o assessor alegadamente escreveu, os números estavam disponíveis em março, então o público foi informado em junho de algo que o ministério sabia há três meses.\nÉ certo que um rascunho não é uma política. Não obstante, o ministério faria bem em publicar o documento completo em vez de o deixar sair aos bocados. Quando muito, o silêncio está a fazer mais estragos do que o memorando.',
de:'Das Memo, das diese Zeitung am Dienstag erreichte, ist streng genommen kein Beweis für irgendetwas. Es sind drei Seiten interner Überlegungen, undatiert, nicht unterschrieben und verfasst im vorsichtigen Dialekt von Leuten, die damit rechnen, später zitiert zu werden. Der Verfasser, bei dem es sich um einen ranghohen Berater handeln soll, scheint zu empfehlen, die Ankündigung bis nach den Regionalwahlen zu verschieben. Das Ministerium hat nicht bestritten, dass das Dokument echt ist; es hat lediglich darauf beharrt, auf dieser Grundlage sei keine Entscheidung getroffen worden.\nDas mag durchaus stimmen. Im Großen und Ganzen schieben Regierungen unangenehme Nachrichten auf, wann immer sie können, und ein Memo, das genau dies vorschlägt, ist kaum ein Skandal. Schwerer herunterzuspielen ist der Zeitpunkt. Wenn die Zahlen, wie der Berater angeblich schrieb, bereits im März vorlagen, dann erfuhr die Öffentlichkeit im Juni etwas, was das Ministerium seit drei Monaten wusste.\nZugegebenermaßen ist ein Entwurf noch keine Politik. Gleichwohl täte das Ministerium gut daran, das vollständige Dokument zu veröffentlichen, statt es stückweise durchsickern zu lassen. Wenn überhaupt, richtet das Schweigen mehr Schaden an als das Memo.',
questions:['Find three hedges in the first paragraph of your target language.','How does each language render “is said to be a senior adviser”?','Which sentence contains the conditional accusation, and how is it softened?']}},

reading:{title:'A dinner of false friends',intro:'A playful text built on the traps in this unit. Count how many you catch.',
en:'The first time Zeca met his girlfriend’s parents, he had prepared for everything except vocabulary. He told her father he had brought a small gift, and her father, who spoke no English, heard “Gift” and looked at the bottle with suspicion. He then said her mother’s cooking was exquisite, which his girlfriend translated faithfully as “esquisito”, so that for a moment everyone believed he found it weird. When the father asked what he actually did, he answered that he was a sales engineer and currently worked on a big project; “aktuell” and “eigentlich” changed places in his head and he said the opposite.\nHer brother asked if he was brave, meaning well-behaved, and Zeca, flattered, said yes, very. By dessert he had claimed to have a sensitive plan for the future, a sympathetic boss and an eventual promotion, each word landing one country away from where he had aimed it.\nHer grandmother, who had watched all this in silence, patted his hand and said he was simpático, which everyone at the table understood correctly, at last.',
pt:'A primeira vez que o Zeca conheceu os pais da namorada, tinha-se preparado para tudo menos para o vocabulário. Disse ao pai dela que trazia uma pequena prenda, e o pai, que não falava inglês, ouviu «Gift» e olhou para a garrafa com desconfiança. Depois disse que a comida da mãe era «exquisite», que a namorada traduziu fielmente por «esquisita», de modo que por um momento todos acreditaram que ele a achava estranha. Quando o pai perguntou o que ele fazia realmente, respondeu que era engenheiro de vendas e que atualmente trabalhava num grande projeto; «aktuell» e «eigentlich» trocaram de lugar na cabeça dele e disse o contrário.\nO irmão perguntou-lhe se era «brav», querendo dizer bem-comportado, e o Zeca, lisonjeado, disse que sim, muito. À sobremesa já tinha afirmado ter um plano «sensível» para o futuro, um chefe «simpático» e uma promoção «eventual», cada palavra a aterrar a um país de distância do sítio onde ele a tinha apontado.\nA avó, que assistira a tudo em silêncio, deu-lhe uma palmadinha na mão e disse que ele era simpático, o que toda a mesa percebeu corretamente, por fim.',
de:'Als Zeca die Eltern seiner Freundin zum ersten Mal traf, hatte er sich auf alles vorbereitet außer auf den Wortschatz. Er sagte ihrem Vater, er habe ein kleines Gift mitgebracht, und der Vater, der kein Englisch sprach, hörte „Gift“ und betrachtete die Flasche mit Argwohn. Dann sagte er, das Essen ihrer Mutter sei „exquisite“, was seine Freundin getreu mit „esquisito“ übersetzte, sodass alle einen Moment lang glaubten, er fände es seltsam. Als der Vater fragte, was er eigentlich mache, antwortete er, er sei Vertriebsingenieur und arbeite aktuell an einem großen Projekt; „aktuell“ und „eigentlich“ tauschten in seinem Kopf die Plätze, und er sagte das Gegenteil.\nIhr Bruder fragte, ob er brav sei, und meinte wohlerzogen, und Zeca, geschmeichelt, sagte ja, sehr. Beim Nachtisch hatte er bereits behauptet, einen „sensiblen“ Plan für die Zukunft, einen „sympathischen“ Chef und eine „eventuelle“ Beförderung zu haben, wobei jedes Wort ein Land neben dem landete, auf das er gezielt hatte.\nIhre Großmutter, die das alles schweigend beobachtet hatte, tätschelte seine Hand und sagte, er sei sympathisch, was endlich alle am Tisch richtig verstanden.',
questions:['List every false friend used in the text.','Which word is a false friend between all three languages?','In the German version, find the Konjunktiv I forms used for reported speech.']}},

reading:{title:'Minutes of a kick-off meeting',intro:'Business minutes in the three languages.',
en:'Project: Automation of Zone B, Oeiras DC. Date: 3 November 2026. Present: client project lead, client IT, supplier sales engineer, supplier commissioning lead.\n1. Scope. The supplier confirmed that the offer covers two autonomous picking robots, the conveyor interface and integration with the client’s warehouse management system. Shelf relabelling in Zone B remains the client’s responsibility and must be completed before commissioning.\n2. Schedule. Delivery of hardware is planned for week 6; commissioning for weeks 8 to 10; go-live on 15 March. The client asked whether the schedule could be brought forward by two weeks. The supplier will check with production and respond by Friday.\n3. Commercial. Payment terms were agreed at 30 % on order, 60 % on delivery and 10 % on acceptance. The volume discount of 5 % applies if the option for Zone C is exercised before go-live.\n4. Risks. The IT team flagged that the current WMS version does not support the required interface. An upgrade is scheduled for January; the supplier requested written confirmation of the date.\nNext meeting: 17 November, 10:00, online.',
pt:'Projeto: Automatização da Zona B, CD de Oeiras. Data: 3 de novembro de 2026. Presentes: gestor de projeto do cliente, TI do cliente, engenheiro de vendas do fornecedor, responsável de comissionamento do fornecedor.\n1. Âmbito. O fornecedor confirmou que a proposta abrange dois robôs autónomos de picking, a interface com o tapete transportador e a integração com o sistema de gestão de armazém do cliente. A reetiquetagem das prateleiras da Zona B continua a ser responsabilidade do cliente e deve estar concluída antes do comissionamento.\n2. Calendário. A entrega do equipamento está prevista para a semana 6; o comissionamento para as semanas 8 a 10; o arranque para 15 de março. O cliente perguntou se seria possível antecipar o calendário em duas semanas. O fornecedor irá verificar com a produção e responder até sexta-feira.\n3. Condições comerciais. Foram acordadas as condições de pagamento de 30 % na encomenda, 60 % na entrega e 10 % na aceitação. O desconto de volume de 5 % aplica-se caso a opção para a Zona C seja exercida antes do arranque.\n4. Riscos. A equipa de TI alertou que a versão atual do WMS não suporta a interface necessária. Está prevista uma atualização para janeiro; o fornecedor solicitou confirmação por escrito da data.\nPróxima reunião: 17 de novembro, 10h00, online.',
de:'Projekt: Automatisierung Zone B, Verteilzentrum Oeiras. Datum: 3. November 2026. Anwesend: Projektleitung Kunde, IT Kunde, Vertriebsingenieur Lieferant, Inbetriebnahmeleitung Lieferant.\n1. Leistungsumfang. Der Lieferant bestätigte, dass das Angebot zwei autonome Kommissionierroboter, die Förderbandschnittstelle und die Integration in das Lagerverwaltungssystem des Kunden umfasst. Die Neubeschriftung der Regale in Zone B bleibt in der Verantwortung des Kunden und muss vor der Inbetriebnahme abgeschlossen sein.\n2. Terminplan. Die Lieferung der Hardware ist für Kalenderwoche 6 geplant, die Inbetriebnahme für die Wochen 8 bis 10, der Go-live für den 15. März. Der Kunde fragte, ob der Terminplan um zwei Wochen vorgezogen werden könne. Der Lieferant klärt dies mit der Produktion und antwortet bis Freitag.\n3. Kaufmännisches. Als Zahlungsbedingungen wurden 30 % bei Bestellung, 60 % bei Lieferung und 10 % bei Abnahme vereinbart. Der Mengenrabatt von 5 % gilt, sofern die Option für Zone C vor dem Go-live gezogen wird.\n4. Risiken. Das IT-Team wies darauf hin, dass die aktuelle WMS-Version die erforderliche Schnittstelle nicht unterstützt. Ein Upgrade ist für Januar vorgesehen; der Lieferant bat um schriftliche Bestätigung des Termins.\nNächste Besprechung: 17. November, 10:00 Uhr, online.',
questions:['What remains the client’s responsibility?','Under what condition does the 5 % discount apply, and which verb mood expresses the condition in your target language?','How are “week 6” and “go-live” rendered in each language?']}},

{id:'c2-05',title:'The last traps: grammar natives get wrong too',icon:'🪤',
intro:'Fine points that mark a near-native speaker, including a few that native speakers themselves argue about. Use this unit as a checklist, not a lesson.',
vocab:[
{en:'haver vs ter (there is / to have)',pt:'há / tem',de:'es gibt / hat',icon:'⚖️',note:'PT: standard “há três pessoas”; colloquial Brazil says “tem três pessoas”; Portugal keeps há.'},
{en:'a gente (= we, colloquial)',pt:'a gente vai',de:'wir gehen / man geht',icon:'👥',note:'PT: a gente takes the 3rd person singular verb. Colloquial but universal.'},
{en:'mesóclise (pronoun inside the verb)',pt:'dar-lhe-ei',de:'(no equivalent)',icon:'🔧'},
{en:'próclise after negation and certain adverbs',pt:'não o vi / já o vi / também te disse',de:'(no equivalent)',icon:'↩️',note:'PT: pronouns move before the verb after não, nunca, já, também, ainda, só, que, quem, onde, and question words.'},
{en:'ser vs estar with location of events',pt:'a festa é em casa / a casa está limpa',de:'(sein for both)',icon:'📍',note:'PT: events use ser for location (a reunião é na sala 3); objects use estar.'},
{en:'the dative of advantage / possession (DE)',pt:'(—)',de:'Ich wasche mir die Hände / Mir ist kalt',icon:'🫳'},
{en:'lassen: to let, to have done, to leave',pt:'deixar / mandar fazer / deixar',de:'lassen',icon:'🔀',note:'DE: Ich lasse das Auto reparieren = I have the car repaired.'},
{en:'scheinbar vs anscheinend',pt:'aparentemente (falso) / aparentemente (provável)',de:'scheinbar / anscheinend',icon:'🪞',note:'DE: scheinbar = only seemingly (not really); anscheinend = apparently (probably true). Even natives mix them.'},
{en:'das Gleiche vs dasselbe',pt:'igual / o mesmo',de:'das Gleiche / dasselbe',icon:'🟰',note:'DE: dasselbe = the identical one; das Gleiche = one of the same kind.'},
{en:'wegen + genitive / dative',pt:'por causa de',de:'wegen des Regens (standard) / wegen dem Regen (colloquial)',icon:'🌧️'},
{en:'als vs wie in comparisons',pt:'do que / como',de:'größer als / so groß wie',icon:'📏',note:'DE: “größer wie” is a common native error; standard is als.'},
{en:'seit vs vor',pt:'há (duration) / há (ago)',de:'seit zwei Jahren / vor zwei Jahren',icon:'⏳',note:'PT uses há for both; DE splits seit (since/for) and vor (ago).'},
{en:'brauchen + zu (negative)',pt:'não é preciso',de:'Du brauchst nicht zu kommen',icon:'🚫',note:'DE: “brauchen” takes zu in the negative; colloquially often dropped.'},
{en:'conjuntivo after “talvez”',pt:'talvez venha',de:'vielleicht kommt er',icon:'🎲',note:'PT: talvez before the verb requires the subjunctive.'},
{en:'infinitivo pessoal vs conjuntivo',pt:'para fazermos / para que façamos',de:'(um … zu / damit)',icon:'🔁',note:'PT: both are correct; the personal infinitive is lighter and more common in Portugal.'},
{en:'o senhor / a senhora + 3rd person',pt:'o senhor quer…?',de:'Möchten Sie…?',icon:'🎩'},
{en:'gender traps',pt:'o problema, o mapa, a mão, a tribo',de:'das Mädchen, der Käse, die Butter, das Messer',icon:'⚧️',note:'PT: -ma words of Greek origin are masculine (o problema, o sistema, o clima). DE: gender must be memorised; -chen is always neuter.'},
{en:'plural traps',pt:'o pão → os pães; o cão → os cães; a mão → as mãos',de:'das Wort → die Wörter / die Worte',icon:'➕',note:'DE: Wörter = individual words; Worte = words as speech.'},
{en:'crase-free: “à” vs “a”',pt:'vou à praia (a + a) / vou a Lisboa',de:'(—)',icon:'✍️',note:'PT: à = a + a (feminine article). No article with most city names, so “a Lisboa”.'},
{en:'Konjunktiv II in polite questions',pt:'podia / poderia',de:'Könnten Sie… / Hätten Sie…',icon:'🙏'}
],
phrases:[
{en:'I haven’t seen him yet, but I’ve already told you that.',pt:'Ainda não o vi, mas já te disse isso.',de:'Ich habe ihn noch nicht gesehen, aber das habe ich dir schon gesagt.'},
{en:'The meeting is in room 3; the room is clean.',pt:'A reunião é na sala 3; a sala está limpa.',de:'Die Besprechung ist in Raum 3; der Raum ist sauber.'},
{en:'I had the car repaired yesterday.',pt:'Mandei arranjar o carro ontem.',de:'Ich habe gestern das Auto reparieren lassen.'},
{en:'He is apparently ill. (probably true)',pt:'Pelos vistos está doente.',de:'Er ist anscheinend krank.'},
{en:'We don’t need to leave yet.',pt:'Ainda não é preciso sairmos.',de:'Wir brauchen noch nicht zu gehen.'},
{en:'Maybe she’ll come tomorrow.',pt:'Talvez ela venha amanhã.',de:'Vielleicht kommt sie morgen.'}
],
grammar:[
{title:'Portuguese pronoun placement: the complete rule',en:'European Portuguese puts object pronouns after the verb by default (ênclise) but before it (próclise) after negation, most adverbs, subordinating words and question words; inside the verb (mesóclise) in the future and conditional of formal writing. This single rule explains most of what sounds “Portuguese” rather than Brazilian.',
pt:'Default: Vi-o. Dou-te. Proclitic triggers: não o vi; nunca te disse; já me falou; também se queixou; ainda não a conheço; só o vi ontem; que me diga; quem te disse; onde a puseste; quando nos encontrarmos; porque é que te zangaste? Mesoclitic: dir-te-ei, far-se-á (formal). Infinitive after preposition: para te ver / para ver-te (both heard).',
de:'German pronoun order is governed by the middle field: pronouns come early, after the conjugated verb, accusative before dative when both are pronouns (ich gebe es dir), dative before accusative when the accusative is a noun (ich gebe dir das Buch).',
examples:[
{en:'I saw him.',pt:'[Vi-o].',de:'Ich habe [ihn] gesehen.'},
{en:'I didn’t see him.',pt:'Não [o] vi.',de:'Ich habe [ihn] nicht gesehen.'},
{en:'I already told you.',pt:'Já [te] disse.',de:'Ich habe [es] dir schon gesagt.'},
{en:'Who told you?',pt:'Quem [te] disse?',de:'Wer hat [es] dir gesagt?'},
{en:'I will tell you tomorrow. (formal)',pt:'[Dir-te-ei] amanhã.',de:'Ich werde [es] dir morgen sagen.'},
{en:'I give it to you.',pt:'[Dou-to].',de:'Ich gebe [es] dir.'}
]},
{title:'German middle-field order and the end-field verb cluster',en:'In a German sentence, after the verb comes the “middle field”, ordered roughly: pronouns, subject (if not first), time, cause, manner, place (te-ka-mo-lo), then the rest, and finally the verb cluster: participle or infinitive, with modals last in subordinate clauses. Portuguese word order is far freer and relies on intonation.',
pt:'Portuguese order is flexible: Ontem dei-lhe o livro em casa / Dei-lhe ontem o livro em casa / Em casa, ontem, dei-lhe o livro. Emphasis by position, not by rule.',
de:'Ich habe ihm gestern wegen des Regens schnell zu Hause das Buch gegeben. Subordinate verb cluster: …, dass ich das Buch gestern habe lesen wollen / …, weil er es nicht hat machen können (colloquial: machen konnte). Two infinitives: the finite verb jumps in front of them (Ersatzinfinitiv).',
examples:[
{en:'I gave him the book at home yesterday.',pt:'Ontem [dei-lhe] o livro em casa.',de:'Ich habe ihm [gestern] zu Hause das Buch gegeben.'},
{en:'…because he couldn’t do it.',pt:'…porque ele não [conseguiu] fazê-lo.',de:'…weil er es nicht machen [konnte].'},
{en:'…that I wanted to read the book.',pt:'…que eu [queria] ler o livro.',de:'…dass ich das Buch lesen [wollte].'},
{en:'…that I had wanted to read the book.',pt:'…que eu [tinha] querido ler o livro.',de:'…dass ich das Buch [habe] lesen wollen.'},
{en:'She quickly gave it to me.',pt:'Ela [deu-mo] depressa.',de:'Sie hat [es] mir schnell gegeben.'}
]}
],
reading:{title:'A letter to my future self, in two languages',intro:'The closing text of the course. Each of you reads the version in your target language; the English is for the shape of it.',
en:'By the time you read this, you will have been studying for a year. You will still make mistakes: you will put a pronoun in the wrong place, you will say “wie” where “als” belongs, you will reach for the subjunctive and find the indicative in your mouth. None of that matters as much as the fact that you will understand the grandmother, the news, the contract and the joke.\nRemember how it started: one word in three columns, thank you, obrigado, danke. Remember that the two of you did the same page on the same evening and compared answers, and that the comparing was the point. The languages were never the goal. The goal was the sentence one of you would say, one day, without thinking, in the other’s language, and the other would answer without noticing which language it was.\nIf you have reached this unit, that sentence has probably already happened. Go back to the first unit and read it again; it will feel like a photograph. Then close this course, and go and talk.',
pt:'Quando leres isto, já estudas há um ano. Ainda vais errar: vais pôr um pronome no sítio errado, vais dizer «wie» onde devia estar «als», vais procurar o conjuntivo e encontrar o indicativo na boca. Nada disso importa tanto como o facto de ires perceber a avó, as notícias, o contrato e a piada.\nLembra-te de como começou: uma palavra em três colunas, thank you, obrigado, danke. Lembra-te de que os dois fizeram a mesma página na mesma noite e compararam respostas, e de que comparar era o objetivo. As línguas nunca foram a meta. A meta era a frase que um de vocês diria, um dia, sem pensar, na língua do outro, e que o outro responderia sem reparar em que língua era.\nSe chegaste a esta unidade, essa frase provavelmente já aconteceu. Volta à primeira unidade e lê-a outra vez; vai parecer uma fotografia. Depois fecha este curso, e vai falar.',
de:'Wenn du das hier liest, lernst du seit einem Jahr. Du wirst noch Fehler machen: Du wirst ein Pronomen an die falsche Stelle setzen, du wirst „wie“ sagen, wo „als“ hingehört, du wirst nach dem Konjunktiv greifen und den Indikativ im Mund finden. Nichts davon zählt so viel wie die Tatsache, dass du die Großmutter, die Nachrichten, den Vertrag und den Witz verstehen wirst.\nErinnere dich, wie es anfing: ein Wort in drei Spalten, thank you, obrigado, danke. Erinnere dich, dass ihr beide am selben Abend dieselbe Seite gemacht und die Antworten verglichen habt, und dass das Vergleichen der Sinn der Sache war. Die Sprachen waren nie das Ziel. Das Ziel war der Satz, den einer von euch eines Tages sagen würde, ohne nachzudenken, in der Sprache des anderen, und auf den der andere antworten würde, ohne zu merken, in welcher Sprache.\nWenn du bei dieser Einheit angekommen bist, ist dieser Satz wahrscheinlich schon gefallen. Geh zurück zur ersten Einheit und lies sie noch einmal; sie wird sich wie ein Foto anfühlen. Dann schließ diesen Kurs, und geh reden.',
questions:['Find the future perfect / compound future in the first sentence of each version.','Which mistakes does the text predict you will still make, and have you made them?']}}
]});

<script>
(function(){
'use strict';
const LANGS={pt:{name:'Português (PT)',short:'PT',flag:'🇵🇹'},de:{name:'Deutsch (DE)',short:'DE',flag:'🇩🇪'},en:{name:'English',short:'EN',flag:'🇬🇧'}};
const COURSE=window.COURSE_DATA||[];
const $=(s,el)=>(el||document).querySelector(s);
const app=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const strip=s=>String(s).replace(/\[|\]/g,'');
const markup=s=>esc(s).replace(/\[([^\]]+)\]/g,'<mark>$1</mark>');

/* ---------- storage ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem('odk:'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('odk:'+k,JSON.stringify(v));}catch(e){}}
};
const state={
  lang:store.get('lang',null)||(store.get('who','de')==='pt'?'pt':'de'), // language used in Practice
  view:store.get('view2','cards'), // cards | table
  lenient:store.get('lenient',true),
  progress:store.get('progress',{}), // keyed by practice language: {de:{unitId:{best,done}}, pt:{…}}
  flags:store.get('flags',[]),
  route:{page:'home'}
};
function save(){store.set('lang',state.lang);store.set('view2',state.view);store.set('lenient',state.lenient);store.set('progress',state.progress);store.set('flags',state.flags);}
function target(){return state.lang;}
function other(){return target()==='de'?'pt':'de';}
function uprog(uid,lang){const L=lang||state.lang;const p=state.progress[L]||(state.progress[L]={});return p[uid]||(p[uid]={known:[],best:{}});}

/* ---------- toast ---------- */
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1800);}

/* ---------- routing ---------- */
function go(r,push){state.route=r;render();window.scrollTo(0,0);if(r.page==='level'||r.page==='unit'){const h=r.page==='level'?r.level.toLowerCase():r.unit;if(location.hash!=='#'+h){try{history.replaceState(null,'','#'+h);}catch(e){}}}else if(location.hash){try{history.replaceState(null,'',' ');}catch(e){}}}
function fromHash(){const h=(location.hash||'').replace('#','');if(!h)return {page:'home'};for(const L of COURSE){if(L.id.toLowerCase()===h)return {page:'level',level:L.id};for(const U of L.units){if(U.id===h)return {page:'unit',level:L.id,unit:U.id,tab:'learn'};}}return {page:'home'};}
window.addEventListener('hashchange',()=>{state.route=fromHash();render();});

/* ---------- helpers ---------- */
function findUnit(uid){for(const L of COURSE){for(const U of L.units){if(U.id===uid)return {L,U};}}return null;}
function unitItems(U){return [].concat(U.vocab||[]);}
function levelProgress(L,lang){let total=0,done=0;for(const U of L.units){total++;if(uprog(U.id,lang).done)done++;}return {total,done};}
function unitPct(U,lang){const p=uprog(U.id,lang);const av=EXERCISES.filter(e=>e.available(U));if(!av.length)return 0;const sum=av.reduce((s,e)=>s+Math.min(p.best[e.id]||0,70)/70,0);return Math.round(sum/av.length*100);}
function unitStatus(U,lang){return uprog(U.id,lang).done?'✓':unitPct(U,lang)+'%';}
function checkDone(U){const p=uprog(U.id);const exDone=EXERCISES.filter(e=>e.available(U)).every(e=>(p.best[e.id]||0)>=70);if(exDone&&!p.done){p.done=true;save();toast('Unit complete ✓');}}
function isFlagged(key){return state.flags.some(f=>f.key===key);}
function toggleFlag(key,text){const i=state.flags.findIndex(f=>f.key===key);if(i>=0){state.flags.splice(i,1);toast('Flag removed');}else{state.flags.push({key,text,who:LANGS[state.lang].short+' learner',when:new Date().toISOString().slice(0,10)});toast('Flagged for correction');}save();render();}

/* ---------- normalisation for typing ---------- */
const ARTICLES=/^(o|a|os|as|um|uma|uns|umas|der|die|das|den|dem|des|ein|eine|einen|einem|einer|eines)\s+/i;
function norm(s,lenient){s=String(s).toLowerCase().trim().replace(/\s+/g,' ').replace(/[.!?,;:¡¿"“”]/g,'');s=s.replace(/\([^)]*\)/g,'').trim();if(lenient){s=s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ß/g,'ss').replace(ARTICLES,'').replace(/\s+/g,' ').trim();}return s;}
function answersOf(s){return String(s).split(' / ').map(x=>strip(x).trim()).filter(Boolean);}
function matches(input,answer){const l=state.lenient;const a=norm(input,l);return answersOf(answer).some(x=>norm(x,l)===a);}

/* ---------- render: shell ---------- */
function render(){const r=state.route;document.querySelectorAll('#langSeg [data-lang]').forEach(b=>{const on=b.dataset.lang===state.lang;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);});
  if(r.page==='home')renderHome();else if(r.page==='level')renderLevel(r.level);else if(r.page==='unit')renderUnit(r);else if(r.page==='search')renderSearch(r.q||'');else renderHome();}

function crumbs(parts){return '<div class="crumbs">'+parts.map((p,i)=>i<parts.length-1?`<button data-go="${p.go}">${esc(p.t)}</button><span>›</span>`:`<span>${esc(p.t)}</span>`).join('')+'</div>';}

/* ---------- home ---------- */

  const totalUnits=COURSE.reduce((n,L)=>n+L.units.length,0);

  app.innerHTML=`
  <section class="hero stack">
    <h1>One course, two targets, English in the middle.</h1>
    <p class="muted">${totalUnits} units · ${totalVocab} words and phrases · A1 to C2. Every item is shown in English, <span style="color:var(--pt);font-weight:700">European Portuguese</span> and <span style="color:var(--de);font-weight:700">German</span>, so you both study the same page. The <b>DE / PT</b> switch at the top only decides which language the exercises ask for.</p>
  </section>
  <section class="stack" style="margin-top:8px">

        <div class="small">${esc(L.canDo)}</div>
        <div class="progressline"><span class="dual"><span class="de">DE</span></span><div class="bar"><i style="width:${Math.round(pd.done/pd.total*100)}%;background:var(--de)"></i></div><span>${pd.done}/${pd.total}</span></div>
        <div class="progressline"><span class="dual"><span class="pt">PT</span></span><div class="bar"><i style="width:${Math.round(pp.done/pp.total*100)}%;background:var(--pt)"></i></div><span>${pp.done}/${pp.total}</span></div>
        <div class="small muted">${L.units.length} units · ${L.units.reduce((m,U)=>m+(U.vocab||[]).length,0)} words${L.scaffold?' · scaffold: fewer exercises, expand later':''}</div>
      </button>`;}).join('')}

    <p><b>Method and sources.</b> Level structure follows the CEFR “can-do” descriptors (Council of Europe). Unit topics follow the standard A1–C2 syllabus used by the Goethe-Institut (Start Deutsch, Goethe-Zertifikat) and by CAPLE/Camões for European Portuguese (CIPLE, DEPLE, DIPLE, DAPLE, DUPLE). Vocabulary was selected from frequency and learner lists and translated for this course; it has not yet been checked by a native speaker. Use the ⚑ flag on any item that looks wrong and export the flags from the menu so the item can be fixed.</p>

  $('#searchInput').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())go({page:'search',q:e.target.value.trim()});};

/* ---------- search ---------- */
function renderSearch(q){const ql=norm(q,true);const hits=[];for(const L of COURSE)for(const U of L.units)for(const v of (U.vocab||[]).concat(U.phrases||[])){if(['en','pt','de'].some(k=>norm(v[k],true).includes(ql)))hits.push({L,U,v});}
  app.innerHTML=crumbs([{t:'Home',go:'home'},{t:'Search'}])+`<h2>“${esc(q)}”</h2><p class="muted small">${hits.length} result${hits.length===1?'':'s'}</p>
  <div class="tablewrap"><table class="tri"><thead><tr><th></th><th>English</th><th>Português</th><th>Deutsch</th><th>Unit</th></tr></thead><tbody>
  ${hits.slice(0,200).map(h=>`<tr><td class="ico">${h.v.icon||''}</td><td>${esc(h.v.en)}</td><td class="pt">${esc(strip(h.v.pt))}</td><td class="de">${esc(strip(h.v.de))}</td><td><button class="btn sm" data-unit="${h.U.id}">${h.L.id} · ${esc(h.U.title)}</button></td></tr>`).join('')}
  </tbody></table></div>`;
  bindCommon();}

  app.innerHTML=crumbs([{t:'Home',go:'home'},{t:L.id}])+`
  <div class="stack">
    <div class="row"><h1>${L.id} <span class="muted" style="font-weight:500">${esc(L.name)}</span></h1></div>
    <p class="muted" style="max-width:65ch;margin:0">${esc(L.canDo)}</p>
    ${L.scaffold?`<div class="panel small"><b>Scaffold level.</b> ${esc(L.scaffold)}</div>`:''}
    <div class="units">
      ${L.units.map((U,i)=>`<button class="unit" data-unit="${U.id}">
        <span class="ico">${U.icon||'📘'}</span>
        <span><span style="font-weight:700">${i+1}. ${esc(U.title)}</span><br><span class="meta">${(U.vocab||[]).length} words · ${(U.phrases||[]).length} phrases · ${(U.grammar||[]).length} grammar${U.reading?' · reading':''}</span></span>
        <span class="dual"><span class="de">DE ${unitStatus(U,'de')}</span><span class="pt">PT ${unitStatus(U,'pt')}</span></span>

    </div>
  </div>`;
  bindCommon();}

/* ---------- unit ---------- */
function renderUnit(r){const f=findUnit(r.unit);if(!f)return renderHome();const {L,U}=f;const tab=r.tab||'learn';const t=target(),o=other();const p=uprog(U.id);
  const tabs=[['learn','Learn'],['phrases','Phrases'],['grammar','Grammar']];if(U.reading)tabs.push(['reading','Reading']);tabs.push(['practice','Practice']);
  let body='';
  if(tab==='learn'){
    const all=state.view==='table';
    body=`<div class="row" style="justify-content:space-between">
      <div class="seg" role="group" aria-label="View"><button class="${!all?'on':''}" data-view="cards">Cards</button><button class="${all?'on':''}" data-view="table">Table</button></div>
      <span class="small muted">${U.vocab.length} words</span></div>
    ${U.intro?`<p class="muted" style="max-width:65ch">${esc(U.intro)}</p>`:''}
    ${all?`<div class="tablewrap"><table class="tri"><thead><tr><th></th><th>English</th><th>Português</th><th>Deutsch</th><th></th></tr></thead><tbody>
      ${U.vocab.map((v,i)=>`<tr><td class="ico">${v.icon||''}</td><td>${esc(v.en)}${v.note?`<div class="small muted">${esc(v.note)}</div>`:''}</td><td class="pt">${esc(strip(v.pt))}</td><td class="de">${esc(strip(v.de))}</td><td><button class="iconbtn flag ${isFlagged(U.id+':v'+i)?'on':''}" data-flag="${U.id}:v${i}" data-ftext="${esc(v.en+' | '+v.pt+' | '+v.de)}" title="Flag as wrong">⚑</button></td></tr>`).join('')}
      </tbody></table></div>`
    :`<div class="vgrid">${U.vocab.map((v,i)=>`<div class="vcard">
        <div class="tools"><button class="iconbtn flag ${isFlagged(U.id+':v'+i)?'on':''}" data-flag="${U.id}:v${i}" data-ftext="${esc(v.en+' | '+v.pt+' | '+v.de)}" title="Flag as wrong">⚑</button></div>
        <div class="ico">${v.icon||'•'}</div>
        <div class="en">${esc(v.en)}</div>
        <div class="w pt" lang="pt-PT">${esc(strip(v.pt))}</div>
        <div class="w de" lang="de-DE">${esc(strip(v.de))}</div>
        ${v.note?`<div class="note">${esc(v.note)}</div>`:''}
      </div>`).join('')}</div>`}`;
  }else if(tab==='phrases'){
    body=`<div class="stack">${(U.phrases||[]).map((v,i)=>`<div class="phrase">
      <div class="tools" style="position:absolute;top:8px;right:8px"><button class="iconbtn flag ${isFlagged(U.id+':p'+i)?'on':''}" data-flag="${U.id}:p${i}" data-ftext="${esc(v.en+' | '+v.pt+' | '+v.de)}">⚑</button></div>
      <div class="en">${esc(v.en)}</div>
      <div class="w pt" lang="pt-PT">${esc(strip(v.pt))}</div>
      <div class="w de" lang="de-DE">${esc(strip(v.de))}</div>
      ${v.note?`<div class="small muted">${esc(v.note)}</div>`:''}
    </div>`).join('')}</div>`;
  }else if(tab==='grammar'){
    body=`<div class="stack">${(U.grammar||[]).map((g,i)=>`<div class="gram">
      <div class="row" style="justify-content:space-between"><h3>${esc(g.title)}</h3><button class="iconbtn flag ${isFlagged(U.id+':g'+i)?'on':''}" data-flag="${U.id}:g${i}" data-ftext="${esc('Grammar: '+g.title)}">⚑</button></div>
      <div class="explain">${esc(g.en)}</div>
      <div class="lang pt"><b>Português</b>${esc(g.pt)}</div>
      <div class="lang de"><b>Deutsch</b>${esc(g.de)}</div>
      ${g.table?renderGramTable(g.table):''}
      <div>${(g.examples||[]).map(e=>`<div class="ex"><div class="en">${esc(e.en)}</div><div class="pt">${markup(e.pt)}</div><div class="de">${markup(e.de)}</div></div>`).join('')}</div>
    </div>`).join('')}</div>`;
  }else if(tab==='reading'&&U.reading){
    const R=U.reading;const paras=k=>R[k].split('\n').map(x=>`<p>${esc(x)}</p>`).join('');
    body=`<div class="reading"><h3>${esc(R.title)}</h3>${R.intro?`<p class="muted small">${esc(R.intro)}</p>`:''}
      <div class="cols"><div class="col en"><b>English</b>${paras('en')}</div><div class="col pt"><b>Português</b>${paras('pt')}</div><div class="col de"><b>Deutsch</b>${paras('de')}</div></div>
      ${R.questions?`<h3 style="margin-top:14px">Check your understanding</h3><ol>${R.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol>`:''}</div>`;
  }else if(tab==='practice'){
    if(r.ex){body=`<div id="session"></div>`;}
    else body=`<p class="muted small" style="margin-top:0">Practising <b style="color:var(--${t})">${LANGS[t].name}</b> (change with the DE / PT switch at the top). Reach 70% in each exercise to complete the unit. <label style="white-space:nowrap"><input type="checkbox" id="lenientChk" ${state.lenient?'checked':''}> accept missing accents/articles when typing</label></p>
    <div class="exmenu">${EXERCISES.filter(e=>e.available(U)).map(e=>`<button class="exbtn" data-ex="${e.id}"><span class="t">${e.icon} ${e.name}</span><span class="s">${e.desc}</span>${p.best[e.id]!=null?`<span class="best">best ${p.best[e.id]}%</span>`:'<span class="s">not tried</span>'}</button>`).join('')}</div>`;
  }
  app.innerHTML=crumbs([{t:'Home',go:'home'},{t:L.id,go:'level:'+L.id},{t:U.title}])+`
    <div class="row" style="align-items:flex-start;margin-bottom:6px"><span style="font-size:2rem;line-height:1">${U.icon||''}</span><div><h1 style="font-size:1.5rem">${esc(U.title)}</h1><div class="small muted">${L.id} · Unit ${L.units.indexOf(U)+1} of ${L.units.length} · <span class="dual" style="display:inline-flex"><span class="de">DE ${unitStatus(U,'de')}</span><span class="pt">PT ${unitStatus(U,'pt')}</span></span></div></div></div>
    <div class="tabs">${tabs.map(([k,n])=>`<button class="tab ${tab===k?'active':''}" data-tab="${k}">${n}</button>`).join('')}</div>
    ${body}
    <div class="row" style="margin-top:24px;justify-content:space-between">${prevNext(L,U)}</div>`;
  app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go({...r,tab:b.dataset.tab,ex:null}));
  app.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{state.view=b.dataset.view;save();render();});
  app.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>go({...r,ex:b.dataset.ex}));
  const lc=$('#lenientChk');if(lc)lc.onchange=()=>{state.lenient=lc.checked;save();};
  bindCommon();
  if(tab==='practice'&&r.ex)startSession(U,r.ex,r);
}
function renderGramTable(tb){return `<div class="tablewrap"><table class="tri"><thead><tr>${tb.head.map((h,i)=>`<th class="${i===1?'pt':i===2?'de':''}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${tb.rows.map(row=>`<tr>${row.map((c,i)=>`<td class="${i===1?'pt':i===2?'de':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function prevNext(L,U){const i=L.units.indexOf(U);const prev=L.units[i-1],next=L.units[i+1];let nextL=null;if(!next){const li=COURSE.indexOf(L);if(COURSE[li+1])nextL=COURSE[li+1];}
  return `${prev?`<button class="btn" data-unit="${prev.id}">‹ ${esc(prev.title)}</button>`:'<span></span>'}${next?`<button class="btn primary" data-unit="${next.id}">${esc(next.title)} ›</button>`:nextL?`<button class="btn primary" data-level="${nextL.id}">Start ${nextL.id} ›</button>`:''}`;}
function bindCommon(){
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const g=b.dataset.go;if(g==='home')go({page:'home'});else if(g.startsWith('level:'))go({page:'level',level:g.slice(6)});});
  app.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{const f=findUnit(b.dataset.unit);if(f)go({page:'unit',level:f.L.id,unit:f.U.id,tab:'learn'});});
  app.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>go({page:'level',level:b.dataset.level}));
  app.querySelectorAll('[data-flag]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFlag(b.dataset.flag,b.dataset.ftext);});
}

/* ---------- exercises ---------- */
function clozeItems(U){const out=[];for(const g of (U.grammar||[]))for(const e of (g.examples||[])){const s=e[target()];const m=s.match(/\[([^\]]+)\]/);if(m)out.push({en:e.en,full:strip(s),answer:m[1],blank:s.replace(/\[[^\]]+\]/,'_____').replace(/\[|\]/g,'')});}return out;}
function sentenceItems(U){const items=(U.phrases||[]).map(p=>({en:p.en,s:strip(p[target()]).split(' / ')[0]}));for(const g of (U.grammar||[]))for(const e of (g.examples||[]))items.push({en:e.en,s:strip(e[target()])});return items.filter(x=>x.s.split(' ').length>=3&&x.s.split(' ').length<=12);}
const EXERCISES=[
 {id:'flash',name:'Flashcards',icon:'🃏',desc:'See the English, recall the word, flip to check.',available:U=>(U.vocab||[]).length>=4,
  build:U=>shuffle(U.vocab.map((v,i)=>({v,i}))).slice(0,20)},
 {id:'mc',name:'Pick the word',icon:'🎯',desc:'English prompt, four options in your target.',available:U=>(U.vocab||[]).length>=4,
  build:U=>shuffle(U.vocab).slice(0,12).map(v=>({v,opts:shuffle([v].concat(shuffle(U.vocab.filter(x=>x!==v)).slice(0,3)))}))},
 {id:'mcrev',name:'Recognise it',icon:'👀',desc:'Target word shown, pick the English meaning.',available:U=>(U.vocab||[]).length>=4,
  build:U=>shuffle(U.vocab).slice(0,12).map(v=>({v,opts:shuffle([v].concat(shuffle(U.vocab.filter(x=>x!==v)).slice(0,3)))}))},
 {id:'type',name:'Type it',icon:'⌨️',desc:'Write the word in your target language.',available:U=>(U.vocab||[]).length>=4,
  build:U=>shuffle(U.vocab).slice(0,10)},
 {id:'match',name:'Match pairs',icon:'🔗',desc:'Tap an English word, then its translation.',available:U=>(U.vocab||[]).length>=6,
  build:U=>{const rounds=[];const pool=shuffle(U.vocab);for(let i=0;i+6<=pool.length&&rounds.length<3;i+=6)rounds.push(pool.slice(i,i+6));return rounds;}},
 {id:'cloze',name:'Fill the gap',icon:'✍️',desc:'Grammar sentences with one word missing.',available:U=>clozeItems(U).length>=4,
  build:U=>{const all=clozeItems(U);return shuffle(all).slice(0,10).map(c=>({c,opts:shuffle([c.answer].concat(shuffle(all.map(x=>x.answer).filter(a=>a!==c.answer)).slice(0,3)))}));}},
 {id:'order',name:'Build the sentence',icon:'🧩',desc:'Put the shuffled words back in order.',available:U=>sentenceItems(U).length>=4,
  build:U=>shuffle(sentenceItems(U)).slice(0,8)}
];

function startSession(U,exId,r){const ex=EXERCISES.find(e=>e.id===exId);const box=$('#session');const items=ex.build(U);let idx=0,correct=0,total=0;const t=target(),o=other();
  const finish=()=>{if(!box.isConnected)return;const pct=total?Math.round(correct/total*100):0;const p=uprog(U.id);if((p.best[exId]||0)<pct){p.best[exId]=pct;}save();checkDone(U);
    box.innerHTML=`<div class="session"><div class="summary"><div class="score" style="color:${pct>=70?'var(--good)':'var(--warn)'}">${pct}%</div><div>${correct} of ${total} correct${pct>=70?' · passed':' · 70% needed, try again'}</div></div>
      <div class="row" style="justify-content:center"><button class="btn" id="again">Try again</button><button class="btn primary" id="back">Back to exercises</button></div></div>`;
    $('#again').onclick=()=>startSession(U,exId,r);$('#back').onclick=()=>go({...r,ex:null});};
  const head=()=>`<div class="progressline"><button class="btn sm ghost" id="quit">✕</button><div class="bar"><i style="width:${Math.round(idx/items.length*100)}%"></i></div><span>${idx+1}/${items.length}</span></div>`;
  const next=()=>{idx++;if(idx>=items.length)finish();else step();};
  const step=()=>{
    if(!box.isConnected)return;
    const it=items[idx];
    if(exId==='flash'){box.innerHTML=`<div class="session">${head()}<div class="card3d" id="card" tabindex="0" aria-label="Flashcard"><span class="ico">${it.v.icon||''}</span><span class="en" style="font-weight:600">${esc(it.v.en)}</span><span class="muted small">tap to reveal</span></div>
        <div class="row" id="ctrls" style="justify-content:center"><button class="btn" id="reveal">Show answer</button></div></div>`;
      let shown=false;const reveal=()=>{if(shown)return;shown=true;$('#card').innerHTML=`<span class="ico">${it.v.icon||''}</span><span class="w pt">${esc(strip(it.v.pt))}</span><span class="w de">${esc(strip(it.v.de))}</span><span class="small muted">${esc(it.v.en)}</span>${it.v.note?`<span class="small muted">${esc(it.v.note)}</span>`:''}`;
        $('#ctrls').innerHTML=`<button class="btn" id="no">✗ Didn't know</button><button class="btn primary" id="yes">✓ Knew it</button>`;
        $('#yes').onclick=()=>{correct++;total++;const k=uprog(U.id).known;if(!k.includes(it.i))k.push(it.i);next();};$('#no').onclick=()=>{total++;next();};};
      $('#card').onclick=reveal;$('#reveal').onclick=reveal;}
    else if(exId==='mc'||exId==='mcrev'){const rev=exId==='mcrev';box.innerHTML=`<div class="session">${head()}<div class="q"><span class="ico">${it.v.icon||''}</span><span class="muted small">${rev?'What does this mean?':'How do you say this in '+LANGS[t].name+'?'}</span><div class="prompt ${rev?t:''}" style="${rev?'color:var(--'+t+')':''}">${esc(rev?strip(it.v[t]):it.v.en)}</div></div>
        <div class="choices">${it.opts.map((op,i)=>`<button class="choice" data-i="${i}">${esc(rev?op.en:strip(op[t]))}</button>`).join('')}</div><div id="fb"></div></div>`;
      box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const op=it.opts[+b.dataset.i];total++;const ok=op===it.v;if(ok)correct++;box.querySelectorAll('.choice').forEach((x,i)=>{x.disabled=true;if(it.opts[i]===it.v)x.classList.add('ok');else if(x===b&&!ok)x.classList.add('ko');});
        $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ko'}">${ok?'Correct':'Not quite'}<span class="ans">${esc(it.v.en)} = <b style="color:var(--${t})">${esc(strip(it.v[t]))}</b> · <span style="color:var(--${o})">${esc(strip(it.v[o]))}</span></span></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" id="nx">Next ›</button></div>`;$('#nx').onclick=next;$('#nx').focus();});}
    else if(exId==='type'){box.innerHTML=`<div class="session">${head()}<div class="q"><span class="ico">${it.icon||''}</span><span class="muted small">Type it in ${LANGS[t].name}${it.pos==='noun'?' (with the article)':''}</span><div class="prompt">${esc(it.en)}</div>${it.note?`<div class="small muted">${esc(it.note)}</div>`:''}</div>
        <form class="typein" id="tf"><input id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Your answer"><button class="btn primary" type="submit">Check</button></form><div id="fb"></div></div>`;
      const inp=$('#ti');inp.focus();$('#tf').onsubmit=e=>{e.preventDefault();if(inp.disabled)return;const val=inp.value;if(!val.trim())return;total++;const ok=matches(val,it[t]);if(ok)correct++;inp.disabled=true;
        $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ko'}">${ok?'Correct':'Not quite'}<span class="ans"><b style="color:var(--${t})">${esc(strip(it[t]))}</b> · <span style="color:var(--${o})">${esc(strip(it[o]))}</span></span></div><div class="row" style="justify-content:flex-end;margin-top:8px">${ok?'':'<button class="btn" id="accept">I was right</button>'}<button class="btn primary" id="nx">Next ›</button></div>`;
        $('#nx').onclick=next;$('#nx').focus();const ac=$('#accept');if(ac)ac.onclick=()=>{correct++;next();};};}
    else if(exId==='match'){const pairs=it;const left=shuffle(pairs.map(v=>({v,side:'en'})));const right=shuffle(pairs.map(v=>({v,side:t})));let sel=null,left_=pairs.length,mist=0;
      box.innerHTML=`<div class="session">${head()}<div class="muted small">Tap a pair: English on the left, ${LANGS[t].name} on the right.</div><div class="matchgrid" id="mg">${left.map((c,i)=>`<button class="mcell en" data-side="en" data-k="${pairs.indexOf(c.v)}">${esc(c.v.en)}</button><button class="mcell ${t}" data-side="t" data-k="${pairs.indexOf(right[i].v)}">${esc(strip(right[i].v[t]))}</button>`).join('')}</div></div>`;
      box.querySelectorAll('.mcell').forEach(b=>b.onclick=()=>{if(sel&&sel.dataset.side===b.dataset.side){sel.classList.remove('sel');sel=b;b.classList.add('sel');return;}if(!sel){sel=b;b.classList.add('sel');return;}
        if(sel.dataset.k===b.dataset.k){sel.classList.add('gone');b.classList.add('gone');sel.classList.remove('sel');sel=null;left_--;if(left_===0){total+=pairs.length;correct+=Math.max(0,pairs.length-mist);setTimeout(next,350);}}
        else{mist++;sel.classList.add('ko');b.classList.add('ko');const a=sel;sel=null;setTimeout(()=>{a.classList.remove('sel','ko');b.classList.remove('ko');},450);}});}
    else if(exId==='cloze'){box.innerHTML=`<div class="session">${head()}<div class="q"><span class="muted small">${esc(it.c.en)}</span><div class="prompt" style="color:var(--${t})">${esc(it.c.blank)}</div></div>
        <div class="choices">${it.opts.map((op,i)=>`<button class="choice" data-i="${i}">${esc(op)}</button>`).join('')}</div><div id="fb"></div></div>`;
      box.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const op=it.opts[+b.dataset.i];total++;const ok=op===it.c.answer;if(ok)correct++;box.querySelectorAll('.choice').forEach((x,i)=>{x.disabled=true;if(it.opts[i]===it.c.answer)x.classList.add('ok');else if(x===b&&!ok)x.classList.add('ko');});
        $('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ko'}">${ok?'Correct':'Not quite'}<span class="ans" style="color:var(--${t})">${esc(it.c.full)}</span></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" id="nx">Next ›</button></div>`;$('#nx').onclick=next;$('#nx').focus();});}
    else if(exId==='order'){const words=it.s.split(' ');let pool=shuffle(words.map((w,i)=>({w,i})));if(pool.map(x=>x.w).join(' ')===it.s)pool=pool.reverse();let built=[];
      const draw=()=>{$('#built').innerHTML=built.map((x,i)=>`<button class="chip ${t}" data-b="${i}">${esc(x.w)}</button>`).join('')||'<span class="muted small">tap words below</span>';$('#pool').innerHTML=pool.map((x,i)=>`<button class="chip" data-p="${i}">${esc(x.w)}</button>`).join('');
        box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{built.push(pool.splice(+b.dataset.p,1)[0]);draw();});box.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{pool.push(built.splice(+b.dataset.b,1)[0]);draw();});
        $('#chk').disabled=pool.length>0;};
      box.innerHTML=`<div class="session">${head()}<div class="q"><span class="muted small">Build this sentence in ${LANGS[t].name}</span><div class="prompt">${esc(it.en)}</div></div><div class="chips" id="built"></div><div class="chips" id="pool" style="border-style:solid"></div><div class="row" style="justify-content:flex-end"><button class="btn primary" id="chk">Check</button></div><div id="fb"></div></div>`;draw();
      $('#chk').onclick=()=>{total++;const ok=built.map(x=>x.w).join(' ')===it.s;if(ok)correct++;$('#fb').innerHTML=`<div class="feedback ${ok?'ok':'ko'}">${ok?'Correct':'Not quite'}<span class="ans" style="color:var(--${t})">${esc(it.s)}</span></div><div class="row" style="justify-content:flex-end;margin-top:8px"><button class="btn primary" id="nx">Next ›</button></div>`;$('#chk').disabled=true;box.querySelectorAll('.chip').forEach(c=>c.disabled=true);$('#nx').onclick=next;$('#nx').focus();};}
    $('#quit').onclick=()=>go({...r,ex:null});
  };
  if(!items.length){box.innerHTML='<div class="panel">Not enough material in this unit for this exercise.</div>';return;}
  step();
}

/* ---------- menu / export ---------- */
function openMenu(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="box" role="dialog" aria-label="Menu">
  <div class="row" style="justify-content:space-between"><h2>Menu</h2><button class="btn sm" id="close">Close</button></div>
  <div class="stack">
    <div><b>Theme</b><div class="seg" style="margin-top:6px"><button data-th="">Auto</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div></div>
    <div><b>Progress</b><p class="small muted" style="margin:4px 0">Saved in this browser only. Copy it here and paste it on the other phone to move it.</p>
      <div class="row"><button class="btn sm" id="exp">Copy progress</button><button class="btn sm" id="imp">Paste progress…</button><button class="btn sm" id="reset">Reset ${LANGS[state.lang].short} progress</button></div>
      <textarea id="ta" placeholder="Paste exported progress here, then press Import" style="display:none"></textarea><button class="btn sm primary" id="doimp" style="display:none">Import</button></div>
    <div><b>Flagged items (${state.flags.length})</b><p class="small muted" style="margin:4px 0">Items you marked ⚑ as wrong or doubtful. Copy the list and send it to Claude to get them fixed.</p>
      <div class="row"><button class="btn sm" id="copyflags" ${state.flags.length?'':'disabled'}>Copy flags</button><button class="btn sm" id="clearflags" ${state.flags.length?'':'disabled'}>Clear flags</button></div>
      ${state.flags.length?`<ul class="small" style="margin:8px 0 0;padding-left:18px">${state.flags.map(f=>`<li>${esc(f.text)} <span class="muted">(${esc(f.who)}, ${f.when})</span></li>`).join('')}</ul>`:''}</div>
    <div class="small muted">Obrigado · Danke — a trilingual course for two. Content generated for private study; flag errors and they get corrected.</div>
  </div></div>`;
  document.body.appendChild(m);const close=()=>m.remove();$('#close',m).onclick=close;m.onclick=e=>{if(e.target===m)close();};
  m.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{const v=b.dataset.th;if(v)document.documentElement.setAttribute('data-theme',v);else document.documentElement.removeAttribute('data-theme');store.set('theme',v);});
  const copy=async(txt,ok)=>{try{await navigator.clipboard.writeText(txt);toast(ok);}catch(e){const ta=$('#ta',m);ta.style.display='block';ta.value=txt;ta.select();toast('Select and copy the text');}};
  $('#exp',m).onclick=()=>copy(JSON.stringify({progress:state.progress,flags:state.flags}),'Progress copied');
  $('#imp',m).onclick=()=>{$('#ta',m).style.display='block';$('#doimp',m).style.display='inline-flex';$('#ta',m).value='';$('#ta',m).focus();};
  $('#doimp',m).onclick=()=>{try{const d=JSON.parse($('#ta',m).value);if(d.progress)state.progress=Object.assign({},state.progress,d.progress);if(d.flags)state.flags=d.flags;save();render();toast('Imported');close();}catch(e){toast('That is not valid progress data');}};
  $('#reset',m).onclick=()=>{if(m.dataset.confirm){delete state.progress[state.lang];save();render();toast('Progress reset');close();}else{m.dataset.confirm='1';$('#reset',m).textContent='Tap again to confirm';}};
  $('#copyflags',m).onclick=()=>copy(state.flags.map(f=>`- [${f.who}, ${f.when}] ${f.text}`).join('\n'),'Flags copied');
  $('#clearflags',m).onclick=()=>{state.flags=[];save();close();render();};
}

/* ---------- boot ---------- */
(function(){const th=store.get('theme','');if(th)document.documentElement.setAttribute('data-theme',th);})();
$('#brandBtn').onclick=()=>go({page:'home'});
$('#menuBtn').onclick=openMenu;
document.querySelectorAll('#langSeg [data-lang]').forEach(b=>b.onclick=()=>{if(state.lang===b.dataset.lang)return;state.lang=b.dataset.lang;save();const r=state.route;if(r.page==='unit'&&r.ex)state.route={...r,ex:null};render();toast('Practising '+LANGS[state.lang].name);});
state.route=fromHash();render();
})();
</script>
